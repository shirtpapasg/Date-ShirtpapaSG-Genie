    // beat 2 events
    op(qBub, win(t, 23.0, 24.7, .25)); set(qBub, "transform", `translate(${SG[0] - 40} ${SG[1] - 60}) scale(${pop(t, 23.0) * Math.max(inv * 1.6, .8)}) translate(${-(SG[0] - 40)} ${-(SG[1] - 60)})`);
    op(stamp, win(t, 24.7, 26.3, .2)); set(stamp, "transform", `translate(${SG[0]} ${SG[1] + 55}) rotate(-10) scale(${(1.6 - .6 * ramp(t, 24.7, 24.95)) * Math.max(inv * 1.6, .8)}) translate(${-SG[0]} ${-(SG[1] + 55)})`);
    op(chDry, win(t, 26.4, 34.9, .3));
    op(chMon, win(t, 34.9, 42.0, .3));
    ["sum", "kal"].forEach((k, i) => { const a = [28.9, 30.2][i]; const on = win(t, a, a + 1.6, .25); set(LBL[k], "fill", mix("#6b5a3c", "#d9443b", on)); });
    op($("indo"), .45 * win(t, 31.3, 33.3, .3)); op(indoLbl, win(t, 31.4, 33.3, .3));
    set(LBL.mal, "fill", mix("#6b5a3c", "#d9443b", win(t, 33.4, 34.9, .25)));
    op($("wind"), ramp(t, 36.4, 37.2) * (1 - ramp(t, 44.2, 44.6)));
    winds.forEach(w => set(w, "stroke-dashoffset", -t * 90));
    const pOn = ramp(t, 38.3, 39.0);
    puffs.forEach(p => { const k = ((t * .2 + p.ph) % 1); const dx = 330, dy = -400;
      set(p.e, "cx", p.src[0] + dx * k + p.jx * k); set(p.e, "cy", p.src[1] + dy * k + p.jy * k); set(p.e, "r", p.r * (.6 + k * 1.6)); op(p.e, pOn * .5 * Math.sin(k * Math.PI)); });
    op($("mapHaze"), .3 * ramp(t, 40.0, 41.2) * (1 - ramp(t, 44.0, 44.5)));
    const tr = ramp(t, 42.2, 44.1);
    op(truck, win(t, 42.1, 44.3, .2));
    set(truck, "transform", `translate(${lerp(F1[0], SG[0] - 10, tr)} ${lerp(F1[1], SG[1] + 40, tr) - 16}) scale(1.5)`);
    op(causeTag, win(t, 44.5, 46.4, .2)); set(causeTag, "transform", `translate(${F1[0]} ${F1[1]}) scale(${pop(t, 44.5) * Math.max(inv * 1.4, .45)}) translate(${-F1[0]} ${-F1[1]})`);
  }

  /* ---- P ---- */
  if (vP > 0) {
    const c = camAt(PK, t, ["x", "y", "s"]);
    set($("camP"), "transform", `translate(960 540) scale(${c.s}) translate(${-c.x} ${-c.y})`);
    // beat 3
    op($("pQ"), win(t, 46.8, 52.2, .3));
    op(chNotSoil, win(t, 50.8, 52.6, .25));
    op($("pPeat"), win(t, 52.6, 54.5, .25)); set($("pPeat"), "transform", `translate(960 560) scale(${pop(t, 52.6)}) translate(-960 -560)`);
    set($("pGround"), "fill", mix("#3b2a1d", "#7d8f86", ramp(t, 54.2, 54.6)));
    layers.forEach((g, i) => { const a = ramp(t, 54.6 + i * .45, 54.95 + i * .45); op(g, a); set(g, "transform", `translate(0 ${(1 - a) * -30 + (i === NL - 1 ? -6 * win(t, 65.7, 66.4, .2) : 0)})`); });
    const fillK = clamp((t - 54.6) / (NL * .45));
    leaves.forEach(l => { const k = ((t * .45 + l.ph) % 1); set(l.e, "cx", l.x + Math.sin(k * 8 + l.x) * 20); set(l.e, "cy", lerp(200, LB - fillK * (LB - LT), k)); op(l.e, (ramp(t, 54.6, 55.0) * (1 - ramp(t, 59.0, 59.6)) + win(t, 65.6, 66.6, .2)) * Math.min(1, (1 - k) * 4)); });
    op($("pSide"), win(t, 57.7, 63.4, .3));
    // water: rises 59.4 -> 60.6, drains 72.0 -> 73.8
    const wl = lerp(lerp(LB, LT + 24, ease(ramp(t, 59.4, 60.6))), 700, ease(ramp(t, 72.0, 73.8)));
    let wd = `M-600 ${LB} L-600 ${wl}`; for (let x = -600; x <= 2520; x += 40) wd += ` L${x} ${wl + Math.sin(x / 70 + t * 2) * 6}`; wd += ` L2520 ${LB} Z`;
    set($("pWater"), "d", wd); op($("pWater"), .2 * ramp(t, 59.4, 59.8));
    op(chWet, win(t, 61.6, 69.0, .3)); op(chRot, win(t, 63.5, 69.0, .3)); op(chCarb, win(t, 66.4, 69.0, .3));
    carbons.forEach(cb => op(cb.g, win(t, 66.6 + cb.d * 1.4, 69.0, .25) * (.75 + .25 * Math.sin(t * 3 + cb.d * 9))));
    // beat 4
    op($("pDigger"), win(t, 69.5, 74.0, .3));
    set($("pDigger"), "transform", `translate(${lerp(-200, 560, ease(ramp(t, 69.5, 70.8)))} 340)`);
    set(arm, "transform", `rotate(${Math.sin(t * 4) * 6 * ramp(t, 70.8, 71.0)} 20 -50)`);
    op($("pCanal"), ramp(t, 70.9, 71.4));
    drainArrows.forEach((a, i) => { const k = ((t - 72) * .8 + i * .25) % 1; op(a, win(t, 72.0, 74.4, .3) * (.4 + .6 * Math.sin(k * Math.PI))); set(a, "transform", `translate(${-k * 60} 0)`); });
    op($("pTrees"), 1 - ramp(t, 73.6, 74.2)); op($("pPalms"), ramp(t, 73.8, 74.4));
    op($("pDry"), .45 * ramp(t, 74.6, 75.8)); op($("pCracks"), ramp(t, 75.2, 75.8));
    op(chFuel, win(t, 77.2, 80.8, .25));
    const fOn = ramp(t, 78.9, 79.3);
    op(pfGlow, fOn * (1 - .4 * ramp(t, 89.9, 90.6))); set(pfGlow, "rx", 220 * flick);
    flames.forEach((f, i) => { const h = (60 + 40 * Math.sin(t * 9 + f.ph) + 30 * Math.sin(t * 13 + i)) * fOn * (1 - .6 * ramp(t, 89.9, 90.6));
      set(f.e, "d", `M${f.x - 22} 340 Q${f.x - 14} ${340 - h * .5} ${f.x + Math.sin(t * 7 + i) * 8} ${340 - h} Q${f.x + 14} ${340 - h * .5} ${f.x + 22} 340 Z`); op(f.e, fOn); });
    const u = ease(ramp(t, 82.9, 86.4));
    set(under, "rx", 650 * u * (1 + .04 * flick)); set(under, "ry", 150 * u); op(under, .9 * u);
    embers.forEach((m, i) => { set(m.e, "cx", 1250 + m.x * 1200 * u); set(m.e, "cy", 470 + m.y * 260 * u); op(m.e, u * (.5 + .5 * Math.sin(t * 6 + i))); });
    op($("pDepth"), win(t, 85.3, 87.8, .25));
    op(chWeeks, win(t, 86.6, 89.8, .25)); weeksDay.textContent = "day " + Math.max(1, Math.round(lerp(1, 28, ramp(t, 86.8, 88.6))));
    // helicopter
    op($("pHeli"), win(t, 87.9, 91.4, .3));
    const hx = lerp(2300, 1250, ease(ramp(t, 87.9, 88.9))), hy = 120 + Math.sin(t * 2) * 6;
    set($("pHeli"), "transform", `translate(${hx} ${hy})`);
    set(rotor, "transform", `scale(${Math.cos(t * 40)} 1)`);
    drops.forEach(d => { const k = ((t - 89) * 1.3 + d.ph) % 1; const on = win(t, 89.0, 90.8, .2);
      set(d.e, "cx", 1250 + d.dx); set(d.e, "cy", hy + 150 + k * (340 - hy - 150)); op(d.e, on * (k > 0 ? 1 : 0)); });
    set(splash, "rx", 160 * ramp(t, 89.3, 89.9)); op(splash, .7 * win(t, 89.3, 91.0, .3));
    op(chWater, win(t, 89.9, 91.6, .25));
    o2s.forEach((o, i) => { const k = ((t - 91.6) * .45 + o.ph) % 1; set(o.g, "transform", `translate(${o.x} ${lerp(80, 330, k)}) scale(.9)`); op(o.g, win(t, 91.7, 94.6, .3) * (i < 4 ? 1 : 0) * Math.min(1, (1 - k) * 3)); });
    op(chO2, win(t, 93.2, 94.7, .25));
    op(eq, win(t, 94.7, 99.0, .3)); op(eqA, ramp(t, 94.9, 95.2)); op(eqB, ramp(t, 95.6, 95.9));
    bigSmoke.forEach((b, i) => { const on = ramp(t, 98.9 + (i % 6) * .12, 99.6 + (i % 6) * .12); const k = clamp((t - 98.9) / 2.2);
      set(b.e, "cx", b.x + Math.sin(i) * 80 * k); set(b.e, "cy", lerp(380, -100, k * (.5 + b.ph * .5))); set(b.e, "r", b.r * (.4 + k)); op(b.e, on * .9); });
  }

  /* ---- end card ---- */
  if (vE > 0) { ["e1", "e2", "e3"].forEach((id, i) => { op($(id), ramp(t, 101.1 + i * .5, 101.5 + i * .5)); }); }

  /* ---- captions ---- */
  capEls.forEach(({c, g, spans}) => {
    const a = ramp(t, c.t0, c.t0 + .12) * (1 - ramp(t, c.t1 - .1, c.t1));
    op(g, a);
    set(g, "transform", `translate(960 960) scale(${.94 + .06 * ramp(t, c.t0, c.t0 + .15)}) translate(-960 -960)`);
    if (!c.phrase && a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .05 && (i === c.w.length - 1 || t < c.w[i + 1].a - .05) ? "#ffcf5a" : "#fff"));
  });
  op($("shade"), 1 - vE); op($("tag"), ramp(t, 5.4, 6.0) * (1 - vE));
  op($("flash"), .5 * (win(t, 12.55, 12.95, .2) + win(t, 46.05, 46.45, .2) + win(t, 100.55, 100.95, .2)));
  op($("fade"), Math.max(1 - ramp(t, 0, .4), ramp(t, END - .6, END)));
};
window.render(0);
</script>
