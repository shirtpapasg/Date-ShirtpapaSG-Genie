<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}

<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">💨 TheOneApp, Explained - Is Air Matter?</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 8: is air nothing? the matter test) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
function bottle(p, fill) { const g = el("g", {}, p); const cp = "bt" + Math.floor(rnd() * 1e9);
  const c = el("clipPath", {id: cp}, $("v").querySelector("defs")); el("path", {d: "M-60 -110 H60 V140 Q60 160 40 160 H-40 Q-60 160 -60 140 Z"}, c);
  const w = el("rect", {x: -60, width: 120, fill: "#4cc9f0", "clip-path": `url(#${cp})`}, g); g.cap = el("rect", {x: -22, y: -160, width: 44, height: 50, rx: 6, fill: "#3a86ff", stroke: INK, "stroke-width": 5}, g);
  el("path", {d: "M-60 -110 H60 V140 Q60 160 40 160 H-40 Q-60 160 -60 140 Z", fill: "#ffffff55", stroke: INK, "stroke-width": 6}, g);
  g.level = k => { set(w, "y", 160 - 270 * k); set(w, "height", 270 * k); }; g.level(fill); return g; }
function balance(p) { const g = el("g", {}, p); el("path", {d: "M-120 330 L120 330 L20 0 L-20 0 Z", fill: "#adb5bd", stroke: INK, "stroke-width": 6}, g);
  const beam = el("rect", {x: -360, y: -12, width: 720, height: 24, rx: 12, fill: "#6c757d", stroke: INK, "stroke-width": 6}, g); el("circle", {r: 22, fill: "#ffd166", stroke: INK, "stroke-width": 6}, g);
  const pans = [-1, 1].map(sd => { const pg = el("g", {}, g); el("line", {x1: -80, y1: 150, x2: 0, y2: 0, stroke: INK, "stroke-width": 4}, pg); el("line", {x1: 80, y1: 150, x2: 0, y2: 0, stroke: INK, "stroke-width": 4}, pg);
    el("path", {d: "M-110 150 H110 Q90 190 0 190 Q-90 190 -110 150 Z", fill: "#ced4da", stroke: INK, "stroke-width": 6}, pg); return pg; });
  g.tilt = th => { tf(beam, `rotate(${th * 180 / Math.PI})`); pans.forEach((pg, i) => { const sd = i ? 1 : -1; tf(pg, `translate(${sd * 340 * Math.cos(th)} ${sd * 340 * Math.sin(th)})`); }); };
  g.panPos = (i, th) => { const sd = i ? 1 : -1; return [sd * 340 * Math.cos(th), sd * 340 * Math.sin(th) + 150]; }; g.tilt(0); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#a2d2ff", "#cdb4db");
  s.q = tx(s.stage, {x: 760, y: 260, "text-anchor": "middle", "font-size": 110, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 14}, "AIR = nothing?");
  s.wind = emo(s.stage, 0, 0, 170, "💨"); s.no = chip(s.stage, "✗ NO!", "#e63946", {fs: 60});
  s.items = [["💨", "air"], ["🪨", "rock"], ["🥤", "water"]].map(([e, n]) => { const g = el("g", {}, s.stage); emo(g, 0, 0, 130, e); tx(g, {x: 0, y: 110, "text-anchor": "middle", "font-size": 36, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 7}, n); return g; });
  s.eq = chip(s.stage, "all are MATTER", "#7209b7", {fs: 44}); s.eye = emo(s.stage, 0, 0, 130, "🙈"); s.test = chip(s.stage, "🧪 THE MATTER TEST", "#06d6a0", {fs: 46});
  s.run = t => { const a = w => C("hook", w); const row = ramp(t, a("matter") - .3, a("matter"));
    op(s.q, 1 - row); tf(s.q, `translate(760 260) scale(${pop(t, .3)}) translate(-760 -260)`);
    op(s.wind, 1 - row); set(s.wind, "x", 760 + Math.sin(t * 3) * 30); set(s.wind, "y", 520);
    op(s.no, on(t, a("no"), a("matter"), .2)); popAt(s.no, 1100, 520, t, a("no"));
    const ts = [a("matter"), a("rock"), a("water")]; s.items.forEach((g, i) => { op(g, ramp(t, ts[i], ts[i] + .2)); tf(g, `translate(${420 + i * 340} 360) scale(${pop(t, ts[i])})`); });
    op(s.eq, ramp(t, a("water") + .3, a("water") + .5)); popAt(s.eq, 760, 600, t, a("water") + .3);
    op(s.eye, ramp(t, a("invisible"), a("invisible") + .2)); set(s.eye, "x", 1180); set(s.eye, "y", 620);
    op(s.test, ramp(t, a("test"), a("test") + .2)); popAt(s.test, 760, 780, t, a("test")); }; return s; })();

// ---- WHAT IS MATTER
S.what = (() => { const s = scene("what", "#ffd6a5", "#ffadad");
  s.bub = el("g", {}, s.stage); el("path", {d: "M-330 -80 H330 A40 40 0 0 1 370 -40 V40 A40 40 0 0 1 330 80 H-150 L-220 140 L-210 80 H-330 A40 40 0 0 1 -370 40 V-40 A40 40 0 0 1 -330 -80 Z", fill: "#fff", stroke: INK, "stroke-width": 7}, s.bub);
  tx(s.bub, {x: 0, y: 16, "text-anchor": "middle", "font-size": 50, "font-weight": 700, fill: INK}, "😟 What's the matter?"); s.wrong = chip(s.stage, "= What's wrong?", "#6c757d", {fs: 38});
  s.sci = chip(s.stage, "🔬 In SCIENCE, matter means…", "#3a86ff", {fs: 40});
  s.card = el("g", {}, s.stage); el("rect", {x: -560, y: -150, width: 1120, height: 300, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, s.card);
  tx(s.card, {x: 0, y: -70, "text-anchor": "middle", "font-size": 56, "font-weight": 700, fill: "#7209b7"}, "MATTER = anything that");
  s.m1 = tx(s.card, {x: -270, y: 60, "text-anchor": "middle", "font-size": 50, "font-weight": 700, fill: "#ef476f"}, "⚖️ has MASS"); s.plus = tx(s.card, {x: 0, y: 60, "text-anchor": "middle", "font-size": 60, "font-weight": 700, fill: INK}, "+"); s.m2 = tx(s.card, {x: 280, y: 60, "text-anchor": "middle", "font-size": 50, "font-weight": 700, fill: "#3a86ff"}, "📦 takes up SPACE");
  s.run = t => { const a = w => C("what", w); const d = ramp(t, a("science") - .3, a("science"));
    op(s.bub, ramp(t, a("everyday"), a("everyday") + .2) * (1 - d)); tf(s.bub, `translate(760 300) scale(${pop(t, a("everyday"))})`);
    op(s.wrong, ramp(t, a("wrong"), a("wrong") + .2) * (1 - d)); popAt(s.wrong, 760, 520, t, a("wrong"));
    op(s.sci, d * (1 - ramp(t, a("matter#3") - .3, a("matter#3")) * .0)); popAt(s.sci, 760, 180, t, a("science"));
    op(s.card, ramp(t, a("matter#3"), a("matter#3") + .2)); tf(s.card, `translate(760 500) scale(${pop(t, a("matter#3"))})`);
    op(s.m1, ramp(t, a("mass"), a("mass") + .2)); op(s.plus, ramp(t, a("mass"), a("mass") + .2)); op(s.m2, ramp(t, a("space"), a("space") + .2)); }; return s; })();

// ---- MASS
S.mass = (() => { const s = scene("mass", "#caffbf", "#9bf6ff");
  seed = 11; s.bal = balance(s.stage); s.b1 = bottle(s.stage, .9); s.b2 = bottle(s.stage, .15);
  s.c1 = chip(s.stage, "MASS = the amount of matter in an object", "#ef476f", {fs: 40}); s.l1 = chip(s.stage, "FULL: more matter", "#3a86ff", {fs: 30}); s.l2 = chip(s.stage, "nearly empty", "#6c757d", {fs: 30});
  s.c2 = chip(s.stage, "tilts towards the HEAVIER one ⬇", "#1b1b3a", {fs: 34});
  s.run = t => { const a = w => C("mass", w); const on2 = ramp(t, a("balance") - .2, a("balance") + .6), th = .2 * ramp(t, a("tilts"), a("tilts") + .8);
    op(s.bal, ramp(t, a("balance") - .4, a("balance"))); tf(s.bal, "translate(760 430)"); s.bal.tilt(-th);
    const p1 = s.bal.panPos(0, -th), p2 = s.bal.panPos(1, -th);
    op(s.b1, ramp(t, a("full") - .3, a("full"))); tf(s.b1, `translate(${lerp(560, 760 + p1[0], on2)} ${lerp(560, 430 + p1[1] - 90, on2)}) scale(${lerp(1, .55, on2)})`);
    op(s.b2, ramp(t, a("empty") - .3, a("empty"))); tf(s.b2, `translate(${lerp(960, 760 + p2[0], on2)} ${lerp(560, 430 + p2[1] - 90, on2)}) scale(${lerp(1, .55, on2)})`);
    op(s.c1, ramp(t, a("amount"), a("amount") + .2)); popAt(s.c1, 760, 160, t, a("amount"));
    op(s.l1, on(t, a("full"), a("balance"), .2)); popAt(s.l1, 560, 780, t, a("full")); op(s.l2, on(t, a("empty"), a("balance"), .2)); popAt(s.l2, 960, 780, t, a("empty"));
    op(s.c2, ramp(t, a("tilts"), a("tilts") + .2)); popAt(s.c2, 760, 250, t, a("tilts")); }; return s; })();

// ---- SPACE + VOLUME
S.space = (() => { const s = scene("space", "#bde0fe", "#a2d2ff");
  seed = 12; s.bot = bottle(s.stage, 1); s.jug = el("g", {}, s.stage); s.stream = el("path", {d: "M601 253 Q572 290 562 380", fill: "none", stroke: "#4cc9f0", "stroke-width": 16, "stroke-linecap": "round"}, s.jug);
  { const jb = el("g", {transform: "translate(720 270) rotate(-35)"}, s.jug); const jc = "jug" + Math.floor(rnd() * 1e9); const cpj = el("clipPath", {id: jc}, $("v").querySelector("defs"));
    const JB = "M-60 -70 L-88 -84 L-62 -56 L-50 72 Q-48 84 -36 84 L36 84 Q48 84 50 72 L60 -70 Z"; el("path", {d: JB}, cpj);
    const wg = el("g", {"clip-path": `url(#${jc})`}, jb); el("rect", {x: -200, y: -15, width: 400, height: 300, fill: "#4cc9f0", transform: "rotate(35)"}, wg);
    el("path", {d: "M58 -48 Q118 -40 106 12 Q98 50 52 44", fill: "none", stroke: INK, "stroke-width": 10, "stroke-linecap": "round"}, jb);
    el("path", {d: JB, fill: "#ffffff55", stroke: INK, "stroke-width": 6, "stroke-linejoin": "round"}, jb); }
  s.bot.cap.remove();
  s.drops = []; for (let i = 0; i < 10; i++) s.drops.push({ph: i / 10, sd: i % 2 ? 1 : -1, e: emo(s.stage, 0, 0, 44, "💧")});
  s.c1 = chip(s.stage, "FULL: no room for more!", "#e63946", {fs: 36}); s.c2 = chip(s.stage, "the water inside is already TAKING UP THE SPACE", "#3a86ff", {fs: 32});
  s.cube = el("g", {}, s.stage); el("rect", {x: -120, y: -120, width: 240, height: 240, fill: "#ffd16688", stroke: INK, "stroke-width": 6, "stroke-dasharray": "16 10"}, s.cube); emo(s.cube, 0, 0, 120, "🧸");
  s.c3 = chip(s.stage, "VOLUME = the amount of space an object takes up", "#7209b7", {fs: 32});
  s.run = t => { const a = w => C("space", w); const v = ramp(t, a("volume") - .4, a("volume"));
    op(s.bot, 1 - v); tf(s.bot, "translate(560 520) scale(1.3)");
    op(s.jug, on(t, a("pour") - .2, a("inside"), .2)); set(s.stream, "d", `M601 253 Q${572 + Math.sin(t * 9) * 4} 290 562 380`); set(s.stream, "stroke-width", 15 + Math.sin(t * 13) * 2);
    s.drops.forEach(d => { const k = ((t * .9 + d.ph) % 1); set(d.e, "x", 560 + d.sd * (80 + k * 60)); set(d.e, "y", lerp(300, 740, k)); op(d.e, on(t, a("overflows"), a("inside") + 1, .2) * Math.sin(k * Math.PI)); });
    op(s.c1, on(t, a("full"), a("volume") - .4, .2)); popAt(s.c1, 1120, 360, t, a("full"));
    op(s.c2, on(t, a("inside"), a("volume") - .4, .2)); popAt(s.c2, 900, 820, t, a("inside"));
    op(s.cube, v); tf(s.cube, `translate(760 450) scale(${pop(t, a("volume") - .2)})`);
    op(s.c3, ramp(t, a("volume"), a("volume") + .2)); popAt(s.c3, 760, 720, t, a("volume")); }; return s; })();

// ---- NON-MATTER
S.non = (() => { const s = scene("non", "#3c096c", "#5a189a");
