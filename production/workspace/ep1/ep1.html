<html><head><meta charset="utf-8">

<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">⚙ TheOneApp, Explained - Systems</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES =================== */
const S = {};
// ---- HOOK
S.hook = (() => { const s = scene("hook", "#4cc9f0", "#7209b7");
  s.bike = makeBike(s.stage); s.icons = [["🧍", 330, 230, "body", "body"], ["🌳", 760, 210, "tree", "tree"], ["📚", 1190, 230, "study", "study"]].map(([e, x, y, w]) => ({e: emo(s.stage, 0, 0, 110, e), x, y, w}));
  s.seven = el("g", {}, s.stage); el("circle", {r: 92, fill: "#ffbe0b", stroke: INK, "stroke-width": 7}, s.seven); tx(s.seven, {x: 0, y: 46, "text-anchor": "middle", "font-size": 130, "font-weight": 700, fill: INK}, "7");
  s.q = []; for (let i = 0; i < 5; i++) s.q.push(tx(s.stage, {"font-size": 120, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10, "text-anchor": "middle"}, "?"));
  s.which = tx(s.stage, {x: 760, y: 220, "text-anchor": "middle", "font-size": 110, "font-weight": 700, fill: "#ffe14d", class: "out", "stroke-width": 14}, "WHICH ONE?");
  s.run = t => { const T0 = SC.hook.t0;
    const bs = .8; tf(s.bike.g, `translate(${760 + Math.sin(t * 40) * 8 * on(t, C("hook", "nowhere"), C("hook", "nowhere") + .8, .1)} 520) scale(${bs * Math.max(0, pop(t, T0 + .05))})`);
    s.bike.animate(t * 40, t * 30, -t * 30);
    popAt(s.seven, 1310, 470, t, C("hook", "seven")); op(s.seven, on(t, C("hook", "seven"), C("hook", "which"), .2));
    s.q.forEach((q, i) => { set(q, "x", 300 + i * 230); set(q, "y", 260 + Math.sin(t * 6 + i) * 20); op(q, on(t, C("hook", "lose"), C("hook", "which") - .1, .2)); });
    op(s.which, on(t, C("hook", "which"), C("hook", "stay"), .2)); tf(s.which, `translate(760 220) scale(${pop(t, C("hook", "which"))}) translate(-760 -220)`);
    s.icons.forEach(ic => { op(ic.e, ramp(t, C("hook", ic.w), C("hook", ic.w) + .2)); popAt(ic.e, ic.x, ic.y, t, C("hook", ic.w)); });
  }; return s; })();

// ---- BIKE
S.bike = (() => { const s = scene("bike", "#8ecae6", "#caf0f8");
  el("rect", {x: 0, y: 690, width: 1920, height: 400, fill: "#80ed99"}, s.stage); el("rect", {x: 0, y: 690, width: 1920, height: 14, fill: "#57cc99"}, s.stage);
  s.speed = el("g", {opacity: 0}, s.stage); for (let i = 0; i < 6; i++) el("rect", {x: 100 + i * 40, y: 380 + i * 50, width: 260, height: 12, rx: 6, fill: "#fff"}, s.speed);
  s.lines = el("g", {}, s.stage); s.bk = makeBike(s.stage);
  const parts = [["Pedals", "#06d6a0", 720, 800], ["Chain", "#6c757d", 400, 800], ["Wheels", "#2b2d42", 180, 380], ["Seat", "#3a0ca3", 600, 135], ["Handlebars", "#ffbe0b", 1250, 150], ["Brakes", "#e63946", 1370, 330], ["Bell", "#ffd60a", 930, 125]];
  s.parts = parts.map(([n, col, x, y]) => ({n, x, y, line: el("line", {stroke: INK, "stroke-width": 4, "stroke-dasharray": "8 6", opacity: 0}, s.lines), ring: el("circle", {r: 30, fill: "#ffe14d", opacity: 0}, s.stage), c: chip(s.stage, n, col, {ink: n === "Bell" || n === "Handlebars" ? INK : "#fff"})}));
  s.foot = emo(s.stage, 0, 0, 90, "🦶");
  s.run = t => { const T = w => C("bike1", w), U = w => C("bike2", w);
    const go = ramp(t, U("whoosh") - .1, U("whoosh") + .5) * (1 - ramp(t, U("no") - .2, U("no") + .5));
    const bx = 760 + go * 380, by = 400;
    tf(s.bk.g, `translate(${bx} ${by}) scale(1.2)`); op(s.speed, go);
    const spin = t > U("pedals") ? (t - U("pedals")) : 0, wheelOn = t > U("wheel") ? (t - U("wheel")) : 0;
    s.bk.animate(spin * 140, wheelOn * 220 + go * 300, -(t > U("chain") ? (t - U("chain")) * 60 : 0));
    const keys = ["pedals", "chain", "wheels", "seat", "handlebars", "brakes", "bell"];
    const glowAll = on(t, U("together") - .1, SC.bike.t1 + .5, .2);
    s.parts.forEach((p, i) => { const a = T(keys[i]); const an = s.bk.anchor[p.n];
      const ax = bx + an[0] * 1.2, ay = by + an[1] * 1.2;
      op(p.c, ramp(t, a, a + .2)); popAt(p.c, p.x, p.y, t, a);
      set(p.line, "x1", p.x); set(p.line, "y1", p.y); set(p.line, "x2", ax); set(p.line, "y2", ay); op(p.line, ramp(t, a + .1, a + .3) * (1 - go));
      set(p.ring, "cx", ax); set(p.ring, "cy", ay); set(p.ring, "r", 26 + 8 * Math.sin(t * 8)); op(p.ring, .55 * Math.max(on(t, a, a + 1.4, .2), glowAll * (.5 + .5 * Math.sin(t * 6 + i))));
    });
    op(s.foot, on(t, U("feet"), U("chain"), .2)); tf(s.foot, `translate(${bx - 12 + Math.cos(spin * 2.4) * 48} ${by + 144 + Math.sin(spin * 2.4) * 48})`);
  }; return s; })();

// ---- DEFINE
S.define = (() => { const s = scene("define", "#ffd166", "#ff9f1c");
  const blocks = [["PEDALS", "#06d6a0", "push"], ["CHAIN", "#3a86ff", "turns the wheel"], ["WHEELS", "#ff4d6d", "roll"]];
  s.blocks = blocks.map(([n, col, job], i) => { const g = el("g", {}, s.stage);
    el("rect", {x: -150, y: -70, width: 300, height: 140, rx: 26, fill: col, stroke: INK, "stroke-width": 6, filter: "url(#sh)"}, g);
    tx(g, {x: 0, y: 16, "text-anchor": "middle", "font-size": 46, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, n);
    const tag = el("g", {}, g); el("rect", {x: -165, y: 86, width: 330, height: 58, rx: 14, fill: "#fff", stroke: INK, "stroke-width": 4}, tag);
    tx(tag, {x: 0, y: 125, "text-anchor": "middle", "font-size": 27, "font-weight": 600, fill: INK}, "job: " + job);
    return {g, tag, i}; });
  s.intro = tx(s.stage, {x: 760, y: 300, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "🔬 Scientists call this…");
  s.word = tx(s.stage, {x: 760, y: 250, "text-anchor": "middle", "font-size": 150, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 16, "letter-spacing": 8}, "SYSTEM");
  s.big = el("g", {}, s.stage); el("rect", {x: -470, y: -60, width: 940, height: 120, rx: 30, fill: "#7b61ff", stroke: INK, "stroke-width": 6, filter: "url(#sh)"}, s.big);
  tx(s.big, {x: 0, y: 16, "text-anchor": "middle", "font-size": 46, "font-weight": 700, fill: "#fff"}, "BIG FUNCTION: moving you 🚲");
  s.trip = el("g", {}, s.stage); el("path", {d: "M260 700 Q760 620 1260 700", stroke: "#fff", "stroke-width": 8, "stroke-dasharray": "4 18", "stroke-linecap": "round", fill: "none"}, s.trip);
  emo(s.trip, 230, 690, 80, "🏠"); emo(s.trip, 1290, 690, 80, "🏫"); s.mini = emo(s.trip, 0, 0, 70, "🚲");
  s.run = t => { const a = w => C("def1", w), b = w => C("def2", w);
    const snap = ramp(t, a("together") - .1, a("together") + .5);
    s.blocks.forEach((B, i) => { const spread = (i - 1) * lerp(440, 360, snap); const lift = Math.sin(t * 2 + i) * 6 * (1 - snap);
      op(B.g, ramp(t, a("parts") - .2 + i * .12, a("parts") + i * .12)); tf(B.g, `translate(${760 + spread} ${470 + lift}) scale(${pop(t, a("parts") - .2 + i * .12)})`);
      op(B.tag, ramp(t, b("function") + i * .35, b("function") + .25 + i * .35)); });
    op(s.intro, on(t, SC.define.t0 - .1, a("parts") - .1, .2)); tf(s.intro, `translate(760 300) scale(${pop(t, SC.define.t0 - .1)}) translate(-760 -300)`);
    op(s.word, ramp(t, a("system"), a("system") + .15)); tf(s.word, `translate(760 250) scale(${pop(t, a("system"), .5)}) translate(-760 -250)`);
    const bigOn = ramp(t, b("big"), b("big") + .3); op(s.big, bigOn); tf(s.big, `translate(760 700) scale(${pop(t, b("big"))})`);
    const tr = ramp(t, b("place"), b("place#2") + .6); op(s.trip, ramp(t, b("moving"), b("moving") + .3)); op(s.big, bigOn * (1 - ramp(t, b("moving"), b("moving") + .3)));
    const k = tr; set(s.mini, "x", lerp(260, 1260, k)); set(s.mini, "y", 690 - Math.sin(k * Math.PI) * 60 - 30); tf(s.mini, `translate(${2 * lerp(260, 1260, k)} 0) scale(-1 1)`);
    if (t > a("system") && t < a("system") + .05) burst(t);
  }; return s; })();

// ---- QUIZ
S.quiz = (() => { const s = scene("quiz", "#b5179e", "#560bad");
  const cards = [["A", "⛓️", "CHAIN"], ["B", "", "PEDAL"], ["C", "", "SPOKES"], ["D", "🔔", "BELL"]];
  s.cards = cards.map(([L, e, n], i) => { const g = el("g", {}, s.stage);
    const face = el("rect", {x: -140, y: -175, width: 280, height: 350, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, g);
    el("circle", {cx: -95, cy: -130, r: 30, fill: "#7209b7"}, g); tx(g, {x: -95, y: -119, "text-anchor": "middle", "font-size": 34, "font-weight": 700, fill: "#fff"}, L);
    if (e) emo(g, 0, -25, 120, e); else if (n === "PEDAL") { const pg = el("g", {transform: "translate(-22 -20)"}, g); el("circle", {cx: -30, cy: 25, r: 40, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "8 5"}, pg); el("line", {x1: -30, y1: 25, x2: 28, y2: -22, stroke: "#2b2d42", "stroke-width": 14, "stroke-linecap": "round"}, pg); el("circle", {cx: -30, cy: 25, r: 14, fill: "#adb5bd", stroke: INK, "stroke-width": 4}, pg); el("rect", {x: -22, y: -40, width: 100, height: 36, rx: 8, fill: "#06d6a0", stroke: INK, "stroke-width": 5}, pg); for (let k = 0; k < 4; k++) el("line", {x1: -4 + k * 22, y1: -34, x2: -4 + k * 22, y2: -10, stroke: INK, "stroke-width": 3}, pg); } else { const wg = el("g", {transform: "translate(0 -25)"}, g); el("circle", {r: 55, fill: "none", stroke: "#2b2d42", "stroke-width": 12}, wg); for (let k = 0; k < 8; k++) { const an = k * Math.PI / 4; el("line", {x1: 0, y1: 0, x2: Math.cos(an) * 50, y2: Math.sin(an) * 50, stroke: "#6c757d", "stroke-width": 4}, wg); } el("circle", {r: 10, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, wg); }
    tx(g, {x: 0, y: 110, "text-anchor": "middle", "font-size": 42, "font-weight": 700, fill: INK}, n);
    const mark = tx(g, {x: 0, y: 40, "text-anchor": "middle", "font-size": 230, "font-weight": 700, fill: i === 3 ? "#06d6a0" : "#e63946", class: "out", "stroke-width": 10, opacity: 0}, i === 3 ? "✓" : "✗");
    const note = tx(g, {x: 0, y: 225, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6, opacity: 0}, ["wheel won't turn", "can't push", "wobbly & weak", "still moves! (less safe)"][i]);
    return {g, face, mark, note, i}; });
  s.ring = el("g", {}, s.stage); el("circle", {r: 70, fill: "#ffbe0b", stroke: INK, "stroke-width": 6}, s.ring);
