function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
function fitPill(g, pad) { const r = g.querySelector("rect"), t = g.querySelector("text"); if (!r || !t) return 0;
  const need = t.getBBox().width + pad, w = +r.getAttribute("width");
  if (need > w) { const cx = +r.getAttribute("x") + w / 2; set(r, "width", need); set(r, "x", cx - need / 2); } return Math.max(need, w); }
function shrinkText(g, fs) { const r = g.querySelector("rect"), t = g.querySelector("text"); const w = +r.getAttribute("width") - fs * 1.1, bw = t.getBBox().width;
  if (bw > w) set(t, "font-size", fs * w / bw); }
document.fonts.ready.then(() => {
  CHIPS.forEach(([g, fs, fixed]) => fixed ? shrinkText(g, fs) : fitPill(g, fs * 1.3));
  KW.forEach(K => { fitPill(K.big, 70); K.sw = fitPill(K.small, 36); });
  CAPS.forEach(({g}) => fitPill(g, 64));
  window.READY = true; });
</script>
</body></html>
