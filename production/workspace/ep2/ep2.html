<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}

<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">🌱 TheOneApp, Explained - Plant Parts</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 2: plant system) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const camAt = (keys, t) => { let c = {...keys[0]}; for (let i = 1; i < keys.length; i++) { const k = keys[i]; if (t < k.t) break; const q = ease((t - k.t) / (k.d || .7)); ["x", "y", "s"].forEach(f => c[f] = lerp(c[f], k[f], q)); } return c; };
function leafPath(len, w) { return `M0 0 Q${len * .35} ${-w} ${len} 0 Q${len * .35} ${w} 0 0 Z`; }
function drawPlant(p, opts = {}) {
  const K = {}; const g = el("g", {}, p); K.g = g;
  const qb = (a, c, b, u) => [(1 - u) * (1 - u) * a[0] + 2 * u * (1 - u) * c[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * u * (1 - u) * c[1] + u * u * b[1]];
  const qd = (a, c, b) => `M${a[0]} ${a[1]} Q${c[0]} ${c[1]} ${b[0]} ${b[1]}`;
  // ---- roots: three main roots, every side root grows out of one of them
  const O = [760, 596], mains = [[[728, 700], [612, 858]], [[770, 745], [758, 892]], [[798, 700], [948, 848]]];
  const side = [[0, .38, [-70, -20], [-20, 10]], [0, .68, [-60, 30], [-30, 40]], [1, .45, [-55, 25], [-20, 30]], [1, .62, [60, 20], [30, 30]], [2, .38, [75, -18], [20, 10]], [2, .68, [-20, 60], [-14, 30]]];
  const rootD = [], fine = [], tips = mains.map(m => m[1]);
  mains.forEach(([c, e]) => rootD.push(qd(O, c, e)));
  side.forEach(([mi, u, d, cOff]) => { const [c, e] = mains[mi], s0 = qb(O, c, e, u), e2 = [s0[0] + d[0], s0[1] + d[1]];
    fine.push(qd(s0, [s0[0] + d[0] * .5 + cOff[0], s0[1] + d[1] * .5 + cOff[1]], e2)); tips.push(e2); });
  const hairs = []; [...mains.map(([c, e]) => [O, c, e])].forEach(([a, c, e]) => [.8, .9].forEach(u => { const q = qb(a, c, e, u); hairs.push(`M${q[0]} ${q[1]} l${(q[0] < 760 ? -1 : 1) * 16} 10 M${q[0]} ${q[1]} l${(q[0] < 760 ? 1 : -1) * 12} 14`); }));
  K.tips = tips;
  K.rootsGlow = el("path", {d: rootD.concat(fine).join(" "), stroke: "#ffe14d", "stroke-width": 40, fill: "none", "stroke-linecap": "round", opacity: 0}, g);
  el("path", {d: rootD.join(" "), stroke: INK, "stroke-width": 24, fill: "none", "stroke-linecap": "round"}, g);
  el("path", {d: fine.join(" "), stroke: INK, "stroke-width": 15, fill: "none", "stroke-linecap": "round"}, g);
  K.roots = el("path", {d: rootD.join(" "), stroke: "#fbe7c6", "stroke-width": 16, fill: "none", "stroke-linecap": "round"}, g);
  el("path", {d: fine.join(" "), stroke: "#fbe7c6", "stroke-width": 8, fill: "none", "stroke-linecap": "round"}, g);
  // ---- stem: one tapered piece that flows into the roots
  K.top = el("g", {}, g);
  const S0 = [760, 610], SC_ = [750, 400], S1 = [760, 180];
  const sAt = u => qb(S0, SC_, S1, u), half = u => lerp(17, 7, u);
  K.sx = y => { let u = clamp((610 - y) / 430); return sAt(u)[0]; };
  const L = [], R = []; for (let i = 0; i <= 20; i++) { const u = i / 20, q = sAt(u); L.push(`${(q[0] - half(u)).toFixed(1)} ${q[1].toFixed(1)}`); R.unshift(`${(q[0] + half(u)).toFixed(1)} ${q[1].toFixed(1)}`); }
  const stemD = `M${L.join(" L")} Q760 166 ${R.join(" L")} Z`;
  K.stemGlow = el("path", {d: qd(S0, SC_, S1), stroke: "#ffe14d", "stroke-width": 56, fill: "none", "stroke-linecap": "round", opacity: 0}, K.top);
  // ---- leaves on short stalks, in matching pairs angled upward, plus a bud on top
  K.leaves = []; K.leafGlow = [];
  const leafAt = (u, sd, len, w, ang) => { const q = sAt(u), x = q[0] + sd * (half(u) - 3), y = q[1];
    const lg = el("g", {transform: `translate(${x} ${y}) rotate(${sd < 0 ? 180 + ang : -ang})`}, K.top);
    el("path", {d: "M0 0 Q18 -5 34 0", stroke: INK, "stroke-width": 14, fill: "none", "stroke-linecap": "round"}, lg);
    el("path", {d: "M0 0 Q18 -5 34 0", stroke: "#52b788", "stroke-width": 8, fill: "none", "stroke-linecap": "round"}, lg);
    const lf = el("g", {transform: "translate(30 0)"}, lg);
    const glow = el("path", {d: leafPath(len, w + 10), fill: "#ffe14d", opacity: 0, transform: "scale(1.08)"}, lf);
    el("path", {d: leafPath(len, w), fill: "#2dc653", stroke: INK, "stroke-width": 5}, lf);
    el("path", {d: `M0 0 L${len - 12} 0`, stroke: "#b7efc5", "stroke-width": 4}, lf);
    for (let i = 1; i < 4; i++) el("path", {d: `M${len * i / 4} 0 L${len * i / 4 + 24} ${-w * .42} M${len * i / 4} 0 L${len * i / 4 + 24} ${w * .42}`, stroke: "#b7efc5", "stroke-width": 3}, lf);
    K.leaves.push(lg); K.leafGlow.push(glow); return {x, y}; };
  [[.32, 200, 66, 22], [.55, 180, 60, 32], [.76, 150, 52, 42], [.92, 108, 40, 55]].forEach(([u, len, w, ang]) => { leafAt(u, -1, len, w, ang); leafAt(u, 1, len, w, ang); });
  el("path", {d: stemD, fill: "#52b788", stroke: INK, "stroke-width": 5, "stroke-linejoin": "round"}, K.top);
  el("path", {d: qd([766, 600], [757, 400], [762, 200]), stroke: "#95d5b2", "stroke-width": 5, fill: "none", "stroke-linecap": "round", opacity: .8}, K.top);
  const bud = el("g", {transform: `translate(${sAt(1)[0]} 178) rotate(-90)`}, K.top);
  const bg_ = el("path", {d: leafPath(64, 26 + 10), fill: "#ffe14d", opacity: 0, transform: "scale(1.08)"}, bud);
  el("path", {d: leafPath(64, 26), fill: "#2dc653", stroke: INK, "stroke-width": 5}, bud); K.leaves.push(bud); K.leafGlow.push(bg_);
  // point on the 2nd right leaf where made food starts its trip down
  const q = sAt(.55), a = 32 * Math.PI / 180; K.foodFrom = [q[0] + 14 + 120 * Math.cos(a), q[1] - 120 * Math.sin(a)];
  return K;
}

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#80ed99", "#2a9d8f");
  s.plate = el("g", {}, s.stage); el("circle", {r: 300, fill: "#fff", stroke: INK, "stroke-width": 8, filter: "url(#sh)"}, s.plate); el("circle", {r: 230, fill: "none", stroke: "#e9ecef", "stroke-width": 10}, s.plate);
  s.food = [["🥬", -120, -60], ["🥕", 120, -40]].map(([e, x, y]) => ({e: emo(s.plate, x, y, 150, e), x, y}));
  const cel = el("g", {transform: "translate(0 120) rotate(-70)"}, s.plate); for (let i = 0; i < 3; i++) el("rect", {x: -90, y: -40 + i * 26, width: 180, height: 26, rx: 12, fill: "#95d5b2", stroke: INK, "stroke-width": 4}, cel); s.food.push({e: cel, x: 0, y: 120});
  s.q = [0, 1, 2].map(i => tx(s.stage, {"font-size": 110, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10, "text-anchor": "middle"}, "?"));
  s.three = el("g", {}, s.stage); el("circle", {r: 90, fill: "#ffbe0b", stroke: INK, "stroke-width": 7}, s.three); tx(s.three, {x: 0, y: 44, "text-anchor": "middle", "font-size": 124, "font-weight": 700, fill: INK}, "3");
  s.marks = el("g", {}, s.stage); el("rect", {x: -260, y: -50, width: 520, height: 100, rx: 50, fill: "#e63946", stroke: INK, "stroke-width": 6, filter: "url(#sh)"}, s.marks); tx(s.marks, {x: 0, y: 18, "text-anchor": "middle", "font-size": 46, "font-weight": 700, fill: "#fff"}, "✗ −2 marks");
  s.run = t => { const a = w => C("hook", w);
    op(s.plate, 1); tf(s.plate, `translate(760 470) scale(${pop(t, .3)}) rotate(${Math.sin(t) * 2})`);
    s.food.forEach((f, i) => op(f.e, ramp(t, .5 + i * .2, .7 + i * .2)));
    popAt(s.three, 1180, 230, t, a("three")); op(s.three, on(t, a("three"), a("let's"), .2));
    op(s.marks, on(t, a("lose"), a("which") + .2, .2)); popAt(s.marks, 760, 845, t, a("lose"));
    s.q.forEach((q, i) => { set(q, "x", 420 + i * 340); set(q, "y", 200 + Math.sin(t * 6 + i) * 18); op(q, on(t, a("which"), SC.hook.t1 + .3, .2)); }); }; return s; })();

// ---- PLANT (turn, leaves, stem, roots) with camera
S.plant = (() => { const s = scene("plant", "#a2d2ff", "#cdb4db");
  s.world = el("g", {}, s.stage);
  s.sun = emo(s.world, 1110, 260, 150, "☀️");
  s.rays = el("g", {opacity: 0}, s.world); for (let i = 0; i < 6; i++) el("line", {x1: 1040, y1: 290, x2: 960 - i * 30, y2: 180 + i * 55, stroke: "#ffd60a", "stroke-width": 9, "stroke-dasharray": "20 14", "stroke-linecap": "round"}, s.rays);
  el("rect", {x: -1400, y: 600, width: 4400, height: 1400, fill: "#9c6644"}, s.world); el("rect", {x: -1400, y: 588, width: 4400, height: 24, fill: "#57cc99"}, s.world);
  seed = 9; for (let i = 0; i < 40; i++) el("ellipse", {cx: -300 + rnd() * 2200, cy: 640 + rnd() * 500, rx: 8 + rnd() * 16, ry: 6 + rnd() * 10, fill: "#7f5539", opacity: .7}, s.world);
  s.P = drawPlant(s.world);
  s.sparks = []; for (let i = 0; i < 14; i++) s.sparks.push({x: 560 + rnd() * 400, y: 170 + rnd() * 320, ph: rnd() * 6, e: emo(s.world, 0, 0, 30, "✨")});
  s.up = []; for (let i = 0; i < 9; i++) s.up.push({ph: i / 9, e: el("circle", {r: 9, fill: "#4cc9f0", stroke: INK, "stroke-width": 3}, s.world)});
  s.down = []; for (let i = 0; i < 7; i++) s.down.push({ph: i / 7, e: el("circle", {r: 8, fill: "#ffb703", stroke: INK, "stroke-width": 3}, s.world)});
  s.soilIn = []; for (let i = 0; i < 16; i++) s.soilIn.push({tipI: i, ph: rnd(), tip: null, mineral: i % 3 === 0, e: i % 3 === 0 ? el("rect", {width: 14, height: 14, fill: "#c77dff", stroke: INK, "stroke-width": 2, transform: "rotate(45)"}, s.world) : el("circle", {r: 8, fill: "#4cc9f0", stroke: INK, "stroke-width": 2}, s.world)});
  s.wind = el("g", {opacity: 0}, s.world); for (let i = 0; i < 5; i++) el("path", {d: `M${200 + (i % 2) * 60} ${220 + i * 70} q 120 -30 240 0 q 60 15 100 -10`, stroke: "#fff", "stroke-width": 9, fill: "none", "stroke-linecap": "round"}, s.wind);
  // job cards (screen space)
  const card = (title, col, lines) => { const g = el("g", {}, s.stage); el("rect", {x: 0, y: 0, width: 560, height: 84 + lines.length * 52, rx: 26, fill: "#fff", stroke: INK, "stroke-width": 6, filter: "url(#sh)"}, g);
    el("rect", {x: 0, y: 0, width: 560, height: 64, rx: 26, fill: col}, g); el("rect", {x: 0, y: 38, width: 560, height: 26, fill: col}, g);
    tx(g, {x: 280, y: 45, "text-anchor": "middle", "font-size": 36, "font-weight": 700, fill: "#fff"}, title);
    const ls = lines.map((L, i) => tx(g, {x: L.startsWith(" ") ? 72 : 26, y: 112 + i * 52, "font-size": 33, "font-weight": 600, fill: INK, opacity: 0}, L)); return {g, ls}; };
  s.cLeaf = card("🍃 LEAVES", "#2dc653", ["① make food", "② take in & give out gases"]);
