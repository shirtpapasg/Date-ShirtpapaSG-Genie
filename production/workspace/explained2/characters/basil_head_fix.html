<!doctype html><html><head><meta charset="utf-8">
<!-- Basil against the teacher's reference sheet. node ../kit/shot.js basil_head_fix.html basil_head_fix.png 3600 2330 -->
<style>@font-face{font-family:Fredoka;font-weight:600;src:url(../fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
html,body{margin:0;background:#FFF8EA} svg{display:block} text{font-family:Fredoka;font-weight:600;fill:#2B2147}</style></head><body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3600" height="2330" viewBox="0 0 3600 2330"></svg>
<script src="buddies.js"></script>
<script>
const REF = "basil_ref/basil_8_poses_from_teacher.jpg", RW = 1376, RH = 768;
// each panel: crop box on the sheet, where the feet are in the crop (px), and the matching rig options
const PAN = [
  ["look down", [12, 14], [210, 311], { tilt: 20, expr: "shy", gesture: "rest" }, "happy, tilt 20, eyes down"],
  ["look up", [354, 14], [212, 311], { tilt: -22 }, "happy, tilt -22"],
  ["look back", [696, 14], [198, 309], { facing: "left", gesture: "wave", hand: "L" }, "facing left, wave (whole rig mirrored)"],
  ["dreamy", [1040, 14], [205, 311], { expr: "dreamy" }, "expr dreamy"],
  ["thoughtful", [12, 404], [214, 313], { expr: "thinking" }, "expr thinking"],
  ["shy", [354, 404], [212, 313], { expr: "shy" }, "expr shy"],
  ["amazed", [696, 404], [207, 313], { expr: "amazed" }, "expr amazed"],
  ["front view", [1040, 404], [207, 313], { look: 1 }, "look 1 (front view)"]];
const T = (x, y, s, z = 30, a = "middle") => `<text x="${x}" y="${y}" font-size="${z}" text-anchor="${a}">${s}</text>`;
let defs = "", o = `<rect width="3600" height="2330" fill="#FFF8EA"/>` + T(60, 70, "Basil: the teacher's reference panels (left of each pair) and the SVG rig (right)", 46, "start");
const refImg = (i, x, y, c, op = 1) => { const [bx, by] = PAN[i][1], k = c / 322; defs += `<clipPath id="c${i}_${x}"><rect x="${x}" y="${y}" width="${c}" height="${c}" rx="${22 * k}"/></clipPath>`;
  return `<image href="${REF}" x="${x - bx * k}" y="${y - by * k}" width="${RW * k}" height="${RH * k}" clip-path="url(#c${i}_${x})" opacity="${op}"/>`; };
const rig = (i, x, y, c, extra) => { const k = c / 322, [fx, fy] = PAN[i][2]; return Buddies.draw("basil", x + fx * k, y + fy * k, 290 * k, 1.0, Object.assign({ shadow: false, blink: false, breathe: false }, PAN[i][3], extra)); };
const C = 430;
PAN.forEach((p, i) => { const x = 40 + (i % 4) * 890, y = 110 + Math.floor(i / 4) * 540;
  o += `<rect x="${x}" y="${y}" width="${C * 2 + 10}" height="${C}" rx="30" fill="#fff"/>` + refImg(i, x, y, C) + `<svg x="${x + C + 10}" y="${y}" width="${C}" height="${C}" viewBox="${x + C + 10} ${y} ${C} ${C}">${rig(i, x + C + 10, y, C)}</svg>` + T(x + C / 2, y + C + 40, p[0] + " · sit (reference)") + T(x + C + 10 + C / 2, y + C + 40, "rig: " + p[4]); });
// overlays: the rig drawn at 55% over the reference at the same size
const yo = 1260, CO = 840;
o += T(60, yo - 30, "Overlay check: rig (55%) on top of the reference at the same size. Three-quarter views and the front view.", 40, "start");
[[6, {}], [4, {}], [1, {}], [7, {}]].forEach(([i, ex], j) => { const x = 40 + j * 890;
  o += refImg(i, x, yo, CO) + `<svg x="${x}" y="${yo}" width="${CO}" height="${CO}" viewBox="${x} ${yo} ${CO} ${CO}" opacity=".55">${rig(i, x, yo, CO, ex)}</svg>` + T(x + CO / 2, yo + CO + 44, PAN[i][0] + " + rig", 32); });
o += T(60, 2270, "Rig drawn flat-vector per the style guide (self-coloured lines, soft bumps instead of sharp spikes). Eye centres, head width and snout length are matched to the panels above.", 30, "start");
document.getElementById("v").innerHTML = `<defs>${defs}</defs>` + o;
</script></body></html>
