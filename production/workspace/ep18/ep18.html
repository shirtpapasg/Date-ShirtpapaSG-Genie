<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}

  svg{display:block}
  text{font-family:Fredoka,Inter,sans-serif;font-weight:600}
  .emo{font-family:"Noto Color Emoji",sans-serif}
  .out{paint-order:stroke;stroke:#1b1b3a;stroke-linejoin:round}
</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">🌡️ TheOneApp, Explained - Temperature</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 18: temperature + thermometers) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const HOT = "#e63946", COLD = "#3a86ff", WARM = "#ffb703";
function bowl(p, col) { const g = el("g", {}, p); const w = el("path", {d: "M-150 -10 Q0 10 150 -10 L120 90 Q0 120 -120 90 Z", fill: col, opacity: .85}, g); el("path", {d: "M-170 -30 L-130 100 Q0 140 130 100 L170 -30 Z", fill: "none", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round"}, g); g.w = w; return g; }
// lab thermometer: origin at bulb centre; level 0..1
function labTherm(p, h = 420) { const g = el("g", {}, p); el("rect", {x: -16, y: -h, width: 32, height: h, rx: 16, fill: "#fff", stroke: INK, "stroke-width": 5}, g);
  const liq = el("rect", {x: -6, width: 12, fill: "#e63946"}, g); el("circle", {r: 26, fill: "#e63946", stroke: INK, "stroke-width": 5}, g);
  for (let i = 1; i < 10; i++) el("line", {x1: 6, y1: -40 - i * (h - 60) / 10, x2: 16, y2: -40 - i * (h - 60) / 10, stroke: INK, "stroke-width": 3}, g);
  g.level = k => { const hh = 30 + k * (h - 70); set(liq, "y", -hh); set(liq, "height", hh); }; g.level(.3); g.H = h; return g; }
function cup(p, col, label) { const g = el("g", {}, p); el("path", {d: "M-80 -100 L-65 80 H65 L80 -100", fill: "#ffffffcc", stroke: INK, "stroke-width": 6}, g); el("rect", {x: -72, y: -60, width: 144, height: 136, fill: col, opacity: .8}, g);
  tx(g, {x: 0, y: 150, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 8}, label); return g; }

// ---- HOOK (three bowls)
S.hook = (() => { const s = scene("hook", "#caf0f8", "#ffd6a5");
  s.b1 = bowl(s.stage, COLD); s.b2 = bowl(s.stage, "#9bf6ff"); s.b3 = bowl(s.stage, "#bde0fe");
  s.l1 = chip(s.stage, "🧊 cold", COLD, {fs: 30}); s.l2 = chip(s.stage, "lukewarm", "#00b4d8", {fs: 30}); s.l3 = chip(s.stage, "♨️ warm", HOT, {fs: 30});
  s.hL = emo(s.stage, 0, 0, 120, "🤚"); s.hR = emo(s.stage, 0, 0, 120, "✋");
  s.bL = chip(s.stage, "\"WARM!\"", HOT, {fs: 34}); s.bR = chip(s.stage, "\"COLD!\"", COLD, {fs: 34});
  s.ly = tx(s.stage, {x: 760, y: 180, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "🤔 Your touch got MIXED UP!");
  s.run = t => { const a = w => C("hook", w); const both = ramp(t, a("both") - .2, a("both") + .6);
    tf(s.b1, "translate(360 700)"); tf(s.b2, "translate(760 700)"); tf(s.b3, "translate(1160 700)"); [s.b1, s.b2, s.b3].forEach(b => op(b, ramp(t, .2, .5)));
    op(s.l1, ramp(t, a("cold"), a("cold") + .2)); popAt(s.l1, 360, 860, t, a("cold")); op(s.l3, ramp(t, a("warm"), a("warm") + .2)); popAt(s.l3, 1160, 860, t, a("warm")); op(s.l2, ramp(t, a("lukewarm"), a("lukewarm") + .2)); popAt(s.l2, 760, 860, t, a("lukewarm"));
    op(s.hL, ramp(t, a("one"), a("one") + .2)); set(s.hL, "x", lerp(360, 720, both)); set(s.hL, "y", lerp(692, 692, both) - Math.sin(both * Math.PI) * 140); tf(s.hL, `translate(0 ${2 * (lerp(692, 692, both) - Math.sin(both * Math.PI) * 140)}) scale(1 -1)`);
    op(s.hR, ramp(t, a("other"), a("other") + .2)); set(s.hR, "x", lerp(1160, 800, both)); set(s.hR, "y", lerp(692, 692, both) - Math.sin(both * Math.PI) * 140); tf(s.hR, `translate(0 ${2 * (lerp(692, 692, both) - Math.sin(both * Math.PI) * 140)}) scale(1 -1)`);
    op(s.bL, ramp(t, a("warm#2"), a("warm#2") + .2)); popAt(s.bL, 560, 430, t, a("warm#2")); op(s.bR, ramp(t, a("cold#2"), a("cold#2") + .2)); popAt(s.bR, 960, 430, t, a("cold#2"));
    op(s.ly, ramp(t, a("mixed"), a("mixed") + .2)); tf(s.ly, `translate(760 180) scale(${pop(t, a("mixed")) * .9}) translate(-760 -180)`); }; return s; })();

// ---- NEED NUMBERS
S.need = (() => { const s = scene("need", "#fff3b0", "#ffd166");
  s.doc = emo(s.stage, 0, 0, 170, "🧑‍⚕️"); s.fev = emo(s.stage, 0, 0, 130, "🤒"); s.bak = emo(s.stage, 0, 0, 170, "🧑‍🍳"); s.cake = emo(s.stage, 0, 0, 120, "🎂");
  s.w = [["hot?", HOT], ["warm?", WARM], ["cold?", COLD]].map(([n, c]) => tx(s.stage, {"text-anchor": "middle", "font-size": 60, "font-weight": 700, fill: c, class: "out", "stroke-width": 8}, n));
  s.x = chip(s.stage, "✗ words are not good enough", "#6c757d", {fs: 36}); s.n = chip(s.stage, "✓ we need NUMBERS 🔢", "#06d6a0", {fs: 44});
  s.run = t => { const a = w => C("need", w);
    op(s.doc, ramp(t, a("doctors"), a("doctors") + .2)); set(s.doc, "x", 340); set(s.doc, "y", 420); op(s.fev, ramp(t, a("fever"), a("fever") + .2)); set(s.fev, "x", 520); set(s.fev, "y", 440);
    op(s.bak, ramp(t, a("bakers"), a("bakers") + .2)); set(s.bak, "x", 1000); set(s.bak, "y", 420); op(s.cake, ramp(t, a("oven"), a("oven") + .2)); set(s.cake, "x", 1180); set(s.cake, "y", 450);
    s.w.forEach((e, i) => { const tt = a("words") + i * .3; op(e, ramp(t, tt, tt + .2) * (1 - ramp(t, a("numbers") - .3, a("numbers")) * .7)); set(e, "x", 460 + i * 300); set(e, "y", 680); });
    op(s.x, on(t, a("enough"), a("numbers"), .2)); popAt(s.x, 760, 800, t, a("enough")); op(s.n, ramp(t, a("numbers"), a("numbers") + .2)); popAt(s.n, 760, 800, t, a("numbers")); }; return s; })();

// ---- TEMPERATURE
S.temp = (() => { const s = scene("temp", "#ffadad", "#ffd6a5");
  s.card = el("g", {}, s.stage); el("rect", {x: -560, y: -112, width: 1120, height: 224, rx: 26, fill: "#fff", stroke: INK, "stroke-width": 7}, s.card);
  tx(s.card, {x: 0, y: -50, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: HOT}, "🌡️ TEMPERATURE = a measure of how hot"); tx(s.card, {x: 0, y: 4, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: HOT}, "or cold an object is"); tx(s.card, {x: 0, y: 72, "text-anchor": "middle", "font-size": 40, "font-weight": 700, fill: INK}, "measured in degrees Celsius (°C)");
  s.cups = [[50, "#e63946"], [40, "#f77f00"], [28, "#ffb703"], [10, "#3a86ff"]].map(([v, c], i) => ({g: cup(s.stage, c, v + " °C"), v, i}));
  s.c = chip(s.stage, "BIGGER number = HIGHER temperature", "#7209b7", {fs: 36});
  s.run = t => { const a = w => C("temp", w);
    op(s.card, ramp(t, a("temperature"), a("temperature") + .2)); tf(s.card, `translate(760 225) scale(${pop(t, a("temperature")) * .9})`);
    s.cups.forEach(c => { const tt = a("bigger") + c.i * .2; op(c.g, ramp(t, tt, tt + .2)); tf(c.g, `translate(${360 + c.i * 270} 560) scale(${pop(t, tt)})`); });
    op(s.c, ramp(t, a("higher"), a("higher") + .2)); popAt(s.c, 760, 820, t, a("higher")); }; return s; })();

// ---- THERMAL CAMERA
S.camera = (() => { const s = scene("camera", "#10002b", "#240046");
  s.cam = emo(s.stage, 300, 480, 160, "📹"); s.scr = el("g", {}, s.stage); el("rect", {x: -330, y: -240, width: 660, height: 480, rx: 24, fill: "#14213d", stroke: "#adb5bd", "stroke-width": 10}, s.scr);
  const grad = el("radialGradient", {id: "tc18"}, $("v").querySelector("defs")); [[0, "#fff3b0"], [.35, "#ffbe0b"], [.7, "#e63946"], [1, "#3a0ca3"]].forEach(([o, c]) => el("stop", {offset: o, "stop-color": c}, grad));
  s.ppl = [-180, 0, 180].map(x => { const g = el("g", {}, s.scr); el("circle", {cx: x, cy: -80, r: 55, fill: "url(#tc18)"}, g); el("ellipse", {cx: x, cy: 90, rx: 80, ry: 120, fill: "url(#tc18)"}, g); return g; });
  s.fev = el("circle", {cx: 180, cy: -80, r: 70, fill: "none", stroke: "#fff", "stroke-width": 6, "stroke-dasharray": "12 8"}, s.scr);
  s.c1 = chip(s.stage, "colours show temperature 🔴🟡🔵", "#ff006e", {fs: 34}); s.c2 = chip(s.stage, "✈️🏥 spot a fever without touching", "#06d6a0", {fs: 34});
  s.run = t => { const a = w => C("camera", w);
    op(s.cam, ramp(t, SC.camera.t0 - .6, SC.camera.t0 - .3)); op(s.scr, ramp(t, SC.camera.t0 - .4, SC.camera.t0)); tf(s.scr, "translate(900 480)");
    op(s.fev, ramp(t, a("fever"), a("fever") + .2) * (.5 + .5 * Math.sin(t * 6)));
    op(s.c1, ramp(t, a("colours"), a("colours") + .2)); popAt(s.c1, 760, 120, t, a("colours")); op(s.c2, ramp(t, a("airports"), a("airports") + .2)); popAt(s.c2, 760, 840, t, a("airports")); }; return s; })();

// ---- THERMOMETER TYPES
S.types = (() => { const s = scene("types", "#caffbf", "#9bf6ff");
  s.t = [["🌡️", "DIGITAL", "body temperature", "digital", "#06d6a0"], ["🔫", "INFRARED", "surfaces, without touching", "infrared", "#7209b7"], [null, "LAB", "liquids + gases", "laboratory", "#d00000"]].map(([e, n, u, w, c], i) => {
    const g = el("g", {}, s.stage); el("rect", {x: -200, y: -230, width: 400, height: 460, rx: 30, fill: "#fff", stroke: c, "stroke-width": 9}, g);
    if (e) emo(g, 0, -60, 150, e); else { const th = labTherm(g, 260); tf(th, "translate(0 40) rotate(0)"); }
    tx(g, {x: 0, y: 108, "text-anchor": "middle", "font-size": 40, "font-weight": 700, fill: c}, n); tx(g, {x: 0, y: 148, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: c}, "THERMOMETER"); tx(g, {x: 0, y: 196, "text-anchor": "middle", "font-size": 27, "font-weight": 600, fill: INK}, u); return {g, w, i}; });
  s.c = chip(s.stage, "🌡️ THERMOMETER: measures temperature accurately", "#3a86ff", {fs: 34});
  s.run = t => { const a = w => C("types", w);
    op(s.c, ramp(t, a("thermometer"), a("thermometer") + .2)); popAt(s.c, 760, 140, t, a("thermometer"));
    s.t.forEach(q => { op(q.g, ramp(t, a(q.w), a(q.w) + .2)); tf(q.g, `translate(${330 + q.i * 430} 560) scale(${pop(t, a(q.w)) * .95})`); }); }; return s; })();

// ---- LAB THERMOMETER (3 steps)

  s.bk = el("g", {}, s.stage); el("rect", {x: -150, y: -200, width: 300, height: 200, fill: "#90e0ef", opacity: .7}, s.bk); el("path", {d: "M-160 -300 V10 H160 V-300", fill: "none", stroke: INK, "stroke-width": 8}, s.bk);
