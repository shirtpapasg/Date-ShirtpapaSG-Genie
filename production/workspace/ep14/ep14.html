<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2")}
  html,body{margin:0;padding:0;background:#000;width:1920px;height:1080px;overflow:hidden}
  svg{display:block}
  text{font-family:Fredoka,Inter,sans-serif;font-weight:600}
  .emo{font-family:"Noto Color Emoji",sans-serif}
  .out{paint-order:stroke;stroke:#1b1b3a;stroke-linejoin:round}
</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">🌕 TheOneApp, Explained - Light and the Moon</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 14: how we see — directly or by reflection; the Moon) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const RAY = "#ffbe0b";
// light ray with arrowhead, drawn to fraction k
function ray(p, col = RAY, w = 10) { const g = el("g", {}, p); const ln = el("line", {stroke: col, "stroke-width": w, "stroke-linecap": "round"}, g); const hd = el("path", {d: "M0 0 L-34 -18 L-34 18 Z", fill: col, stroke: INK, "stroke-width": 3}, g);
  g.to = (x1, y1, x2, y2, k) => { const x = lerp(x1, x2, k), y = lerp(y1, y2, k); set(ln, "x1", x1); set(ln, "y1", y1); set(ln, "x2", x); set(ln, "y2", y); tf(hd, `translate(${x} ${y}) rotate(${Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI})`); op(g, k > 0 ? 1 : 0); }; return g; }
function moonDisc(p, r = 150) { const g = el("g", {}, p); el("circle", {r, fill: "#f1f3f5", stroke: INK, "stroke-width": 6}, g); [[-.35, -.25, .2], [.3, .1, .14], [-.1, .4, .1], [.35, -.4, .08]].forEach(([x, y, s]) => el("circle", {cx: x * r, cy: y * r, r: s * r, fill: "#ced4da"}, g)); return g; }
function eye(p, s = 1) { const g = el("g", {transform: `scale(${s})`}, p); el("path", {d: "M-80 0 Q0 -70 80 0 Q0 70 -80 0 Z", fill: "#fff", stroke: INK, "stroke-width": 6}, g); el("circle", {r: 30, fill: "#3a86ff", stroke: INK, "stroke-width": 4}, g); el("circle", {r: 13, fill: INK}, g); el("circle", {cx: -8, cy: -9, r: 6, fill: "#fff"}, g); return g; }
function firefly(p) { const g = el("g", {}, p); el("circle", {cx: 0, cy: 14, r: 30, fill: "#fff3b0", opacity: .7}, g); el("circle", {cx: 0, cy: 14, r: 15, fill: "#ffe14d"}, g); el("ellipse", {cx: 0, cy: -10, rx: 12, ry: 20, fill: "#3d2c1e", stroke: INK, "stroke-width": 3}, g); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#03045e", "#10002b");
  seed = 5; s.st = []; for (let i = 0; i < 30; i++) s.st.push({x: rnd() * 1500, y: rnd() * 900, e: el("circle", {r: 2 + rnd() * 4, fill: "#fff"}, s.stage)});
  s.m = moonDisc(s.stage, 200); s.glow = el("circle", {r: 260, fill: "#fff3b0", opacity: .15}, s.stage); s.stage.appendChild(s.m);
  s.x = chip(s.stage, "✗ its OWN light: never!", "#e63946", {fs: 44}); s.once = tx(s.stage, {x: 1150, y: 520, "text-anchor": "middle", "font-size": 90, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "NOT ONCE.");
  s.q = chip(s.stage, "🤔 so how can we SEE it?", "#7209b7", {fs: 46});
  s.run = t => { const a = w => C("hook", w);
    s.st.forEach((q, i) => { set(q.e, "cx", q.x); set(q.e, "cy", q.y); op(q.e, .3 + .6 * Math.abs(Math.sin(t * 1.5 + i))); });
    op(s.m, ramp(t, .2, .6)); tf(s.m, "translate(560 470)"); op(s.glow, ramp(t, a("lights"), a("lights") + .4) * .3); set(s.glow, "cx", 560); set(s.glow, "cy", 470);
    op(s.x, ramp(t, a("never"), a("never") + .2)); popAt(s.x, 1150, 380, t, a("never"));
    op(s.once, ramp(t, a("once"), a("once") + .2)); tf(s.once, `translate(1150 520) scale(${pop(t, a("once"))}) translate(-1150 -520)`);
    op(s.q, ramp(t, a("see"), a("see") + .2)); popAt(s.q, 760, 820, t, a("see")); }; return s; })();

// ---- BLINDFOLD
S.blind = (() => { const s = scene("blind", "#90e0ef", "#caffbf");
  s.sun = emo(s.stage, 1300, 220, 180, "☀️"); s.kid = emo(s.stage, 0, 0, 260, "🧒"); s.band = el("rect", {x: -95, y: -50, width: 190, height: 40, rx: 14, fill: "#1b1b3a"}, s.stage);
  s.x = chip(s.stage, "✗ can't see, even in bright sunshine", "#e63946", {fs: 36});
  s.rays = [0, 1, 2].map(() => ray(s.stage)); s.e = eye(s.stage, 1.3);
  s.c = chip(s.stage, "To SEE: light must ENTER our eyes", "#ffbe0b", {fs: 44});
  s.run = t => { const a = w => C("blind", w); const en = ramp(t, a("see#2") - .5, a("see#2") + .2);
    op(s.kid, ramp(t, SC.blind.t0, SC.blind.t0 + .3) * (1 - en)); set(s.kid, "x", 560 + Math.sin(t * 3) * 20); set(s.kid, "y", 500);
    op(s.band, ramp(t, a("blindfold"), a("blindfold") + .2) * (1 - en)); tf(s.band, `translate(${560 + Math.sin(t * 3) * 20} 470)`);
    op(s.x, on(t, a("cannot"), a("see#2") - .5, .2)); popAt(s.x, 760, 780, t, a("cannot"));
    op(s.e, en); tf(s.e, "translate(560 560) scale(1.3)");
    s.rays.forEach((r, i) => r.to(1240, 260 + i * 30, 680, 520 + i * 30, ramp(t, a("see#2") + i * .15, a("see#2") + .8 + i * .15)));
    op(s.c, ramp(t, a("see#2"), a("see#2") + .2)); popAt(s.c, 760, 745, t, a("see#2")); }; return s; })();

// ---- DIRECT
S.direct = (() => { const s = scene("direct", "#1d3557", "#14213d");
  const ys = [230, 420, 610, 800];
  s.src = [["⭐", "star"], ["🕯️", "candle"], [null, "firefly"], ["💡", "bulb"]].map(([e, w], i) => { const g = el("g", {}, s.stage); if (e) emo(g, 0, 0, 120, e); else firefly(g); return {g, w, i}; });
  s.e = eye(s.stage, 1.4); s.rays = ys.map(() => ray(s.stage));
  s.c = chip(s.stage, "light goes STRAIGHT into our eyes ➜ seen DIRECTLY", "#f77f00", {fs: 34});
  s.run = t => { const a = w => C("direct", w);
    s.src.forEach(q => { op(q.g, ramp(t, a(q.w), a(q.w) + .2)); tf(q.g, `translate(380 ${ys[q.i]}) scale(${pop(t, a(q.w))})`); });
    op(s.e, ramp(t, a("straight") - .4, a("straight"))); tf(s.e, "translate(1250 520) scale(1.4)");
    s.rays.forEach((r, i) => r.to(470, ys[i], 1130, 520, ramp(t, a("straight") + i * .1, a("straight") + .7 + i * .1)));
    op(s.c, ramp(t, a("directly"), a("directly") + .2)); popAt(s.c, 760, 930, t, a("directly")); }; return s; })();

// ---- REFLECTION (2 steps)
S.reflect = (() => { const s = scene("reflect", "#fff3b0", "#ffd6a5");
  s.objs = [["✏️", "pencil"], ["🛋️", "sofa"], [null, "swing"]].map(([e, w], i) => ({e: e ? emo(s.stage, 0, 0, 150, e) : (() => { const g = el("svg", {overflow: "visible"}, s.stage); el("path", {d: "M-70 68 L-52 -62 M70 68 L52 -62", stroke: "#e63946", "stroke-width": 10, "stroke-linecap": "round"}, g); el("line", {x1: -62, y1: -62, x2: 62, y2: -62, stroke: "#e63946", "stroke-width": 12, "stroke-linecap": "round"}, g); el("path", {d: "M-24 -62 V28 M24 -62 V28", stroke: "#6c584c", "stroke-width": 5}, g); el("rect", {x: -36, y: 26, width: 72, height: 14, rx: 5, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, g); return g; })(), w, i}));
  s.no = chip(s.stage, "these do NOT give off light", "#6c757d", {fs: 38}); s.two = tx(s.stage, {x: 760, y: 820, "text-anchor": "middle", "font-size": 90, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "2 STEPS");
  s.lamp = emo(s.stage, 0, 0, 150, "💡"); s.sofa = emo(s.stage, 0, 0, 170, "🛋️"); s.e = eye(s.stage, 1.2); s.r1 = ray(s.stage); s.r2 = ray(s.stage);
  s.l1 = chip(s.stage, "① light FALLS ON the object", "#06d6a0", {fs: 32}); s.l2 = chip(s.stage, "② it BOUNCES OFF into our eyes", "#3a86ff", {fs: 32});
  s.refl = chip(s.stage, "bouncing off = REFLECTION", "#7209b7", {fs: 40}); s.ok = chip(s.stage, "✓ we SEE the object", "#06d6a0", {fs: 40});
  s.run = t => { const a = w => C("reflect1", w), b = w => C("reflect2", w); const dia = ramp(t, b("one") - .4, b("one"));
    s.objs.forEach(o => { op(o.e, ramp(t, a(o.w), a(o.w) + .2) * (1 - dia)); set(o.e, "x", 400 + o.i * 360); set(o.e, "y", 440); });
    op(s.no, on(t, a("not"), b("one") - .3, .2)); popAt(s.no, 760, 650, t, a("not")); op(s.two, on(t, a("two"), b("one") - .3, .2)); tf(s.two, `translate(760 820) scale(${pop(t, a("two"))}) translate(-760 -820)`);
    op(s.lamp, dia); set(s.lamp, "x", 300); set(s.lamp, "y", 260); op(s.sofa, dia); set(s.sofa, "x", 760); set(s.sofa, "y", 660); op(s.e, dia); tf(s.e, "translate(1250 380) scale(1.2)");
    s.r1.to(350, 320, 700, 600, ramp(t, b("falls") - .2, b("falls") + .6)); s.r2.to(820, 600, 1150, 420, ramp(t, b("bounces") - .1, b("enters") + .2));
    op(s.l1, ramp(t, b("falls"), b("falls") + .2)); popAt(s.l1, 330, 548, t, b("falls")); op(s.l2, ramp(t, b("bounces"), b("bounces") + .2)); popAt(s.l2, 1200, 642, t, b("bounces"));
    op(s.refl, ramp(t, b("reflection"), b("reflection") + .2)); popAt(s.refl, 760, 150, t, b("reflection")); op(s.ok, ramp(t, b("see"), b("see") + .2)); popAt(s.ok, 1150, 230, t, b("see")); }; return s; })();

// ---- BLACKOUT
S.blackout = (() => { const s = scene("blackout", "#2b2d42", "#1b1b3a");
  s.table = el("rect", {x: 500, y: 640, width: 520, height: 30, rx: 8, fill: "#8d5524", stroke: INK, "stroke-width": 6}, s.stage); s.pen = emo(s.stage, 760, 622, 110, "✏️"); tf(s.pen, "rotate(-45 760 622)");
  s.dark = el("rect", {x: 0, y: 0, width: 1920, height: 1080, fill: "#000"}, s.stage); s.q = tx(s.stage, {x: 760, y: 560, "text-anchor": "middle", "font-size": 120, "font-weight": 700, fill: "#adb5bd"}, "?");
  s.torch = emo(s.stage, 0, 0, 120, "🔦"); s.beam = el("path", {d: "M0 0 L400 175 L360 258 Z", fill: "#fff3b0", opacity: .5}, s.stage);
  s.e = eye(s.stage, 1); s.r1 = ray(s.stage); s.r2 = ray(s.stage); s.ok = chip(s.stage, "✓ Now you can see it!", "#06d6a0", {fs: 44});
  s.l1 = chip(s.stage, "① falls on the pencil", "#06d6a0", {fs: 30}); s.l2 = chip(s.stage, "② reflected into your eyes", "#3a86ff", {fs: 30});
  s.run = t => { const a = w => C("blackout", w); const on1 = ramp(t, a("switch") - .1, a("switch") + .2);
    op(s.dark, .92 * (1 - on1 * .55)); op(s.q, on(t, a("pencil"), a("switch"), .2)); op(s.pen, 1);
