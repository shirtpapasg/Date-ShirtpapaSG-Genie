<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2")}
  html,body{margin:0;padding:0;background:#000;width:1920px;height:1080px;overflow:hidden}

</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">🛣️ TheOneApp, Explained - Effects of Heat</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 22: expansion, contraction, change of state — series finale) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const HOT = "#e63946", COLD = "#3a86ff", MET = "#adb5bd";
function road(p, w = 1400) { const g = el("g", {}, p); g.a = el("rect", {y: -40, height: 80, fill: "#495057", stroke: INK, "stroke-width": 5}, g); g.b = el("rect", {y: -40, height: 80, fill: "#495057", stroke: INK, "stroke-width": 5}, g);
  g.d = el("line", {y1: 0, y2: 0, stroke: "#ffd166", "stroke-width": 8, "stroke-dasharray": "40 30"}, g);
  g.set = (gap, W = w) => { const half = (W - gap) / 2; set(g.a, "x", -W / 2); set(g.a, "width", half); set(g.b, "x", -W / 2 + half + gap); set(g.b, "width", half); set(g.d, "x1", -W / 2); set(g.d, "x2", W / 2); }; g.set(40); return g; }
function flask(p) { const g = el("g", {}, p); g.air = el("path", {d: "M-30 -130 V-60 L-110 80 Q-120 110 -90 110 H90 Q120 110 110 80 L30 -60 V-130 Z", fill: "#caf0f8", opacity: .7}, g);
  el("path", {d: "M-30 -130 V-60 L-110 80 Q-120 110 -90 110 H90 Q120 110 110 80 L30 -60 V-130", fill: "none", stroke: INK, "stroke-width": 7}, g);
  g.bal = el("ellipse", {cx: 0, cy: -140, rx: 34, ry: 18, fill: "#ef476f", stroke: INK, "stroke-width": 5}, g); g.blow = k => { set(g.bal, "ry", 18 + 110 * k); set(g.bal, "rx", 34 + 70 * k); set(g.bal, "cy", -140 - 100 * k); }; return g; }
function basin(p, w = 520, col = "#48cae4") { const g = el("g", {}, p); g.w = el("rect", {x: -w / 2, y: 0, width: w, height: 140, fill: col, opacity: .5}, g); el("path", {d: `M${-w / 2 - 10} -40 V140 H${w / 2 + 10} V-40`, fill: "none", stroke: INK, "stroke-width": 7}, g); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#90e0ef", "#caf0f8");
  s.r = road(s.stage); s.mag = el("g", {}, s.stage); el("circle", {r: 120, fill: "#ffffff55", stroke: INK, "stroke-width": 10}, s.mag); el("line", {x1: 85, y1: 85, x2: 180, y2: 180, stroke: INK, "stroke-width": 20, "stroke-linecap": "round"}, s.mag);
  s.car = emo(s.stage, 0, 0, 120, "🚗"); s.q = chip(s.stage, "🤔 a MISTAKE?", "#6c757d", {fs: 40}); s.ok = chip(s.stage, "✓ ON PURPOSE: because of HEAT 🔥", HOT, {fs: 40});
  s.run = t => { const a = w => C("hook", w);
    tf(s.r, "translate(760 620)"); op(s.r, 1); s.r.set(40); op(s.car, 1); set(s.car, "x", 100 + ((t * 250) % 1500)); tf(s.car, `translate(${2 * (100 + ((t * 250) % 1500))} 0) scale(-1 1)`); set(s.car, "y", 580);
    op(s.mag, ramp(t, a("gaps") - .2, a("gaps") + .2)); tf(s.mag, "translate(760 600)");
    op(s.q, on(t, a("mistakes"), a("engineers"), .2)); popAt(s.q, 760, 260, t, a("mistakes")); op(s.ok, ramp(t, a("purpose"), a("purpose") + .2)); popAt(s.ok, 760, 260, t, a("purpose")); }; return s; })();

// ---- THREE EFFECTS
S.three = (() => { const s = scene("three", "#ffd166", "#ff9f1c");
  s.t = chip(s.stage, "🔥 gain or lose heat ➜ 3 EFFECTS", "#1b1b3a", {fs: 42});
  s.e = [["🌡️", "temperature CHANGES", "temperature"], ["↔️", "EXPAND or CONTRACT", "expand"], ["🧊💧♨️", "CHANGE OF STATE", "state"]].map(([e, n, w], i) => { const g = el("g", {}, s.stage); el("rect", {x: -200, y: -170, width: 400, height: 340, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 7}, g); emo(g, 0, -40, e.length > 4 ? 84 : 120, e);
    tx(g, {x: 0, y: 110, "text-anchor": "middle", "font-size": 32, "font-weight": 700, fill: INK}, n); tx(g, {x: -160, y: -120, "font-size": 44, "font-weight": 700, fill: HOT}, String(i + 1)); return {g, w, i}; });
  s.run = t => { const a = w => C("three", w);
    op(s.t, ramp(t, a("three"), a("three") + .2)); popAt(s.t, 760, 180, t, a("three"));
    s.e.forEach(e => { const tt = a(e.w); op(e.g, ramp(t, tt, tt + .2)); tf(e.g, `translate(${330 + e.i * 430} 560) scale(${pop(t, tt)})`); }); }; return s; })();

// ---- DEFINE (particles spreading)
S.define = (() => { const s = scene("define", "#ffadad", "#a2d2ff");
  s.box = el("rect", {fill: "none", stroke: INK, "stroke-width": 7, rx: 14}, s.stage); s.pts = []; for (let i = 0; i < 25; i++) s.pts.push({u: (i % 5) - 2, v: Math.floor(i / 5) - 2, e: el("circle", {r: 18, fill: "#ffd166", stroke: INK, "stroke-width": 3}, s.stage)});
  s.c1 = chip(s.stage, "GAIN heat ➜ EXPANDS (volume ⬆)", HOT, {fs: 38}); s.c2 = chip(s.stage, "LOSE heat ➜ CONTRACTS (volume ⬇)", COLD, {fs: 38});
  s.run = t => { const a = w => C("define", w); const ex = ramp(t, a("expands") - .3, a("bigger") + .3), co = ramp(t, a("contracts") - .3, a("smaller") + .3), sc = 1 + .45 * ex - .65 * co;
    const half = 160 * sc; set(s.box, "x", 760 - half - 30); set(s.box, "y", 520 - half - 30); set(s.box, "width", 2 * half + 60); set(s.box, "height", 2 * half + 60);
    set(s.box, "stroke", sc > 1.05 ? HOT : sc < .95 ? COLD : INK);
    s.pts.forEach(p => { set(p.e, "cx", 760 + p.u * 64 * sc + Math.sin(t * (6 + 6 * ex) + p.u * 3) * 6 * sc); set(p.e, "cy", 520 + p.v * 64 * sc + Math.cos(t * (6 + 6 * ex) + p.v * 3) * 6 * sc); set(p.e, "fill", mix(mix("#ffd166", HOT, ex), COLD, co)); });
    op(s.c1, on(t, a("expands"), a("contracts") - .3, .2)); popAt(s.c1, 760, 150, t, a("expands")); op(s.c2, ramp(t, a("contracts"), a("contracts") + .2)); popAt(s.c2, 760, 150, t, a("contracts")); }; return s; })();

// ---- BALL AND RING
S.ball = (() => { const s = scene("ball", "#e0fbfc", "#c2dfe3");
  s.ring = el("g", {}, s.stage); el("rect", {x: -6, y: -310, width: 12, height: 190, fill: "#6c757d"}, s.ring); el("circle", {r: 80, fill: "none", stroke: MET, "stroke-width": 22}, s.ring); el("circle", {r: 80, fill: "none", stroke: INK, "stroke-width": 3}, s.ring);
  s.ballG = el("g", {}, s.stage); s.bl = el("circle", {r: 62, fill: MET, stroke: INK, "stroke-width": 5}, s.ballG); el("rect", {x: -5, y: -310, width: 10, height: 250, fill: "#6c757d"}, s.ballG);
  s.flame = emo(s.stage, 0, 0, 140, "🔥"); s.bs = basin(s.stage, 300, COLD);
  s.st = [["cool: ✓ passes through", "#06d6a0"], ["HEATED: expands ✗ doesn't fit!", HOT], ["cooled: contracts ✓ fits again", COLD]].map(([n, c]) => chip(s.stage, n, c, {fs: 34}));
  s.sol = chip(s.stage, "🧱 SOLIDS expand + contract", "#1b1b3a", {fs: 36});
  s.run = t => { const a = w => C("ball", w); const heat = ramp(t, a("heat"), a("expands") + .5), cool = ramp(t, a("cool#2") - .2, a("contracts") + .4), k = heat * (1 - cool);
    tf(s.ring, "translate(1000 520)"); op(s.ring, 1); set(s.bl, "r", 62 + 30 * k); set(s.bl, "fill", mix(MET, "#ff8c42", k));
    const ph = t < a("heat") - .5 ? 0 : t < a("cool#2") - .3 ? 1 : 2; const passX = ph === 0 ? lerp(700, 1000, ramp(t, a("passes") - .3, a("passes") + .5)) : ph === 1 ? lerp(500, 870, ramp(t, a("fits") - .8, a("fits"))) : lerp(500, 1000, ramp(t, a("slips") - .3, a("slips") + .5));
    tf(s.ballG, `translate(${passX} 520)`); op(s.ballG, 1);
    op(s.flame, on(t, a("heat"), a("cool#2") - .3, .2)); set(s.flame, "x", 500); set(s.flame, "y", 640); op(s.bs, on(t, a("cool#2") - .3, a("slips"), .2)); tf(s.bs, "translate(500 600)");
    op(s.st[0], on(t, a("passes"), a("heat"), .2)); popAt(s.st[0], 760, 150, t, a("passes")); op(s.st[1], on(t, a("fits") - .3, a("cool#2"), .2)); popAt(s.st[1], 760, 150, t, a("fits") - .3);
    op(s.st[2], on(t, a("contracts"), a("solids"), .2)); popAt(s.st[2], 760, 150, t, a("contracts")); op(s.sol, ramp(t, a("solids"), a("solids") + .2)); popAt(s.sol, 760, 150, t, a("solids")); }; return s; })();

// ---- LIQUID
S.liquid = (() => { const s = scene("liquid", "#fff3b0", "#ffd6a5");
  s.bs = basin(s.stage, 460); s.tt = el("g", {}, s.stage); el("path", {d: "M-60 -160 V120 Q-60 170 0 170 Q60 170 60 120 V-160", fill: "#ffffff88", stroke: INK, "stroke-width": 6}, s.tt); el("rect", {x: -60, y: -40, width: 120, height: 200, rx: 30, fill: "#7209b7", opacity: .7}, s.tt);
  el("rect", {x: -10, y: -420, width: 20, height: 400, fill: "#ffffffaa", stroke: INK, "stroke-width": 4}, s.tt); s.col = el("rect", {x: -6, width: 12, fill: "#7209b7"}, s.tt); el("rect", {x: -70, y: -180, width: 140, height: 30, rx: 8, fill: "#6c757d", stroke: INK, "stroke-width": 4}, s.tt);
  s.c1 = chip(s.stage, "hot water ➜ coloured water EXPANDS ⬆", HOT, {fs: 34}); s.c2 = chip(s.stage, "taken out ➜ CONTRACTS ⬇", COLD, {fs: 34}); s.lab = chip(s.stage, "💧 LIQUIDS expand + contract", "#1b1b3a", {fs: 34});
  s.run = t => { const a = w => C("liquid", w); const inn = ramp(t, a("into") - .3, a("into") + .5), up = ramp(t, a("rises") - .3, a("expands") + .5), dn = ramp(t, a("falls") - .3, a("contracts") + .4), out = ramp(t, a("take") - .2, a("take") + .4);
    tf(s.bs, "translate(760 640)"); op(s.bs, ramp(t, a("hot") - .3, a("hot"))); tf(s.tt, `translate(760 ${lerp(420, 560, inn) - out * 140})`);
    const h = 60 + 220 * up * (1 - dn); set(s.col, "y", -20 - h); set(s.col, "height", h);
    op(s.c1, on(t, a("rises"), a("take"), .2)); popAt(s.c1, 760, 130, t, a("rises")); op(s.c2, ramp(t, a("falls"), a("falls") + .2)); popAt(s.c2, 760, 130, t, a("falls"));
    op(s.lab, ramp(t, a("liquids"), a("liquids") + .2)); popAt(s.lab, 1250, 860, t, a("liquids")); }; return s; })();

// ---- GAS (flask + balloon)
S.gas = (() => { const s = scene("gas", "#caffbf", "#9bf6ff");
  s.bs = basin(s.stage, 460); s.f = flask(s.stage); s.c0 = chip(s.stage, "💨 GASES expand the MOST", "#06d6a0", {fs: 40});
  s.c1 = chip(s.stage, "air EXPANDS ➜ balloon inflates 🎈", HOT, {fs: 34}); s.c2 = chip(s.stage, "air CONTRACTS ➜ balloon goes flat", COLD, {fs: 34});
  s.run = t => { const a = w => C("gas", w); const up = ramp(t, a("expands") - .3, a("inflates") + .6), dn = ramp(t, a("contracts") - .3, a("flat") + .3), out = ramp(t, a("remove") - .2, a("remove") + .4);
