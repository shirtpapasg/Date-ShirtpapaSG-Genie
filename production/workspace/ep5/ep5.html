<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2")}

</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">❤️ TheOneApp, Explained - Body Systems</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 5: human body systems) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const SKIN = "#ffcfa3";
function kid(p, opt = {}) { const g = el("g", {}, p), K = {g};
  K.legs = el("g", {}, g); K.legL = el("path", {d: "M-50 560 L-60 780", stroke: "#3a86ff", "stroke-width": 62, "stroke-linecap": "round"}, K.legs); K.legR = el("path", {d: "M50 560 L60 780", stroke: "#3a86ff", "stroke-width": 62, "stroke-linecap": "round"}, K.legs);
  K.armL = el("path", {d: "M-120 300 Q-200 400 -190 540", stroke: SKIN, "stroke-width": 46, "stroke-linecap": "round", fill: "none"}, g); K.armR = el("path", {d: "M120 300 Q200 400 190 540", stroke: SKIN, "stroke-width": 46, "stroke-linecap": "round", fill: "none"}, g);
  el("rect", {x: -135, y: 260, width: 270, height: 320, rx: 80, fill: opt.shirt || "#ffbe0b", stroke: INK, "stroke-width": 6}, g);
  el("circle", {cx: 0, cy: 170, r: 90, fill: SKIN, stroke: INK, "stroke-width": 6}, g);
  el("circle", {cx: -30, cy: 160, r: 9, fill: INK}, g); el("circle", {cx: 30, cy: 160, r: 9, fill: INK}, g); el("path", {d: "M-28 205 Q0 228 28 205", stroke: INK, "stroke-width": 6, fill: "none", "stroke-linecap": "round"}, g);
  K.parts = {}; const P = (k, f) => { const pg = el("g", {opacity: 0}, g); f(pg); K.parts[k] = pg; };
  P("nose", pg => el("circle", {cx: 0, cy: 185, r: 15, fill: "#ff8fab", stroke: INK, "stroke-width": 4}, pg));
  P("windpipe", pg => el("rect", {x: -11, y: 240, width: 22, height: 95, rx: 10, fill: "#ffafcc", stroke: INK, "stroke-width": 4}, pg));
  P("lungs", pg => { el("path", {d: "M-14 330 Q-110 320 -100 450 Q-55 478 -14 440 Z", fill: "#ff8fab", stroke: INK, "stroke-width": 5}, pg); el("path", {d: "M14 330 Q110 320 100 450 Q55 478 14 440 Z", fill: "#ff8fab", stroke: INK, "stroke-width": 5}, pg); });
  P("heart", pg => emo(pg, 28, 375, 66, "❤️"));
  P("vessels", pg => el("path", {d: "M28 375 Q-90 430 -190 540 M28 375 Q120 470 190 540 M0 380 L-60 770 M10 390 L70 770 M0 300 L0 210", stroke: "#e63946", "stroke-width": 7, fill: "none", "stroke-dasharray": "14 8"}, pg));
  P("bones", pg => { el("path", {d: "M-55 590 L-62 770 M55 590 L62 770 M-120 310 Q-190 410 -185 530 M120 310 Q190 410 185 530 M0 270 L0 560", stroke: "#fff", "stroke-width": 13, "stroke-linecap": "round", fill: "none"}, pg);
    for (let i = 0; i < 4; i++) el("path", {d: `M-85 ${330 + i * 32} Q0 ${348 + i * 32} 85 ${330 + i * 32}`, stroke: "#fff", "stroke-width": 8, fill: "none"}, pg); el("circle", {cx: 0, cy: 160, r: 80, fill: "none", stroke: "#fff", "stroke-width": 8, "stroke-dasharray": "10 6"}, pg); });
  P("muscles", pg => { el("ellipse", {cx: -175, cy: 400, rx: 30, ry: 52, fill: "#ff595e", stroke: INK, "stroke-width": 4}, pg); el("ellipse", {cx: 175, cy: 400, rx: 30, ry: 52, fill: "#ff595e", stroke: INK, "stroke-width": 4}, pg); el("ellipse", {cx: -58, cy: 650, rx: 28, ry: 60, fill: "#ff595e", stroke: INK, "stroke-width": 4}, pg); el("ellipse", {cx: 58, cy: 650, rx: 28, ry: 60, fill: "#ff595e", stroke: INK, "stroke-width": 4}, pg); });
  P("digestive", pg => { el("path", {d: "M0 230 L0 450", stroke: "#f4a3b4", "stroke-width": 12}, pg); el("path", {d: "M-10 450 Q60 440 50 490 Q20 520 -30 500 Z", fill: "#e0707f", stroke: INK, "stroke-width": 5}, pg);
    el("path", {d: "M-50 515 q30 -14 60 0 q30 14 0 28 q-30 14 -60 0 q-30 -14 0 -28 M-70 555 q60 30 120 0", stroke: "#f4a3b4", "stroke-width": 12, fill: "none", "stroke-linecap": "round"}, pg); });
  return K; }
const showParts = (K, ks, v) => ks.forEach(k => op(K.parts[k], v));

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#4cc9f0", "#7209b7");
  s.K = kid(s.stage); s.icons = ["🫁", "❤️", "🦴", "💪", "🍽️"].map(e => emo(s.stage, 0, 0, 100, e));
  s.five = el("g", {}, s.stage); el("circle", {r: 88, fill: "#ffbe0b", stroke: INK, "stroke-width": 7}, s.five); tx(s.five, {x: 0, y: 44, "text-anchor": "middle", "font-size": 124, "font-weight": 700, fill: INK}, "5");
  s.trouble = chip(s.stage, "⚠ one stops = whole body in trouble", "#e63946", {fs: 32});
  s.run = t => { const a = w => C("hook", w);
    tf(s.K.g, `translate(760 40) scale(.85)`); showParts(s.K, ["lungs", "heart", "bones", "muscles", "digestive"], .35 + .35 * Math.sin(t * 3));
    s.icons.forEach((e, i) => { const an = t * .8 + i * 2 * Math.PI / 5; op(e, ramp(t, a("five") + i * .15, a("five") + .2 + i * .15)); set(e, "x", 760 + Math.cos(an) * 400); set(e, "y", 420 + Math.sin(an) * 280); });
    popAt(s.five, 1300, 180, t, a("five")); op(s.five, ramp(t, a("five"), a("five") + .2));
    op(s.trouble, on(t, a("trouble") - .2, a("can"), .2)); popAt(s.trouble, 760, 805, t, a("trouble") - .2); }; return s; })();

// ---- RUN
S.run = (() => { const s = scene("run", "#80ed99", "#57cc99");
  s.K = kid(s.stage, {shirt: "#ef476f"}); s.heart = emo(s.stage, 0, 0, 120, "❤️"); s.bpm = tx(s.stage, {x: 1270, y: 400, "text-anchor": "middle", "font-size": 54, "font-weight": 700, fill: INK}, "");
  s.puffs = [0, 1, 2].map(() => el("ellipse", {rx: 40, ry: 26, fill: "#fff", opacity: 0}, s.stage)); s.food = emo(s.stage, 0, 0, 90, "🍔"); s.think = el("ellipse", {rx: 90, ry: 70, fill: "#fff", stroke: INK, "stroke-width": 5, opacity: 0}, s.stage);
  s.tog = chip(s.stage, "systems working TOGETHER", "#3a86ff", {fs: 36}); s.timer = chip(s.stage, "🏃 30 seconds", "#ff9f1c", {fs: 36});
  s.run = t => { const a = w => C("run", w); const go = on(t, a("run"), SC.run.t1 + 1, .3);
    const sw = Math.sin(t * 12) * 18 * go; set(s.K.legL, "d", `M-50 560 L${-60 + sw * 3} 780`); set(s.K.legR, "d", `M50 560 L${60 - sw * 3} 780`); tf(s.K.g, `translate(560 ${-30 + Math.abs(Math.sin(t * 12)) * -14 * go}) scale(.85)`);
    op(s.timer, on(t, a("run"), a("notice"), .2)); popAt(s.timer, 1100, 180, t, a("run"));
    const hb = ramp(t, a("heart"), a("heart") + .3); op(s.heart, hb); tf(s.heart, `translate(1050 380) scale(${1 + .18 * Math.max(0, Math.sin(t * (hb ? 16 : 6)))})`); set(s.heart, "x", 0); set(s.heart, "y", 0);
    s.bpm.textContent = hb ? "faster! ⬆" : ""; op(s.bpm, hb);
    s.puffs.forEach((p, i) => { const k = ((t * 1.3 + i / 3) % 1); set(p, "cx", 700 + k * 160); set(p, "cy", 150 - k * 40); op(p, ramp(t, a("breathe"), a("breathe") + .3) * (1 - k) * .9); });
    op(s.think, ramp(t, a("hungry"), a("hungry") + .2)); set(s.think, "cx", 820); set(s.think, "cy", 80 + 40); op(s.food, ramp(t, a("hungry"), a("hungry") + .2)); set(s.food, "x", 820); set(s.food, "y", 120);
    op(s.tog, ramp(t, a("together"), a("together") + .2)); popAt(s.tog, 1100, 600, t, a("together")); }; return s; })();

// ---- MODELS
S.models = (() => { const s = scene("models", "#ffd166", "#ff9f1c");
  s.m = el("g", {}, s.stage); el("rect", {x: -230, y: -260, width: 460, height: 520, rx: 26, fill: "#fff", stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, s.m);
  const mk = kid(s.m); tf(mk.g, "translate(0 -268) scale(.58)"); showParts(mk, ["lungs", "heart"], 1); tx(s.m, {x: 0, y: 245, "text-anchor": "middle", "font-size": 38, "font-weight": 700, fill: INK}, "MODEL 📐");
  s.r = el("g", {}, s.stage); el("rect", {x: -230, y: -260, width: 460, height: 520, rx: 26, fill: "#fff", stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, s.r);
  const rk = kid(s.r, {shirt: "#48cae4"}); tf(rk.g, "translate(0 -268) scale(.58)"); showParts(rk, ["lungs", "heart", "vessels", "bones", "muscles", "digestive"], 1); tx(s.r, {x: 0, y: 245, "text-anchor": "middle", "font-size": 38, "font-weight": 700, fill: INK}, "REAL BODY 🤯");
  s.simp = chip(s.stage, "a model is SIMPLER, but helps us understand", "#1b1b3a", {fs: 32});
  s.run = t => { const a = w => C("models", w);
    op(s.m, ramp(t, a("model"), a("model") + .2)); tf(s.m, `translate(470 450) scale(${pop(t, a("model"))})`);
    op(s.r, ramp(t, a("real"), a("real") + .2)); tf(s.r, `translate(1050 450) scale(${pop(t, a("real"))})`);
    op(s.simp, ramp(t, a("helps"), a("helps") + .2)); popAt(s.simp, 760, 790 - 40, t, a("helps")); }; return s; })();

// ---- RESPIRATORY
S.resp = (() => { const s = scene("resp", "#a2d2ff", "#bde0fe");
  s.K = kid(s.stage, {shirt: "#90e0ef"}); s.num = tx(s.stage, {x: 90, y: 280, "font-size": 160, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 14}, "1");
  s.lab = [["nose", "NOSE"], ["windpipe", "WINDPIPE"], ["lungs", "LUNGS"]].map(([k, n], i) => ({k, c: chip(s.stage, n, "#ff8fab", {fs: 36}), x: 400, y: 240 + i * 130}));
  s.in = [0, 1, 2, 3].map(() => tx(s.stage, {"font-size": 30, "font-weight": 700, fill: "#3a86ff", "text-anchor": "middle"}, "O₂")); s.out = [0, 1, 2].map(() => el("circle", {r: 14, fill: "#adb5bd", stroke: INK, "stroke-width": 2}, s.stage));
  s.ex = chip(s.stage, "exchange of gases: oxygen IN ↘ waste gases OUT ↗", "#3a86ff", {fs: 30});
  s.run = t => { const a = w => C("resp", w);
    tf(s.K.g, "translate(860 -5) scale(.92)"); op(s.num, ramp(t, SC.resp.t0 - .2, SC.resp.t0 + .1));
    const T = {nose: a("nose"), windpipe: a("windpipe"), lungs: a("lungs")}; for (const k in T) op(s.K.parts[k], ramp(t, T[k], T[k] + .2));
    tf(s.K.parts.lungs, `translate(0 390) scale(${1 + .07 * Math.sin(t * 3)}) translate(0 -390)`);
    s.lab.forEach(L => { op(L.c, ramp(t, T[L.k], T[L.k] + .2)); popAt(L.c, L.x, L.y, t, T[L.k]); });
    const g = on(t, a("take"), SC.resp.t1 + .5, .2);
    s.in.forEach((e, i) => { const k = ((t * .7 + i / 4) % 1); set(e, "x", 860 + lerp(-200, 0, k)); set(e, "y", lerp(150, 400, k)); op(e, g * Math.sin(k * Math.PI)); });
    s.out.forEach((e, i) => { const k = ((t * .7 + i / 3 + .5) % 1); set(e, "cx", 860 + lerp(0, 230, k)); set(e, "cy", lerp(190, 80, k)); op(e, ramp(t, a("waste"), a("waste") + .3) * Math.sin(k * Math.PI)); });
    op(s.ex, ramp(t, a("exchange"), a("exchange") + .2)); popAt(s.ex, 860, 776, t, a("exchange")); }; return s; })();

// ---- CIRCULATORY
S.circ = (() => { const s = scene("circ", "#ffccd5", "#ffb3c1");
