    set(s.l1, "stroke-dashoffset", 600 * (1 - ramp(t, a("shadows") - .3, a("shadows") + .3))); op(s.l1, t > a("shadows") - .3 ? 1 : 0);
    op(s.br, ramp(t, a("shadows"), a("shadows") + .2)); popAt(s.br, 900, 420, t, a("shadows"));
    s.subs.forEach(c => { const tt = a(c.w); op(c.c, ramp(t, tt, tt + .2)); popAt(c.c, 920, 510 + c.i * 76, t, tt); });
    op(s.ult, on(t, a("ultimate"), SC.mindmap.t1 + .5, .2)); popAt(s.ult, 640, 130, t, a("ultimate"));
    const ph = ramp(t, a("save"), a("save") + .6); op(s.phone, ph); tf(s.phone, `translate(${lerp(1650, 1390, ph)} 540) rotate(${lerp(12, -4, ph)})`);
    const nx = a("ultimate") + .6; const off = -122 - (IH - 327) * ramp(t, a("save"), nx); set(s.shot, "y", off); const sc = IH / 2000;
    set(s.ring, "x", -112 + 36 * sc); set(s.ring, "y", off + 1722 * sc); set(s.ring, "width", 156 * sc); set(s.ring, "height", 72 * sc);
    op(s.ring, on(t, nx, SC.mindmap.t1 + .5, .15) * (.6 + .4 * Math.sin(t * 8))); }; return s; })();

// ---- CLOSE
S.close = (() => { const s = scene("close", "#3a0ca3", "#f72585");
  s.ans = el("g", {}, s.stage); el("rect", {x: -430, y: -70, width: 860, height: 140, rx: 70, fill: "#06d6a0", stroke: INK, "stroke-width": 7}, s.ans); tx(s.ans, {x: 0, y: 22, "text-anchor": "middle", "font-size": 52, "font-weight": 700, fill: "#fff"}, "🧊 It blocks SOME of the light!");
  s.cards = [0, 1, 2].map(i => { const g = el("g", {}, s.stage); el("rect", {x: -18, y: -140, width: 36, height: 280, rx: 6, fill: "#e9c46a", stroke: INK, "stroke-width": 5}, g); el("circle", {r: 11, fill: "#1b1b3a"}, g); return g; });
  s.torch = emo(s.stage, 0, 0, 120, "🔦"); s.adult = emo(s.stage, 0, 0, 150, "🧑"); s.c = chip(s.stage, "👩 with an adult · 🔦 torch, not a candle", "#1b1b3a", {fs: 34});
  s.run = t => { const a = w => C("close", w); const tn = ramp(t, a("your") - .2, a("your") + .1);
    op(s.ans, ramp(t, a("blocks"), a("blocks") + .15) * (1 - tn)); tf(s.ans, `translate(760 420) scale(${pop(t, a("blocks"))})`);
    s.cards.forEach((g, i) => { const tt = a("threecard") + i * .2; op(g, ramp(t, tt, tt + .2)); tf(g, `translate(${640 + i * 180} 460)`); });
    op(s.adult, ramp(t, a("adult"), a("adult") + .2)); set(s.adult, "x", 1250); set(s.adult, "y", 450);
    op(s.torch, ramp(t, a("torch"), a("torch") + .2)); set(s.torch, "x", 420); set(s.torch, "y", 460); tf(s.torch, "rotate(135 420 460)");
    op(s.c, ramp(t, a("adult"), a("adult") + .2)); popAt(s.c, 760, 760, t, a("adult")); }; return s; })();

// ---- END CARD
S.end = (() => { const s = scene("end", "#3a0ca3", "#7209b7");
  tx(s.stage, {x: 960, y: 360, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: "#ffe14d", "letter-spacing": 6}, "NEXT EPISODE");
  tx(s.stage, {x: 960, y: 480, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "Make your shadow GIANT…");
  tx(s.stage, {x: 960, y: 580, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "then tiny 🔦");
  s.run = () => {}; return s; })();


window.INTRO = {"goals": [["👤", "What a shadow is", "first"], ["➡️", "Light travels in straight lines", "second"], ["🪟", "Opaque and translucent", "third"]]};
// ---- WELCOME (greeting + "today you'll learn")
S.welcome = (() => { const sv = seed; seed = 424242; const s = scene("welcome", "#ffd166", "#ef476f"), I = window.INTRO;
  s.wave = emo(s.stage, 0, 0, 190, "👋");
  s.hi = el("g", {}, s.stage);
  tx(s.hi, {x: 0, y: 0, "text-anchor": "middle", "font-size": 72, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "Welcome to");
  tx(s.hi, {x: 0, y: 125, "text-anchor": "middle", "font-size": 118, "font-weight": 700, fill: "#ffe14d", class: "out", "stroke-width": 14}, "P4 SCIENCE, EXPLAINED!");
  s.board = el("g", {}, s.stage);
  el("rect", {x: -700, y: -380, width: 1400, height: 720, rx: 46, fill: "#fffaf0", stroke: INK, "stroke-width": 8, filter: "url(#sh)"}, s.board);
  el("rect", {x: -700, y: -380, width: 1400, height: 130, rx: 46, fill: INK}, s.board);
  el("rect", {x: -700, y: -290, width: 1400, height: 40, fill: INK}, s.board);
  tx(s.board, {x: 0, y: -293, "text-anchor": "middle", "font-size": 66, "font-weight": 700, fill: "#ffe14d", "letter-spacing": 3}, "🎯 TODAY YOU'LL LEARN");
  const cols = ["#ff5d73", "#3a86ff", "#06d6a0"];
  s.rows = I.goals.map(([icon, label, cue], i) => { const g = el("g", {}, s.board), y = -120 + i * 175;
    el("circle", {cx: -560, cy: y, r: 56, fill: cols[i], stroke: INK, "stroke-width": 6}, g);
    tx(g, {x: -560, y: y + 25, "text-anchor": "middle", "font-size": 70, "font-weight": 700, fill: "#fff"}, String(i + 1));
    emo(g, -420, y, 92, icon);
    tx(g, {x: -330, y: y + 21, "font-size": 58, "font-weight": 700, fill: INK}, label);
    return {g, y, cue}; });
  s.run = t => { const T0 = SC.welcome.t0, tB = C("welcome", "today") - .35, go = C("welcome", I.go || "started");
    // phase A: wave + welcome
    const a = 1 - ramp(t, tB - .3, tB + .1);
    tf(s.wave, `translate(960 ${330 - 40 * (1 - a)}) scale(${Math.max(0, pop(t, T0 - .1)) * a}) rotate(${Math.sin(t * 9) * 18})`);
    tf(s.hi, `translate(960 ${590 - 60 * (1 - a)}) scale(${Math.max(0, pop(t, C("welcome", "welcome") - .15)) * a})`); op(s.hi, a);
    // phase B: learning board, one row per goal
    const b = Math.max(0, pop(t, tB, .55)), bump = 1 + .04 * on(t, go, go + .5, .2);
    tf(s.board, `translate(960 ${520 + Math.sin(t * 1.5) * 6}) scale(${b * bump})`); op(s.board, b > 0 ? 1 : 0);
    s.rows.forEach(r => { const k = Math.max(0, pop(t, C("welcome", r.cue) - .1));
      tf(r.g, `translate(${-60 * (1 - Math.min(1, k))} 0)`); op(r.g, clamp(k)); });
  };
  seed = sv; return s; })();

/* ---------- confetti ---------- */
function burst() {}
const BURSTS = []; // precomputed so rendering is deterministic per frame
seed = 77; const conf = []; for (let i = 0; i < 70; i++) conf.push({vx: (rnd() - .5) * 1400, vy: -600 - rnd() * 700, rot: rnd() * 720, col: ["#ff5d73", "#ffbe0b", "#06d6a0", "#3a86ff", "#b5179e", "#fff"][i % 6], e: el("rect", {width: 18, height: 10, rx: 3, opacity: 0}, $("confetti"))});
conf.forEach(c => set(c.e, "fill", c.col));
function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

/* ---------- keyword box → shelf ---------- */
const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
function fitPill(g, pad) { const r = g.querySelector("rect"), t = g.querySelector("text"); if (!r || !t) return 0;
  const need = t.getBBox().width + pad, w = +r.getAttribute("width");
  if (need > w) { const cx = +r.getAttribute("x") + w / 2; set(r, "width", need); set(r, "x", cx - need / 2); } return Math.max(need, w); }
function shrinkText(g, fs) { const r = g.querySelector("rect"), t = g.querySelector("text"); const w = +r.getAttribute("width") - fs * 1.1, bw = t.getBBox().width;
  if (bw > w) set(t, "font-size", fs * w / bw); }
document.fonts.ready.then(() => {
  CHIPS.forEach(([g, fs, fixed]) => fixed ? shrinkText(g, fs) : fitPill(g, fs * 1.3));
  KW.forEach(K => { fitPill(K.big, 70); K.sw = fitPill(K.small, 36); });
  CAPS.forEach(({g}) => fitPill(g, 64));
  window.READY = true; });
</script>
