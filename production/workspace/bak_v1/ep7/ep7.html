<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}

<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="27" font-weight="700" fill="#fff" letter-spacing="1">🌀 P4 SCIENCE · EP 7</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 7: digestion part 2 — small + large intestine) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const PINK = "#ffafcc", BROWN = "#a0522d";
function coilD(x0, y0, w, rows, gap) { let d = `M${x0} ${y0}`; for (let r = 0; r < rows; r++) { const y = y0 + r * gap, xe = r % 2 ? x0 : x0 + w; d += ` L${xe} ${y}`; if (r < rows - 1) d += ` A${gap / 2} ${gap / 2} 0 0 ${r % 2 ? 0 : 1} ${xe} ${y + gap}`; } return d; }
function tubePath(p, d, w, col) { const g = el("g", {}, p); const o = el("path", {d, fill: "none", stroke: INK, "stroke-width": w + 12, "stroke-linecap": "round", "stroke-linejoin": "round"}, g); const i = el("path", {d, fill: "none", stroke: col, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round"}, g); return {g, o, i}; }
function miniSmall(p) { const g = el("g", {}, p); tubePath(g, coilD(-50, -50, 100, 5, 25), 12, PINK); return g; }
function miniLarge(p) { const g = el("g", {}, p); tubePath(g, "M-55 55 V-45 H55 V55", 28, "#f4a261"); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#ffd166", "#f77f00");
  s.tube = el("rect", {x: 0, y: -28, height: 56, rx: 28, fill: PINK, stroke: INK, "stroke-width": 7}, s.stage);
  s.ruler = el("g", {}, s.stage); el("line", {x1: 0, y1: 0, x2: 1300, y2: 0, stroke: "#fff", "stroke-width": 6}, s.ruler); [0, 1300].forEach(x => el("line", {x1: x, y1: -20, x2: x, y2: 20, stroke: "#fff", "stroke-width": 6}, s.ruler));
  s.len = tx(s.stage, {x: 760, y: 700, "text-anchor": "middle", "font-size": 96, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "about 6.5 metres!");
  s.gir = emo(s.stage, 0, 0, 300, "🦒"); s.vs = chip(s.stage, "longer than a giraffe is tall!", "#e63946", {fs: 40});
  s.kid = emo(s.stage, 0, 0, 260, "🧒"); s.q = tx(s.stage, {x: 0, y: 0, "text-anchor": "middle", "font-size": 160, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "?"); s.lunch = emo(s.stage, 0, 0, 120, "🍱");
  s.run = t => { const a = w => C("hook", w); const g = ramp(t, a("tube") - .3, a("long") + .3), fit = ramp(t, a("fit") - .2, a("fit") + .5);
    set(s.tube, "width", 1300 * g); tf(s.tube, `translate(${lerp(110, 700, fit)} ${lerp(470, 470, fit)}) scale(${1 - fit * .9} 1)`); op(s.tube, 1 - fit);
    op(s.ruler, ramp(t, a("six"), a("six") + .2) * (1 - fit)); tf(s.ruler, "translate(110 560)");
    op(s.len, on(t, a("six"), a("fit") - .2, .2)); tf(s.len, `translate(760 700) scale(${pop(t, a("six"))}) translate(-760 -700)`);
    op(s.gir, on(t, a("giraffe") - .3, a("fit") - .2, .2)); set(s.gir, "x", 1280); set(s.gir, "y", 250);
    op(s.vs, on(t, a("giraffe"), a("fit") - .2, .2)); popAt(s.vs, 760, 200, t, a("giraffe"));
    op(s.kid, fit); set(s.kid, "x", 700); set(s.kid, "y", 470); op(s.q, fit); set(s.q, "x", 900); set(s.q, "y", 420 + Math.sin(t * 5) * 8);
    op(s.lunch, ramp(t, a("lunch"), a("lunch") + .2)); set(s.lunch, "x", 520); set(s.lunch, "y", 380); }; return s; })();

// ---- RECAP
S.recap = (() => { const s = scene("recap", "#90e0ef", "#00b4d8");
  const xs = [260, 480, 700, 920, 1140];
  s.line = el("line", {x1: 260, y1: 460, x2: 1140, y2: 460, stroke: "#fff", "stroke-width": 10, "stroke-dasharray": "18 16"}, s.stage);
  s.nodes = xs.map((x, i) => { const g = el("g", {}, s.stage); el("circle", {r: 90, fill: "#fff", stroke: INK, "stroke-width": 7}, g);
    if (i < 3) emo(g, 0, 0, 100, ["👄", "⬇️", "🫃"][i]); else tx(g, {x: 0, y: 30, "text-anchor": "middle", "font-size": 100, "font-weight": 700, fill: "#adb5bd"}, "?");
    tx(g, {x: 0, y: 140, "text-anchor": "middle", "font-size": 32, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 7}, ["mouth", "gullet", "stomach", "stop 4", "stop 5"][i]); return g; });
  s.soup = emo(s.stage, 0, 0, 110, "🥣"); s.part = chip(s.stage, "PART 2: the second half of the journey ➜", "#7209b7", {fs: 36});
  s.run = t => { const a = w => C("recap", w); const k = [a("mouth"), a("gullet"), a("stomach"), a("second"), a("second") + .3];
    s.nodes.forEach((n, i) => { op(n, ramp(t, k[i], k[i] + .2)); tf(n, `translate(${xs[i]} 460) scale(${pop(t, k[i])})`); });
    op(s.soup, ramp(t, a("soupy"), a("soupy") + .2)); set(s.soup, "x", 700); set(s.soup, "y", 260 + Math.sin(t * 4) * 6);
    op(s.part, ramp(t, a("second"), a("second") + .2)); popAt(s.part, 760, 760, t, a("second")); }; return s; })();

// ---- SMALL INTESTINE
S.small = (() => { const s = scene("small", "#ffc8dd", "#ffafcc");
  s.straight = el("rect", {x: 100, y: 432, width: 1300, height: 36, rx: 18, fill: PINK, stroke: INK, "stroke-width": 6}, s.stage);
  s.belly = el("ellipse", {cx: 640, cy: 470, rx: 330, ry: 300, fill: "#fff0f3", stroke: INK, "stroke-width": 6, "stroke-dasharray": "20 14"}, s.stage);
  s.coil = tubePath(s.stage, coilD(470, 250, 340, 9, 55), 30, PINK); s.coilLen = 9 * 340 + 8 * Math.PI * 27.5;
  [s.coil.o, s.coil.i].forEach(p => set(p, "stroke-dasharray", s.coilLen));
  s.food = []; seed = 4; for (let i = 0; i < 14; i++) s.food.push({ph: rnd(), e: el("circle", {r: 9, fill: "#f3d5b5", stroke: "#d4a373", "stroke-width": 3}, s.stage)});
  s.drops = []; for (let i = 0; i < 8; i++) s.drops.push({ph: i / 8, e: emo(s.stage, 0, 0, 40, "🧪")});
  s.c1 = chip(s.stage, "SMALL INTESTINE: long + narrow", "#ef476f", {fs: 34}); s.c2 = chip(s.stage, "folded + coiled up 🌀 so it fits", "#1b1b3a", {fs: 32});
  s.c3 = chip(s.stage, "walls make MORE digestive juices", "#06d6a0", {fs: 32}); s.c4 = chip(s.stage, "➜ simple substances the body can use", "#3a86ff", {fs: 30});
  s.stamp = el("g", {}, s.stage); el("rect", {x: -300, y: -60, width: 600, height: 120, rx: 18, fill: "#fff", stroke: "#e63946", "stroke-width": 10}, s.stamp); tx(s.stamp, {x: 0, y: 22, "text-anchor": "middle", "font-size": 56, "font-weight": 700, fill: "#e63946"}, "🏁 DIGESTION ENDS!");
  s.run = t => { const a = w => C("small1", w), b = w => C("small2", w); const coil = ramp(t, a("folded") - .2, a("coiled") + .6);
    op(s.straight, ramp(t, a("long") - .3, a("long")) * (1 - ramp(t, a("folded") - .3, a("folded")))); tf(s.straight, `scale(${ramp(t, a("long") - .3, a("long") + .4)} 1)`);
    op(s.belly, ramp(t, a("folded") - .3, a("folded"))); [s.coil.o, s.coil.i].forEach(p => set(p, "stroke-dashoffset", s.coilLen * (1 - coil))); op(s.coil.g, coil > 0 ? 1 : 0);
    const dig = ramp(t, b("digest"), b("ends")); s.food.forEach((f, i) => { const k = (t * .05 + f.ph) % 1; const row = Math.floor(k * 9), fr = (k * 9) % 1;
      set(f.e, "cx", 470 + (row % 2 ? 1 - fr : fr) * 340); set(f.e, "cy", 250 + row * 55); set(f.e, "r", 9 * (1 - dig * .55)); op(f.e, ramp(t, SC.small.t0 + 1, SC.small.t0 + 1.5) * coil); });
    s.drops.forEach((d, i) => { const k = ((t * .7 + d.ph) % 1); set(d.e, "x", 470 + i * 48); set(d.e, "y", lerp(200, 700, k)); op(d.e, on(t, b("juices"), b("ends"), .3) * Math.sin(k * Math.PI)); });
    op(s.c1, ramp(t, a("intestine"), a("intestine") + .2) * (1 - ramp(t, b("walls") - .3, b("walls")))); popAt(s.c1, 1220, 300, t, a("intestine"));
    op(s.c2, ramp(t, a("coiled"), a("coiled") + .2) * (1 - ramp(t, b("walls") - .3, b("walls")))); popAt(s.c2, 1220, 420, t, a("coiled"));
    op(s.c3, ramp(t, b("walls"), b("walls") + .2)); popAt(s.c3, 1220, 300, t, b("walls"));
    op(s.c4, ramp(t, b("simple"), b("simple") + .2)); popAt(s.c4, 1220, 420, t, b("simple"));
    op(s.stamp, ramp(t, b("ends"), b("ends") + .15)); tf(s.stamp, `translate(640 840) rotate(-4) scale(${1.4 - .4 * ramp(t, b("ends"), b("ends") + .25)})`); }; return s; })();

// ---- ABSORPTION
S.absorb = (() => { const s = scene("absorb", "#ffe5ec", "#ffc2d1");
  el("rect", {x: 120, y: 170, width: 1040, height: 150, fill: "#fff0f3", stroke: "none"}, s.stage);
  s.wall = el("g", {}, s.stage); el("rect", {x: 120, y: 320, width: 1040, height: 60, fill: PINK, stroke: INK, "stroke-width": 5}, s.wall); for (let i = 0; i < 14; i++) el("path", {d: `M${150 + i * 74} 320 q20 -50 40 0`, fill: PINK, stroke: INK, "stroke-width": 4}, s.wall);
  s.ves = el("rect", {x: 120, y: 470, width: 1040, height: 110, rx: 55, fill: "#e63946", stroke: INK, "stroke-width": 6}, s.stage);
  s.l1 = tx(s.stage, {x: 140, y: 220, "font-size": 32, "font-weight": 700, fill: "#9d0208"}, "inside the small intestine"); s.l2 = tx(s.stage, {x: 140, y: 630, "font-size": 32, "font-weight": 700, fill: "#9d0208"}, "blood vessel 🩸");
  s.dots = []; seed = 9; for (let i = 0; i < 22; i++) s.dots.push({x: 160 + rnd() * 940, dl: rnd() * 1.6, e: el("circle", {r: 11, fill: "#ffd166", stroke: INK, "stroke-width": 3}, s.stage)});
  s.c1 = chip(s.stage, "digested food ➜ absorbed INTO THE BLOOD", "#d00000", {fs: 34});
  s.kid = emo(s.stage, 0, 0, 150, "🧒"); s.icons = ["🏃", "🧠", "🌱"].map(e => emo(s.stage, 0, 0, 100, e));
  s.run = t => { const a = w => C("absorb", w); const ab = t - a("absorbed"), fl = Math.max(0, t - a("carries"));
    s.dots.forEach(d => { const k = clamp((ab - d.dl) / 1.2); let x = d.x + fl * 160; x = 160 + ((x - 160) % 960 + 960) % 960;
      set(d.e, "cx", x); set(d.e, "cy", lerp(250 + Math.sin(t * 2 + d.x) * 20, 525 + Math.sin(d.x) * 25, k)); op(d.e, ramp(t, SC.absorb.t0, SC.absorb.t0 + .5)); });
    op(s.c1, ramp(t, a("blood"), a("blood") + .2)); popAt(s.c1, 640, 110, t, a("blood"));
    op(s.kid, ramp(t, a("energy"), a("energy") + .2)); set(s.kid, "x", 400); set(s.kid, "y", 760);
    [a("run"), a("think"), a("grow")].forEach((tt, i) => { op(s.icons[i], ramp(t, tt, tt + .2)); set(s.icons[i], "x", 620 + i * 190); set(s.icons[i], "y", 770 - 20 * pop(t, tt) + 20); }); }; return s; })();

// ---- LARGE INTESTINE
S.large = (() => { const s = scene("large", "#ffe8d6", "#ffd8be");

  const names = ["mouth", "gullet", "stomach", "small int.", "large int."];
  s.stops = names.map((n, i) => { const g = el("g", {}, s.stage); el("circle", {r: 70, fill: "#fff", stroke: INK, "stroke-width": 7}, g); tx(g, {x: 0, y: 22, "text-anchor": "middle", "font-size": 64, "font-weight": 700, fill: "#7209b7"}, String(i + 1));
    tx(g, {x: 0, y: 120, "text-anchor": "middle", "font-size": 32, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 7}, n); return g; });
  s.q = chip(s.stage, "🗣️ Say all 5 stops in order!", "#1b1b3a", {fs: 40});
  s.run = t => { const a = w => C("close", w); const tn = ramp(t, a("five") - .2, a("five") + .1);
    op(s.ans, ramp(t, a("small"), a("small") + .15) * (1 - tn)); tf(s.ans, `translate(760 420) scale(${pop(t, a("small"))})`);
    s.stops.forEach((g, i) => { const tt = a("five") + i * .3; op(g, ramp(t, tt, tt + .2)); tf(g, `translate(${280 + i * 240} 420) scale(${pop(t, tt)})`); });
    op(s.q, ramp(t, a("order") - .3, a("order"))); popAt(s.q, 760, 720, t, a("order") - .3); }; return s; })();

// ---- END CARD
S.end = (() => { const s = scene("end", "#3a0ca3", "#7209b7");
  tx(s.stage, {x: 960, y: 360, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: "#ffe14d", "letter-spacing": 6}, "NEXT EPISODE");
  tx(s.stage, {x: 960, y: 480, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "Is air nothing?");
  tx(s.stage, {x: 960, y: 580, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "The matter test 🎈");
  s.run = () => {}; return s; })();


/* ---------- confetti ---------- */
function burst() {}
const BURSTS = []; // precomputed so rendering is deterministic per frame
seed = 77; const conf = []; for (let i = 0; i < 70; i++) conf.push({vx: (rnd() - .5) * 1400, vy: -600 - rnd() * 700, rot: rnd() * 720, col: ["#ff5d73", "#ffbe0b", "#06d6a0", "#3a86ff", "#b5179e", "#fff"][i % 6], e: el("rect", {width: 18, height: 10, rx: 3, opacity: 0}, $("confetti"))});
conf.forEach(c => set(c.e, "fill", c.col));
function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

/* ---------- keyword box → shelf ---------- */
const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
