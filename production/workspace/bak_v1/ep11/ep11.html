<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="27" font-weight="700" fill="#fff" letter-spacing="1">🪨 P4 SCIENCE · EP 11</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 11: measuring volume — cylinder, eye level, displacement) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const WAT = "#4cc9f0";
// measuring cylinder: origin at bottom centre; 0..max mapped onto height h
function mcyl(p, h = 480, w = 110, max = 100, step = 10, labels = true) { const g = el("g", {}, p); const y = v => -h * v / max;
  const water = el("path", {fill: WAT, opacity: .85}, g);
  el("path", {d: `M${-w / 2} ${-h - 30} V0 H${w / 2} V${-h - 30} M${-w / 2} ${-h - 30} l-16 -10`, fill: "none", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round"}, g);
  el("rect", {x: -w / 2 - 30, y: 0, width: w + 60, height: 18, rx: 6, fill: "#adb5bd", stroke: INK, "stroke-width": 5}, g);
  for (let v = step; v <= max; v += step) { el("line", {x1: -w / 2, y1: y(v), x2: -w / 2 + (v % (step * 2) ? 18 : 30), y2: y(v), stroke: INK, "stroke-width": 3}, g);
    if (labels && v % (step * 2) === 0) tx(g, {x: -w / 2 - 12, y: y(v) + 8, "text-anchor": "end", "font-size": 24, "font-weight": 700, fill: INK}, String(v)); }
  g.level = v => { const yy = y(v), x0 = -w / 2 + 4, x1 = w / 2 - 4; set(water, "d", v <= 0 ? "" : `M${x0} 0 V${yy - 8} Q0 ${yy + 8} ${x1} ${yy - 8} V0 Z`); }; g.y = y; g.level(0); return g; }
function beaker(p, w = 150, h = 190) { const g = el("g", {}, p); const liq = el("rect", {x: -w / 2 + 6, width: w - 12, fill: WAT}, g);
  el("path", {d: `M${-w / 2} ${-h} V0 H${w / 2} V${-h} M${-w / 2} ${-h} l-14 -12`, fill: "none", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round"}, g);
  for (let i = 1; i < 5; i++) el("line", {x1: w / 2 - 30, y1: -i * h / 5, x2: w / 2 - 6, y2: -i * h / 5, stroke: INK, "stroke-width": 3}, g);
  g.fill = k => { set(liq, "y", -(h - 10) * k); set(liq, "height", Math.max(0, (h - 10) * k - 3)); }; g.fill(0); return g; }
function mcup(p) { const g = el("g", {}, p); el("path", {d: "M-80 -120 L-65 0 H65 L80 -120", fill: "#ffffffcc", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round"}, g); el("path", {d: "M78 -100 q50 10 40 50 q-8 30 -46 30", fill: "none", stroke: INK, "stroke-width": 8}, g);
  [1, 2, 3].forEach(i => el("line", {x1: -60, y1: -i * 28, x2: -36, y2: -i * 28, stroke: INK, "stroke-width": 3}, g)); return g; }
function rock(p, s = 1) { return el("path", {d: "M-40 -30 L-10 -46 L30 -36 L48 -6 L36 30 L0 42 L-36 30 L-50 4 Z", fill: "#8d99ae", stroke: INK, "stroke-width": 5, transform: `scale(${s})`}, p); }
function sumPanel(p, rows) { const g = el("g", {}, p); el("rect", {x: -270, y: -150, width: 540, height: 300, rx: 26, fill: "#fff", stroke: INK, "stroke-width": 6, filter: "url(#sh)"}, g);
  g.rows = rows.map(([lab, val, col], i) => { const r = el("g", {opacity: 0}, g); const y = -80 + i * 80 + (i === 2 ? 20 : 0);
    tx(r, {x: -230, y, "font-size": 36, "font-weight": 700, fill: col}, lab); tx(r, {x: 230, y, "text-anchor": "end", "font-size": 40, "font-weight": 700, fill: col}, val); return r; });
  g.line = el("line", {x1: -230, y1: 40, x2: 230, y2: 40, stroke: INK, "stroke-width": 5, opacity: 0}, g); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#90e0ef", "#caf0f8");
  s.rk = el("g", {}, s.stage); rock(s.rk, 3.2);
  s.ruler = el("g", {}, s.stage); el("rect", {x: -260, y: -30, width: 520, height: 60, rx: 6, fill: "#ffd166", stroke: INK, "stroke-width": 5}, s.ruler); for (let i = 0; i <= 20; i++) el("line", {x1: -240 + i * 24, y1: -30, x2: -240 + i * 24, y2: i % 5 ? -16 : -4, stroke: INK, "stroke-width": 3}, s.ruler);
  s.x = tx(s.stage, {x: 0, y: 0, "text-anchor": "middle", "font-size": 160, "font-weight": 700, fill: "#e63946", class: "out", "stroke-width": 10}, "✗");
  s.cyl = mcyl(s.stage); s.q = tx(s.stage, {x: 760, y: 180, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "Volume of a ROCK?");
  s.c = chip(s.stage, "💧 water finds it EXACTLY", "#3a86ff", {fs: 40});
  s.run = t => { const a = w => C("hook", w); const sw = ramp(t, a("water") - .3, a("water") + .3);
    op(s.q, ramp(t, a("bumpy") - .5, a("bumpy")) * (1 - sw)); tf(s.q, `translate(760 180) scale(${pop(t, a("bumpy") - .5)}) translate(-760 -180)`);
    op(s.rk, 1); tf(s.rk, `translate(${lerp(760, 1080, sw)} 500) rotate(${Math.sin(t * 2) * 4}) scale(${lerp(1, .6, sw)})`);
    const rl = on(t, a("ruler") - .2, a("water"), .2); op(s.ruler, rl); tf(s.ruler, `translate(760 ${330 + Math.sin(t * 6) * 6}) rotate(${Math.sin(t * 3) * 8})`);
    op(s.x, on(t, a("ruler") + .4, a("water"), .2)); set(s.x, "x", 1060); set(s.x, "y", 380);
    op(s.cyl, sw); tf(s.cyl, "translate(560 760)"); s.cyl.level(60 * ramp(t, a("water"), a("exactly")));
    op(s.c, ramp(t, a("exactly"), a("exactly") + .2)); popAt(s.c, 760, 160, t, a("exactly")); }; return s; })();

// ---- TOOLS
S.tools = (() => { const s = scene("tools", "#d8f3dc", "#b7e4c7");
  s.def = chip(s.stage, "VOLUME = the amount of space something takes up", "#7209b7", {fs: 34});
  s.cyl = mcyl(s.stage, 380, 90, 100, 10, false); s.bk = beaker(s.stage); s.cup = mcup(s.stage);
  s.l = [["measuring cylinder", "cylinder", 400], ["beaker", "beaker", 760], ["🏠 measuring cup", "cup", 1120]].map(([n, w, x]) => ({c: chip(s.stage, n, "#fff", {fs: 30, ink: INK}), w, x}));
  s.star = chip(s.stage, "⭐ MORE ACCURATE", "#06d6a0", {fs: 34}); s.zoom = el("g", {}, s.stage); el("circle", {r: 120, fill: "#fff", stroke: INK, "stroke-width": 7}, s.zoom);
  for (let i = 0; i < 9; i++) el("line", {x1: -60, y1: -96 + i * 24, x2: i % 2 ? -20 : 10, y2: -96 + i * 24, stroke: INK, "stroke-width": 4}, s.zoom); tx(s.zoom, {x: 40, y: 10, "font-size": 26, "font-weight": 700, fill: "#06d6a0"}, "close"); tx(s.zoom, {x: 40, y: 40, "font-size": 26, "font-weight": 700, fill: "#06d6a0"}, "marks");
  s.run = t => { const a = w => C("tools", w);
    op(s.def, ramp(t, a("volume"), a("volume") + .2)); popAt(s.def, 760, 160, t, a("volume"));
    op(s.cyl, ramp(t, a("cylinder"), a("cylinder") + .2)); tf(s.cyl, "translate(400 720)"); s.cyl.level(55);
    op(s.bk, ramp(t, a("beaker"), a("beaker") + .2)); tf(s.bk, "translate(760 720)"); s.bk.fill(.55);
    op(s.cup, ramp(t, a("cup"), a("cup") + .2)); tf(s.cup, "translate(1120 720)");
    s.l.forEach(l => { op(l.c, ramp(t, a(l.w), a(l.w) + .2)); popAt(l.c, l.x, 800, t, a(l.w)); });
    op(s.star, ramp(t, a("accurate"), a("accurate") + .2)); popAt(s.star, 400, 260, t, a("accurate"));
    op(s.zoom, ramp(t, a("markings"), a("markings") + .2)); tf(s.zoom, `translate(600 420) scale(${pop(t, a("markings"))})`); }; return s; })();

// ---- UNITS
S.units = (() => { const s = scene("units", "#ffd6a5", "#fdffb6");
  s.u1 = tx(s.stage, {x: 480, y: 330, "text-anchor": "middle", "font-size": 140, "font-weight": 700, fill: "#7209b7", class: "out", "stroke-width": 10}, "cm³"); s.n1 = chip(s.stage, "cubic centimetres", "#7209b7", {fs: 32});
  s.u2 = tx(s.stage, {x: 1040, y: 330, "text-anchor": "middle", "font-size": 140, "font-weight": 700, fill: "#f72585", class: "out", "stroke-width": 10}, "ml"); s.n2 = chip(s.stage, "millilitres", "#f72585", {fs: 32});
  s.cube = el("g", {}, s.stage); el("path", {d: "M0 -60 L52 -30 L0 0 L-52 -30 Z", fill: "#cdb4db", stroke: INK, "stroke-width": 4}, s.cube); el("path", {d: "M-52 -30 L0 0 L0 60 L-52 30 Z", fill: "#a06cd5", stroke: INK, "stroke-width": 4}, s.cube); el("path", {d: "M52 -30 L0 0 L0 60 L52 30 Z", fill: "#7b2cbf", stroke: INK, "stroke-width": 4}, s.cube);
  s.eq = chip(s.stage, "1 cm³ = 1 ml", "#ff9f1c", {fs: 64}); s.drop = emo(s.stage, 0, 0, 110, "💧");
  s.run = t => { const a = w => C("units", w);
    op(s.u1, ramp(t, a("cubic"), a("cubic") + .2)); tf(s.u1, `translate(480 330) scale(${pop(t, a("cubic"))}) translate(-480 -330)`); op(s.n1, ramp(t, a("cubic"), a("cubic") + .2)); popAt(s.n1, 480, 410, t, a("cubic"));
    op(s.u2, ramp(t, a("millilitres"), a("millilitres") + .2)); tf(s.u2, `translate(1040 330) scale(${pop(t, a("millilitres"))}) translate(-1040 -330)`); op(s.n2, ramp(t, a("millilitres"), a("millilitres") + .2)); popAt(s.n2, 1040, 410, t, a("millilitres"));
    op(s.cube, ramp(t, a("handy"), a("handy") + .2)); tf(s.cube, `translate(480 600) rotate(${Math.sin(t * 2) * 6})`); op(s.drop, ramp(t, a("handy"), a("handy") + .2)); set(s.drop, "x", 1040); set(s.drop, "y", 600);
    op(s.eq, ramp(t, a("same"), a("same") + .2)); popAt(s.eq, 760, 600, t, a("same")); }; return s; })();

// ---- READING THE CYLINDER
S.read = (() => { const s = scene("read", "#e0fbfc", "#c2dfe3");
  s.table = el("rect", {x: 200, y: 800, width: 760, height: 26, rx: 8, fill: "#bc6c25", stroke: INK, "stroke-width": 6}, s.stage);
  s.cyl = mcyl(s.stage, 520, 120); s.eye = emo(s.stage, 0, 0, 110, "👁️");
  s.sight = el("line", {stroke: "#e63946", "stroke-width": 5, "stroke-dasharray": "16 10"}, s.stage);
  s.zoom = el("g", {}, s.stage); el("circle", {r: 190, fill: "#fff", stroke: INK, "stroke-width": 8}, s.zoom);
  const zc = el("clipPath", {id: "zc11"}, $("v").querySelector("defs")); el("circle", {r: 184}, zc); const zg = el("g", {"clip-path": "url(#zc11)"}, s.zoom);
  el("path", {d: "M-150 -10 Q0 70 150 -10 V200 H-150 Z", fill: WAT, opacity: .85}, zg); el("line", {x1: -150, y1: -200, x2: -150, y2: 200, stroke: INK, "stroke-width": 10}, zg); el("line", {x1: 150, y1: -200, x2: 150, y2: 200, stroke: INK, "stroke-width": 10}, zg);

    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
