    const slow = ramp(t, a("stops"), a("stops") + .4);
    const tk = ((t * lerp(.35, .08, slow)) % 1); set(s.train, "x", lerp(-220, 230, tk)); set(s.train, "y", 20);

    s.players.forEach((p, i) => { if (i === 4) set(p.c, "fill", slow > .5 ? "#adb5bd" : "#ef476f"); });

  }; return s; })();

// ---- EXAM
S.exam = (() => { const s = scene("exam", "#14213d", "#1d3557");

// ---- HABIT
S.habit = (() => { const s = scene("habit", "#06d6a0", "#118ab2");
  s.gear = emo(s.stage, 760, 230, 160, "⚙️");
  s.eq = tx(s.stage, {x: 760, y: 380, "text-anchor": "middle", "font-size": 64, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "habit = tiny system");
  const block = (label, col, w) => { const g = el("g", {}, s.stage); el("rect", {x: -w / 2, y: -60, width: w, height: 120, rx: 18, fill: col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, g);
    for (let i = 0; i < 4; i++) el("rect", {x: -w / 2 + 40 + i * (w - 80) / 3 - 30, y: -86, width: 60, height: 30, rx: 8, fill: col, stroke: INK, "stroke-width": 6}, g);

    const d = ramp(t, a("onto"), a("onto") + .5); op(s.b2, ramp(t, a("onto") - .1, a("onto"))); tf(s.b2, `translate(760 ${lerp(150, 490, d)})`);

// ---- MIND MAP
S.mindmap = (() => { const s = scene("mindmap", "#fff3b0", "#ffd6a5");
  for (let i = 0; i < 16; i++) el("line", {x1: 0, y1: 120 + i * 60, x2: 1920, y2: 120 + i * 60, stroke: "#a2d2ff", "stroke-width": 2, opacity: .6}, s.stage);
  s.formula = el("g", {}, s.stage); el("rect", {x: -560, y: -50, width: 1120, height: 100, rx: 20, fill: "#fff", stroke: INK, "stroke-width": 5, filter: "url(#sh)"}, s.formula);
  tx(s.formula, {x: 0, y: 14, "text-anchor": "middle", "font-size": 40, "font-weight": 700, fill: INK}, "After I pack my bag ➜ I draw a 1-min mind map");
  s.center = el("g", {}, s.stage); el("ellipse", {rx: 170, ry: 80, fill: "#f72585", stroke: INK, "stroke-width": 7}, s.center); tx(s.center, {x: 0, y: 16, "text-anchor": "middle", "font-size": 52, "font-weight": 700, fill: "#fff"}, "SYSTEM");
  const br = [["bike", "🚲 BIKE", "#ff4d6d", 330, 310, ["pedals", "chain"]], ["body", "🧍 BODY", "#3a86ff", 330, 660, ["lungs", "heart"]], ["tree", "🌳 TREE", "#38b000", 1010, 690, ["roots", "leaves"]]];
  s.br = br.map(([k, n, col, x, y, subs]) => { const line = el("path", {d: `M720 480 Q${(720 + x) / 2} ${y} ${x} ${y}`, stroke: col, "stroke-width": 12, fill: "none", "stroke-linecap": "round"}, s.stage);
    const len = 700; set(line, "stroke-dasharray", len); const c = chip(s.stage, n, col, {fs: 38});
    const twigs = subs.map((sn, j) => chip(s.stage, sn, "#fff", {fs: 26, ink: INK})); return {k, line, len, c, x, y, twigs}; });
  s.stage.appendChild(s.center);
  s.timer = el("g", {}, s.stage); el("circle", {r: 66, fill: "#fff", stroke: INK, "stroke-width": 6}, s.timer); tx(s.timer, {x: 0, y: 16, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: INK}, "1:00"); emo(s.timer, 0, -96, 56, "⏱️");
  s.phone = el("g", {}, s.stage); el("rect", {x: -130, y: -240, width: 260, height: 480, rx: 40, fill: INK}, s.phone); el("rect", {x: -112, y: -205, width: 224, height: 410, rx: 20, fill: "#fff"}, s.phone);
  tx(s.phone, {x: 0, y: -168, "text-anchor": "middle", "font-size": 32, "font-weight": 700, fill: "#7209b7"}, "TheOneApp");
  tx(s.phone, {x: 0, y: -138, "text-anchor": "middle", "font-size": 17, "font-weight": 600, fill: "#6c757d"}, "the ultimate science app");
  s.ult = chip(s.stage, "🚀 TheOneApp · the ultimate science app", "#7209b7", {fs: 30});
  const cp = el("clipPath", {id: "scr"}, $("v").querySelector("defs")); el("rect", {x: -112, y: -122, width: 224, height: 327, rx: 4}, cp);
  s.shot = el("image", {href: "oneapp_mind.png", x: -112, y: -122, width: 224, height: 485, preserveAspectRatio: "xMidYMin slice", "clip-path": "url(#scr)"}, s.phone);
  s.thumbs = [s.shot];
  s.run = t => { const a = w => C("habit2", w); a("one") === undefined;
    op(s.formula, on(t, a("after") - .1, a("middle"), .2)); tf(s.formula, `translate(760 230) scale(${pop(t, a("after") - .1)})`);
    op(s.center, ramp(t, a("middle"), a("middle") + .2)); tf(s.center, `translate(720 480) scale(${pop(t, a("middle"))})`);
    s.br.forEach(b => { const k = a(b.k); set(b.line, "stroke-dashoffset", b.len * (1 - ramp(t, k - .1, k + .4))); op(b.line, t > k - .1 ? 1 : 0);
      op(b.c, ramp(t, k + .2, k + .4)); popAt(b.c, b.x, b.y, t, k + .2);
      b.twigs.forEach((tw, j) => { const tt = k + .7 + j * .25; op(tw, ramp(t, tt, tt + .2)); popAt(tw, b.x + (j ? 110 : -110), b.y + (b.y < 480 ? -80 : 80), t, tt); }); });
    op(s.timer, on(t, a("one"), a("save"), .2)); popAt(s.timer, 1180, 300, t, a("one"));
    const ph = ramp(t, a("save"), a("save") + .6); op(s.phone, ph); tf(s.phone, `translate(${lerp(1650, 1340, ph)} 520) rotate(${lerp(12, -4, ph)})`);
    op(s.ult, on(t, a("ultimate"), SC.mindmap.t1 + .5, .2)); popAt(s.ult, 760, 160, t, a("ultimate"));
    op(s.shot, ramp(t, a("theoneapp"), a("theoneapp") + .3)); set(s.shot, "y", -122 - 120 * ramp(t, a("ultimate") + .5, a("ultimate") + 3.5));
  }; return s; })();

// ---- CLOSE
S.close = (() => { const s = scene("close", "#f15bb5", "#fee440");
  s.bell = emo(s.stage, 0, 0, 220, "🔔");
  s.icons = [["🚲", "bike"], ["🧍", "body"], ["🌳", "tree"]].map(([e, w], i) => ({e: emo(s.stage, 0, 0, 130, e), w, x: 420 + i * 340}));
  s.sys = tx(s.stage, {x: 760, y: 420, "text-anchor": "middle", "font-size": 140, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 16}, "SYSTEMS ⚙");
  s.bubble = el("g", {}, s.stage); el("path", {d: "M-420 -90 H420 A40 40 0 0 1 460 -50 V50 A40 40 0 0 1 420 90 H-260 L-330 150 L-320 90 H-420 A40 40 0 0 1 -460 50 V-50 A40 40 0 0 1 -420 -90 Z", fill: "#fff", stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, s.bubble);
  tx(s.bubble, {x: 0, y: 16, "text-anchor": "middle", "font-size": 46, "font-weight": 700, fill: INK}, "💬 One system YOU used today?");
  s.run = t => { const a = w => C("close", w);
    op(s.bell, on(t, a("bell"), a("bike"), .2)); tf(s.bell, `translate(760 400) rotate(${Math.sin(t * 25) * 18 * on(t, a("bell"), a("bell") + 1.2, .1)}) scale(${pop(t, a("bell"))})`);

    s.icons.forEach(ic => { const k = a(ic.w); op(ic.e, ramp(t, k, k + .2) * (1 - merge)); set(ic.e, "x", lerp(ic.x, 760, merge)); set(ic.e, "y", 420); tf(ic.e, `scale(1)`); });
    op(s.sys, on(t, a("systems"), a("turn"), .2)); tf(s.sys, `translate(760 420) scale(${pop(t, a("systems"), .5)}) translate(-760 -420)`);
    op(s.bubble, ramp(t, a("comments") - .3, a("comments"))); tf(s.bubble, `translate(760 470) scale(${pop(t, a("comments") - .3)})`);
    if (Math.abs(t - a("bell")) < .02 || Math.abs(t - a("systems")) < .02) burst(t);
  }; return s; })();

// ---- END CARD
S.end = (() => { const s = scene("end", "#3a0ca3", "#7209b7");
  tx(s.stage, {x: 960, y: 360, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: "#ffe14d", "letter-spacing": 6}, "NEXT EPISODE");
  tx(s.stage, {x: 960, y: 480, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "The 3-part team");
  tx(s.stage, {x: 960, y: 580, "text-anchor": "middle", "font-size": 84, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 10}, "inside every plant 🌱");
  s.run = () => {}; return s; })();

/* ---------- confetti ---------- */
function burst() {}
const BURSTS = []; // precomputed so rendering is deterministic per frame
seed = 77; const conf = []; for (let i = 0; i < 70; i++) conf.push({vx: (rnd() - .5) * 1400, vy: -600 - rnd() * 700, rot: rnd() * 720, col: ["#ff5d73", "#ffbe0b", "#06d6a0", "#3a86ff", "#b5179e", "#fff"][i % 6], e: el("rect", {width: 18, height: 10, rx: 3, opacity: 0}, $("confetti"))});
conf.forEach(c => set(c.e, "fill", c.col));
function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

/* ---------- keyword box → shelf ---------- */
const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
