<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}

  .emo{font-family:"Noto Color Emoji",sans-serif}
  .out{paint-order:stroke;stroke:#1b1b3a;stroke-linejoin:round}
</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="27" font-weight="700" fill="#fff" letter-spacing="1">➡️ P4 SCIENCE · EP 20</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 20: cold doesn't flow — heat flow, equal temperature, sources) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const HOT = "#e63946", COLD = "#3a86ff", HEATC = "#ff7b00";
const tcol = v => mix(COLD, HOT, clamp((v - 5) / 60));
function readout(p) { const g = el("g", {}, p); el("rect", {x: -90, y: -36, width: 180, height: 72, rx: 18, fill: "#fff", stroke: INK, "stroke-width": 5}, g); g.t = tx(g, {x: 0, y: 16, "text-anchor": "middle", "font-size": 42, "font-weight": 700}, ""); g.v = v => { g.t.textContent = Math.round(v) + " °C"; set(g.t, "fill", tcol(v)); }; return g; }
function flames(p) { const g = el("g", {}, p); const d = []; for (let i = 0; i < 6; i++) { const e = el("text", {"text-anchor": "middle", "font-size": 44}, g); e.textContent = "🔥"; d.push(e); }
  g.run = (x1, y1, x2, y2, t, k) => d.forEach((e, i) => { const q = ((t * .6 + i / 6) % 1); set(e, "x", lerp(x1, x2, q)); set(e, "y", lerp(y1, y2, q)); op(e, k * Math.sin(q * Math.PI)); }); return g; }
function bigArrow(p, col) { const g = el("g", {}, p); el("path", {d: "M-160 -30 H80 V-70 L170 0 L80 70 V30 H-160 Z", fill: col, stroke: INK, "stroke-width": 6}, g); return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#caf0f8", "#90e0ef");
  s.hand = emo(s.stage, 0, 0, 200, "✋"); s.ice = emo(s.stage, 0, 0, 170, "🧊");
  s.cold = tx(s.stage, {x: 0, y: 0, "text-anchor": "middle", "font-size": 64, "font-weight": 700, fill: COLD, class: "out", "stroke-width": 8}, "❄️ cold ➜");
  s.x = tx(s.stage, {x: 0, y: 0, "text-anchor": "middle", "font-size": 180, "font-weight": 700, fill: HOT, class: "out", "stroke-width": 10}, "✗");
  s.t = tx(s.stage, {x: 760, y: 180, "text-anchor": "middle", "font-size": 90, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 12}, "COLD doesn't flow!");
  s.run = t => { const a = w => C("hook", w);
    op(s.hand, 1); set(s.hand, "x", 1040); set(s.hand, "y", 520); op(s.ice, ramp(t, a("ice") - .3, a("ice"))); set(s.ice, "x", 480); set(s.ice, "y", 520);
    const k = ((t - .4) * .5) % 1; op(s.cold, on(t, a("cold") - .2, a("move") + .4, .2)); set(s.cold, "x", lerp(600, 880, k)); set(s.cold, "y", 400);
    op(s.x, ramp(t, a("not"), a("not") + .2)); set(s.x, "x", 760); set(s.x, "y", 480);
    op(s.t, ramp(t, a("cold") - .2, a("cold"))); tf(s.t, `translate(760 180) scale(${pop(t, a("cold") - .2) * .9}) translate(-760 -180)`); }; return s; })();

// ---- THE RULE (hand + ice)
S.rule = (() => { const s = scene("rule", "#ffd6a5", "#caf0f8");
  s.r = el("g", {}, s.stage); el("rect", {x: -620, y: -90, width: 1240, height: 180, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 7}, s.r);
  tx(s.r, {x: 0, y: -18, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: HEATC}, "🔥 Heat ALWAYS flows from"); tx(s.r, {x: 0, y: 46, "text-anchor": "middle", "font-size": 44, "font-weight": 700, fill: INK}, "HIGHER temperature ➜ LOWER temperature");
  s.hand = emo(s.stage, 0, 0, 180, "✋"); s.ice = emo(s.stage, 0, 0, 150, "🧊"); s.fl = flames(s.stage); s.pud = el("ellipse", {rx: 0, ry: 0, fill: "#90e0ef", opacity: .8}, s.stage);
  s.l1 = chip(s.stage, "hand LOSES heat ➜ feels COLD", COLD, {fs: 32}); s.l2 = chip(s.stage, "ice GAINS heat ➜ MELTS", HOT, {fs: 32});
  s.run = t => { const a = w => C("rule", w); const melt = ramp(t, a("melts") - .3, a("melts") + 1);
    op(s.r, ramp(t, a("rule") - .2, a("rule"))); tf(s.r, `translate(760 200) scale(${pop(t, a("rule") - .2) * .95})`);
    op(s.hand, ramp(t, a("hold") - .3, a("hold"))); set(s.hand, "x", 1050); set(s.hand, "y", 560); op(s.ice, ramp(t, a("hold") - .3, a("hold"))); set(s.ice, "x", 470); set(s.ice, "y", 560 + melt * 20); tf(s.ice, `scale(${1 - melt * .3})`); s.ice.setAttribute("transform-origin", "470 600");
    set(s.pud, "cx", 470); set(s.pud, "cy", 640); set(s.pud, "rx", 110 * melt); set(s.pud, "ry", 20 * melt);
    s.fl.run(960, 560, 560, 560, t, on(t, a("out"), SC.rule.t1 + .3, .3));
    op(s.l1, ramp(t, a("loses"), a("loses") + .2)); popAt(s.l1, 1050, 760, t, a("loses")); op(s.l2, ramp(t, a("gains"), a("gains") + .2)); popAt(s.l2, 470, 760, t, a("gains")); }; return s; })();

// ---- THE FRIDGE DOOR
S.door = (() => { const s = scene("door", "#e0fbfc", "#c2dfe3");
  s.fr = el("g", {}, s.stage); el("rect", {x: -170, y: -300, width: 340, height: 600, rx: 26, fill: "#dee2e6", stroke: INK, "stroke-width": 8}, s.fr); el("rect", {x: -150, y: -280, width: 300, height: 560, rx: 12, fill: "#caf0f8"}, s.fr);
  emo(s.fr, 0, -150, 90, "🥛"); emo(s.fr, 0, 30, 90, "🍉"); emo(s.fr, 0, 180, 90, "🥚");
  s.door = el("rect", {x: 0, y: -300, width: 340, height: 600, rx: 26, fill: "#f8f9fa", stroke: INK, "stroke-width": 8}, s.stage);
  s.bub = el("g", {}, s.stage); el("rect", {x: -380, y: -70, width: 760, height: 140, rx: 40, fill: "#fff", stroke: INK, "stroke-width": 6}, s.bub); tx(s.bub, {x: 0, y: 14, "text-anchor": "middle", "font-size": 36, "font-weight": 700, fill: INK}, "\"Close the door! You're letting the cold out!\"");
  s.x = tx(s.stage, {x: 1340, y: 230, "text-anchor": "middle", "font-size": 120, "font-weight": 700, fill: HOT, class: "out", "stroke-width": 8}, "✗");
  s.fl = flames(s.stage); s.c = chip(s.stage, "✓ HEAT flows from the warm air INTO the fridge", HEATC, {fs: 34});
  s.run = t => { const a = w => C("door", w); const open = ramp(t, SC.door.t0, SC.door.t0 + .6);
    tf(s.fr, "translate(500 560)"); op(s.fr, 1); set(s.door, "x", 330); set(s.door, "y", 260); set(s.door, "width", 340 * (1 - open * .85)); op(s.door, 1);
    op(s.bub, ramp(t, a("close") - .3, a("close"))); tf(s.bub, `translate(1000 240) scale(${pop(t, a("close") - .3) * .85})`);
    op(s.x, ramp(t, a("backwards"), a("backwards") + .2)); s.fl.run(1200, 560, 560, 560, t, ramp(t, a("heat"), a("heat") + .3));
    op(s.c, ramp(t, a("heat"), a("heat") + .2)); popAt(s.c, 1000, 880, t, a("heat")); }; return s; })();

// ---- THREE EXAMPLES
S.examples = (() => { const s = scene("examples", "#fff3b0", "#ffd166");
  const xs = [330, 760, 1190];
  s.p = [["🍳", "🔥", "flame ➜ pot + water", "stove"], ["☕", "🥄", "coffee ➜ spoon", "spoon"], ["🍵", "💨", "tea ➜ the air around it", "tea"]].map(([e1, e2, lab, w], i) => { const g = el("g", {}, s.stage);
    el("rect", {x: -200, y: -230, width: 400, height: 460, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 6}, g); emo(g, -50, -60, 140, e1); emo(g, 70, 30, 100, e2);
    const ar = bigArrow(g, HEATC); tf(ar, "translate(0 130) scale(.6)"); tx(g, {x: 0, y: 200, "text-anchor": "middle", "font-size": 28, "font-weight": 700, fill: INK}, lab); return {g, ar, w, i}; });
  s.run = t => { const a = w => C("examples", w);
    s.p.forEach(p => { const tt = a(p.w) - .4; op(p.g, ramp(t, tt, tt + .2)); tf(p.g, `translate(${xs[p.i]} 520) scale(${pop(t, tt)})`); op(p.ar, .6 + .4 * Math.sin(t * 5)); }); }; return s; })();

// ---- WHEN DOES IT STOP (cup in box)
S.stop = (() => { const s = scene("stop", "#bde0fe", "#a2d2ff");
  s.box = el("g", {}, s.stage); s.bw = el("rect", {x: -330, y: -170, width: 660, height: 300, fill: COLD, opacity: .55}, s.box); el("path", {d: "M-350 -230 V150 H350 V-230", fill: "none", stroke: INK, "stroke-width": 8}, s.box);
  s.cup = el("g", {}, s.stage); s.cw = el("rect", {x: -110, y: -150, width: 220, height: 200, fill: HOT, opacity: .7}, s.cup); el("path", {d: "M-120 -200 V60 H120 V-200", fill: "none", stroke: "#495057", "stroke-width": 10}, s.cup);
  s.r1 = readout(s.stage); s.r2 = readout(s.stage); s.fl = flames(s.stage);
  s.eq = chip(s.stage, "SAME temperature ➜ heat flow STOPS ⏹", "#06d6a0", {fs: 40});
  s.run = t => { const a = w => C("stop", w); const k = ramp(t, a("hot") - .2, a("thirtyfive") + .2);
    tf(s.box, "translate(760 600)"); op(s.box, 1); tf(s.cup, "translate(760 600)"); op(s.cup, ramp(t, a("cup") - .3, a("cup")));
    const v1 = lerp(50, 35, k), v2 = lerp(20, 35, k); set(s.cw, "fill", tcol(v1)); set(s.bw, "fill", tcol(v2));
    op(s.r1, ramp(t, a("fifty") - .2, a("fifty"))); tf(s.r1, "translate(760 270)"); s.r1.v(v1); op(s.r2, ramp(t, a("twenty") - .2, a("twenty"))); tf(s.r2, "translate(1240 480)"); s.r2.v(v2);
    s.fl.run(860, 560, 1050, 620, t, on(t, a("flows"), a("same") - .2, .3)); op(s.eq, ramp(t, a("same"), a("same") + .2)); popAt(s.eq, 760, 150, t, a("same")); }; return s; })();

// ---- LINE GRAPH
S.graph = (() => { const s = scene("graph", "#fff3b0", "#ffd6a5");
  const X0 = 400, Y0 = 820, W = 760, H = 540; const yv = v => Y0 - H * (v - 10) / 50, xv = m => X0 + W * m / 30;
  s.ax = el("path", {d: `M${X0} ${Y0 - H - 20} V${Y0} H${X0 + W + 20}`, fill: "none", stroke: INK, "stroke-width": 7}, s.stage);
  s.ty = tx(s.stage, {x: X0 - 20, y: Y0 - H - 30, "text-anchor": "end", "font-size": 30, "font-weight": 700, fill: "#7209b7"}, "temperature (°C) ⬆"); s.tx2 = tx(s.stage, {x: X0 + W, y: Y0 + 60, "text-anchor": "end", "font-size": 30, "font-weight": 700, fill: "#6c757d"}, "time (min) ➜");
  [10, 20, 35, 50].forEach(v => tx(s.stage, {x: X0 - 14, y: yv(v) + 10, "text-anchor": "end", "font-size": 26, "font-weight": 700, fill: INK}, v));
  const d1 = [], d2 = []; for (let m = 0; m <= 30; m += 2.5) { const f = m < 15 ? 1 - Math.exp(-m / 4) : 1; const ff = Math.min(1, f / (1 - Math.exp(-15 / 4))); d1.push([m, 50 - 15 * ff]); d2.push([m, 20 + 15 * ff]); }
  s.l1 = el("polyline", {fill: "none", stroke: HOT, "stroke-width": 7}, s.stage); s.l2 = el("polyline", {fill: "none", stroke: COLD, "stroke-width": 7}, s.stage);
  s.dots = [...d1.map(p => [p, HOT]), ...d2.map(p => [p, COLD])].map(([p, c]) => ({p, e: el("circle", {cx: xv(p[0]), cy: yv(p[1]), r: 9, fill: c, stroke: INK, "stroke-width": 3}, s.stage)}));

/* ---------- confetti ---------- */
function burst() {}
const BURSTS = []; // precomputed so rendering is deterministic per frame
seed = 77; const conf = []; for (let i = 0; i < 70; i++) conf.push({vx: (rnd() - .5) * 1400, vy: -600 - rnd() * 700, rot: rnd() * 720, col: ["#ff5d73", "#ffbe0b", "#06d6a0", "#3a86ff", "#b5179e", "#fff"][i % 6], e: el("rect", {width: 18, height: 10, rx: 3, opacity: 0}, $("confetti"))});
conf.forEach(c => set(c.e, "fill", c.col));
function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

/* ---------- keyword box → shelf ---------- */
const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
document.fonts.ready.then(() => { window.READY = true; });
