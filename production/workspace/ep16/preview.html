<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const set = (e, k, v) => e.setAttribute(k, v);

let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {

  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 16: shadow size — two distances + ray model) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const RAY = "#ffbe0b", CY = 480;
// torch → ball → screen diagram
function tbs(p, r = 60, sh = 520) { const g = el("g", {}, p);
  const beam = el("path", {fill: "#fff3b0", opacity: .45}, g); const scr = el("rect", {width: 34, height: sh, y: CY - sh / 2, fill: "#e9ecef", stroke: INK, "stroke-width": 6}, g);
  const shd = el("rect", {width: 34, fill: "#1b1b3a"}, g); const r1 = el("line", {stroke: RAY, "stroke-width": 5, "stroke-dasharray": "14 8"}, g), r2 = el("line", {stroke: RAY, "stroke-width": 5, "stroke-dasharray": "14 8"}, g);
  const torch = emo(g, 0, 0, 110, "🔦"); const ball = el("circle", {r, fill: "#ef476f", stroke: INK, "stroke-width": 6}, g);
  g.upd = (T, B, Sx, rr = r, k = 1) => { set(ball, "r", rr); set(ball, "cx", B); set(ball, "cy", CY); set(torch, "x", T - 40); set(torch, "y", CY); tf(torch, `rotate(135 ${T - 40} ${CY})`);
    const h = rr * (Sx - T) / (B - T); set(scr, "x", Sx); set(shd, "x", Sx); set(shd, "y", CY - h); set(shd, "height", 2 * h); op(shd, k * .9);
    set(beam, "d", `M${T} ${CY} L${Sx} ${CY - sh / 2} L${Sx} ${CY + sh / 2} Z`); op(beam, .45 * k);
    [[r1, -1], [r2, 1]].forEach(([l, sd]) => { set(l, "x1", T); set(l, "y1", CY); set(l, "x2", Sx); set(l, "y2", CY + sd * h); op(l, k); }); return h; };
  return g; }
function bracket(p, col) { const g = el("g", {}, p); const l = el("path", {fill: "none", stroke: col, "stroke-width": 7}, g); g.set = (x, y1, y2) => set(l, "d", `M${x} ${y1} h20 V${y2} h-20`); return g; }
function dist(p, col) { const g = el("g", {}, p); const l = el("line", {stroke: col, "stroke-width": 6, "marker-end": ""}, g); const t = tx(g, {"text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: col}, ""); g.set = (x1, x2, y, s) => { set(l, "x1", x1); set(l, "x2", x2); set(l, "y1", y); set(l, "y2", y); set(t, "x", (x1 + x2) / 2); set(t, "y", y - 14); t.textContent = s; }; return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#3a0ca3", "#7209b7");
  s.wall = el("rect", {x: 1000, y: 140, width: 40, height: 760, fill: "#e9ecef", stroke: INK, "stroke-width": 6}, s.stage);
  s.big = tx(s.stage, {x: 760, y: 300, "text-anchor": "middle", "font-size": 130, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 14}, "GIANT 🦖"); s.tiny = tx(s.stage, {x: 760, y: 560, "text-anchor": "middle", "font-size": 60, "font-weight": 700, fill: "#ffe14d", class: "out", "stroke-width": 8}, "…or tiny 🐜");
  s.it = [["🔦", "torch"], ["⚽", "ball"], ["🧱", "wall"]].map(([e, w], i) => ({e: emo(s.stage, 0, 0, 120, e), w, i}));
  s.run = t => { const a = w => C("hook", w); const shrink = ramp(t, a("torch") - .4, a("torch"));
    op(s.big, ramp(t, a("giant"), a("giant") + .2)); tf(s.big, `translate(760 300) scale(${pop(t, a("giant")) * lerp(1, .6, shrink)}) translate(-760 -300)`);
    op(s.tiny, ramp(t, a("tiny"), a("tiny") + .2) * (1 - shrink)); op(s.wall, 0);
    s.it.forEach(i => { op(i.e, ramp(t, a(i.w), a(i.w) + .2)); set(i.e, "x", 480 + i.i * 280); set(i.e, "y", 620 + 20 * (1 - pop(t, a(i.w)))); if (i.i === 0) tf(i.e, `rotate(135 480 ${620 + 20 * (1 - pop(t, a(i.w)))})`); }); }; return s; })();

// ---- SETUP
S.setup = (() => { const s = scene("setup", "#1d3557", "#14213d");
  s.d = tbs(s.stage, 60, 440); s.lt = chip(s.stage, "torch", "#fff", {fs: 30, ink: INK}); s.lb = chip(s.stage, "ball", "#fff", {fs: 30, ink: INK}); s.ls = chip(s.stage, "screen", "#fff", {fs: 30, ink: INK});
  s.c = chip(s.stage, "SCREEN = the surface where the shadow falls", "#6c757d", {fs: 34});
  s.d1 = dist(s.stage, "#f77f00"); s.d2 = dist(s.stage, "#4cc9f0");
  s.run = t => { const a = w => C("setup", w); op(s.d, ramp(t, a("torch") - .3, a("torch"))); s.d.upd(300, 760, 1250, 60, ramp(t, a("screen"), a("screen") + .5));
    op(s.lt, ramp(t, a("torch"), a("torch") + .2)); popAt(s.lt, 260, 605, t, a("torch")); op(s.lb, ramp(t, a("ball"), a("ball") + .2)); popAt(s.lb, 760, 580, t, a("ball")); op(s.ls, ramp(t, a("screen"), a("screen") + .2)); popAt(s.ls, 1267, 215, t, a("screen"));
    op(s.c, ramp(t, a("surface"), a("surface") + .2)); popAt(s.c, 760, 130, t, a("surface"));

    op(s.d, 1); s.d.upd(T, 760, 1250); op(s.t, 1); popAt(s.t, 820, 125, t, SC.rule1.t0);
    op(s.c1, on(t, a("bigger"), a("further"), .2)); popAt(s.c1, 680, 200, t, a("bigger")); op(s.c2, ramp(t, a("smaller"), a("smaller") + .2)); popAt(s.c2, 680, 200, t, a("smaller")); }; return s; })();

// ---- RULE 2 (move the screen)

    tf(s.board, `translate(960 ${520 + Math.sin(t * 1.5) * 6}) scale(${b * bump})`); op(s.board, b > 0 ? 1 : 0);

      tf(r.g, `translate(${-60 * (1 - Math.min(1, k))} 0)`); op(r.g, clamp(k)); });
  };
  seed = sv; return s; })();

/* ---------- confetti ---------- */
function burst() {}
const BURSTS = []; // precomputed so rendering is deterministic per frame
seed = 77; const conf = []; for (let i = 0; i < 70; i++) conf.push({vx: (rnd() - .5) * 1400, vy: -600 - rnd() * 700, rot: rnd() * 720, col: ["#ff5d73", "#ffbe0b", "#06d6a0", "#3a86ff", "#b5179e", "#fff"][i % 6], e: el("rect", {width: 18, height: 10, rx: 3, opacity: 0}, $("confetti"))});
conf.forEach(c => set(c.e, "fill", c.col));
function drawConfetti(t) { const b = TL.bursts.filter(x => t >= x && t < x + 1.6).pop();
  conf.forEach(c => { if (b === undefined) { op(c.e, 0); return; } const k = t - b; const x = 760 + c.vx * k * .5, y = 450 + c.vy * k + 900 * k * k;
    tf(c.e, `translate(${x} ${y}) rotate(${c.rot * k})`); op(c.e, 1 - k / 1.6); }); }

/* ---------- keyword box → shelf ---------- */
const KW = TL.kws.map((k, i) => { const g = el("g", {opacity: 0}, $("kwFly"));
  const fs = 54, w = k.label.length * fs * .56 + 70;
  const big = el("g", {}, g); el("rect", {x: -w / 2, y: -50, width: w, height: 100, rx: 50, fill: k.col, stroke: INK, "stroke-width": 7, filter: "url(#sh)"}, big);
  tx(big, {x: 0, y: 19, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 6}, "⭐ " + k.label);
  const sfs = 25, sw = k.short.length * sfs * .58 + 40;
  const small = el("g", {opacity: 0}, g); el("rect", {x: -sw / 2, y: -22, width: sw, height: 44, rx: 22, fill: k.col, stroke: INK, "stroke-width": 4}, small);
  tx(small, {x: 0, y: 9, "text-anchor": "middle", "font-size": sfs, "font-weight": 700, fill: "#fff"}, k.short);
  return {k, g, big, small, sw, i}; });
function drawKW(t) {
  op($("shelfHead"), ramp(t, KW[0].k.t + 1.8, KW[0].k.t + 2.2));
  KW.forEach(K => { const t0 = K.k.t, tf0 = t0 + 1.9, tfly = .6;
    const sx = 1880 - K.sw / 2, sy = 104 + K.i * 56;
    if (t < t0 - .05) { op(K.g, 0); return; }
    op(K.g, 1);
    const fly = ramp(t, tf0, tf0 + tfly);
    const x = lerp(960, sx, fly), y = lerp(860, sy, fly) - Math.sin(fly * Math.PI) * 120;
    const scl = Math.max(0, pop(t, t0, .5));
    tf(K.g, `translate(${x} ${y})`);
    tf(K.big, `scale(${scl * lerp(1, .46, fly) * (1 + .04 * Math.sin(t * 8) * (1 - fly))})`); op(K.big, 1 - ramp(t, tf0 + tfly * .6, tf0 + tfly));
    op(K.small, ramp(t, tf0 + tfly * .5, tf0 + tfly)); tf(K.small, `scale(${1 + .15 * on(t, tf0 + tfly, tf0 + tfly + .35, .15)})`);
  });
}

/* ---------- captions ---------- */
const CAPS = TL.caps.map(c => { const g = el("g", {opacity: 0}, $("caps"));
  const len = c.w.reduce((n, w) => n + w.t.length + 1, 0), w = len * 46 * .52 + 60;
  el("rect", {x: 960 - w / 2, y: 975, width: w, height: 70, rx: 35, fill: "#1b1b3a", "fill-opacity": .78}, g);
  const t = el("text", {x: 960, y: 1023, "text-anchor": "middle", "font-size": 46, "font-weight": 600}, g);
  const spans = c.w.map((w, i) => { const s = el("tspan", {fill: "#fff"}, t); s.textContent = (i ? " " : "") + w.t; return s; });
  return {c, g, spans}; });
function drawCaps(t) { CAPS.forEach(({c, g, spans}) => { const a = ramp(t, c.t0, c.t0 + .08) * (1 - ramp(t, c.t1 - .08, c.t1)); op(g, a);
  if (a > 0) c.w.forEach((w, i) => set(spans[i], "fill", t >= w.a - .04 && (i === c.w.length - 1 || t < c.w[i + 1].a - .04) ? "#ffe14d" : "#fff")); }); }

/* ---------- render ---------- */
const order = TL.scenes.map(s => s.scene);
window.render = function (t) {
  order.concat(["end"]).forEach((name, i) => {
    const s = S[name]; const t0 = name === "end" ? TL.END - 4.0 : SC[name].t0 - (i ? .4 : 0);
    const nxt = i + 1 < order.length ? SC[order[i + 1]].t0 - .4 : (name === "end" ? 1e9 : TL.END - 4.0);
    const v = ramp(t, t0 - .2, t0 + .2) * (1 - ramp(t, nxt - .2, nxt + .2));
    op(s.g, v); if (v <= 0) return;
    tf(s.g, `translate(960 540) scale(${1 + .06 * (1 - ramp(t, t0 - .2, t0 + .3))}) translate(-960 -540)`);
    moveBubbles(s.b, t); s.run(t);
  });
  drawConfetti(t); drawKW(t); drawCaps(t);
  set($("prog"), "width", 1920 * clamp(t / TL.END));
  op($("tag"), ramp(t, .2, .6) * (1 - ramp(t, TL.END - 4.2, TL.END - 3.8)));
  op($("fade"), Math.max(1 - ramp(t, 0, .35), ramp(t, TL.END - .5, TL.END)));
};
function fitPill(g, pad) { const r = g.querySelector("rect"), t = g.querySelector("text"); if (!r || !t) return 0;
  const need = t.getBBox().width + pad, w = +r.getAttribute("width");
  if (need > w) { const cx = +r.getAttribute("x") + w / 2; set(r, "width", need); set(r, "x", cx - need / 2); } return Math.max(need, w); }
function shrinkText(g, fs) { const r = g.querySelector("rect"), t = g.querySelector("text"); const w = +r.getAttribute("width") - fs * 1.1, bw = t.getBBox().width;
  if (bw > w) set(t, "font-size", fs * w / bw); }
document.fonts.ready.then(() => {
  CHIPS.forEach(([g, fs, fixed]) => fixed ? shrinkText(g, fs) : fitPill(g, fs * 1.3));
  KW.forEach(K => { fitPill(K.big, 70); K.sw = fitPill(K.small, 36); });
  CAPS.forEach(({g}) => fitPill(g, 64));
  window.READY = true; });
</script>
</body></html>
