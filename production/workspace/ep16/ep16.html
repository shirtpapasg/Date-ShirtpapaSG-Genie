<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Fredoka;font-weight:500;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:600;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2) format("woff2")}
  @font-face{font-family:Fredoka;font-weight:700;src:url(fonts/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2) format("woff2")}
  html,body{margin:0;padding:0;background:#000;width:1920px;height:1080px;overflow:hidden}
  svg{display:block}
  text{font-family:Fredoka,Inter,sans-serif;font-weight:600}
  .emo{font-family:"Noto Color Emoji",sans-serif}
  .out{paint-order:stroke;stroke:#1b1b3a;stroke-linejoin:round}
</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#1b1b3a" flood-opacity=".35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="rainbow" x1="0" x2="1"><stop offset="0" stop-color="#ff5d73"/><stop offset=".25" stop-color="#ffbe0b"/><stop offset=".5" stop-color="#06d6a0"/><stop offset=".75" stop-color="#3a86ff"/><stop offset="1" stop-color="#b5179e"/></linearGradient>
  </defs>
  <g id="scenes"></g>
  <g id="confetti"></g>
  <!-- overlays -->
  <g id="tag" filter="url(#sh)">
    <rect x="40" y="34" width="430" height="58" rx="29" fill="#1b1b3a"/>
    <text x="70" y="73" font-size="25" font-weight="700" fill="#fff" letter-spacing="0">🔦 TheOneApp, Explained - Shadow Size</text>
  </g>
  <g id="shelf"><text id="shelfHead" x="1515" y="58" font-size="22" font-weight="700" fill="#fff" class="out" stroke-width="6" letter-spacing="3" opacity="0">⭐ KEY WORDS</text></g>
  <g id="kwFly"></g>
  <g id="caps"></g>
  <rect x="0" y="1072" width="1920" height="8" fill="#1b1b3a" opacity=".35"/>
  <rect id="prog" x="0" y="1072" width="0" height="8" fill="url(#rainbow)"/>
  <rect id="fade" width="1920" height="1080" fill="#000" opacity="1"/>
</svg>
<script>window.TL = __TL__;</script>
<script>
const NS = "http://www.w3.org/2000/svg";
const CHIPS = [];
const $ = id => document.getElementById(id);
const el = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const tx = (p, a, s) => { const t = el("text", a, p); t.textContent = s; return t; };
const emo = (p, x, y, size, s) => tx(p, {x, y, "font-size": size, class: "emo", "text-anchor": "middle", "dominant-baseline": "central"}, s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const pop = (t, a, d = .45) => back((t - a) / d);
const on = (t, a, b = 1e9, f = .25) => ramp(t, a, a + f) * (1 - ramp(t, b - f, b));
const set = (e, k, v) => e.setAttribute(k, v);
const op = (e, v) => e.setAttribute("opacity", clamp(v));
const tf = (e, s) => e.setAttribute("transform", s);
const popAt = (e, x, y, t, a, extra = "") => tf(e, `translate(${x} ${y}) scale(${Math.max(0, pop(t, a))}) ${extra}`);
let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = "#1b1b3a";
const C = (seg, w) => { const v = TL.cues[seg] && TL.cues[seg][w]; if (v === undefined) throw new Error("cue " + seg + ":" + w); return v; };
const SC = {}; TL.scenes.forEach(s => SC[s.scene] = s);

/* ---------- reusable widgets ---------- */
function chip(p, label, col, opts = {}) {
  const g = el("g", {opacity: 0}, p);
  const fs = opts.fs || 30, w = opts.w || (label.length * fs * .56 + 44), h = fs + 26;
  el("rect", {x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: col, stroke: INK, "stroke-width": 4, filter: "url(#sh)"}, g);
  tx(g, {x: 0, y: fs * .36, "text-anchor": "middle", "font-size": fs, "font-weight": 700, fill: opts.ink || "#fff"}, label);
  CHIPS.push([g, fs, !!opts.w]);
  return g;
}
function bg(p, c1, c2) {
  const id = "g" + Math.round(rnd() * 1e9) + "_" + (bg.n = (bg.n || 0) + 1);
  const lg = el("linearGradient", {id, x1: 0, y1: 0, x2: .3, y2: 1}, $("v").querySelector("defs"));
  el("stop", {offset: 0, "stop-color": c1}, lg); el("stop", {offset: 1, "stop-color": c2}, lg);
  el("rect", {width: 1920, height: 1080, fill: `url(#${id})`}, p);
  // floating bubbles for liveliness
  const bubbles = [];
  for (let i = 0; i < 14; i++) bubbles.push({x: rnd() * 1920, y: rnd() * 1080, r: 20 + rnd() * 70, v: 8 + rnd() * 20, ph: rnd() * 6, e: el("circle", {fill: "#fff", opacity: .09}, p)});
  return bubbles;
}
function moveBubbles(b, t) { b.forEach(o => { set(o.e, "cx", o.x + Math.sin(t * .4 + o.ph) * 30); set(o.e, "cy", ((o.y - o.v * t) % 1200 + 1200) % 1200 - 60); set(o.e, "r", o.r); }); }
function scene(name, c1, c2) { const g = el("g", {opacity: 0}, $("scenes")); const b = bg(g, c1, c2); const stage = el("g", {}, g); return {g, b, stage, name}; }

/* ---------- bike ---------- */
function makeBike(p) {
  const g = el("g", {}, p), K = {};
  const B = [-230, 90], F = [230, 90], Cr = [-10, 100];
  const wheel = c => { const w = el("g", {transform: `translate(${c[0]} ${c[1]})`}, g);
    el("circle", {r: 130, fill: "none", stroke: "#2b2d42", "stroke-width": 20}, w); el("circle", {r: 112, fill: "none", stroke: "#adb5bd", "stroke-width": 6}, w);
    const sp = el("g", {}, w); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el("line", {x1: 0, y1: 0, x2: Math.cos(a) * 110, y2: Math.sin(a) * 110, stroke: "#ced4da", "stroke-width": 3}, sp); }
    el("circle", {r: 16, fill: "#ffbe0b", stroke: INK, "stroke-width": 4}, w); return sp; };
  K.wheelB = wheel(B); K.wheelF = wheel(F);
  K.chain = el("path", {d: `M${B[0]} ${B[1] - 18} L${Cr[0]} ${Cr[1] - 30} A30 30 0 0 1 ${Cr[0]} ${Cr[1] + 30} L${B[0]} ${B[1] + 18} A18 18 0 0 1 ${B[0]} ${B[1] - 18} Z`, fill: "none", stroke: "#6c757d", "stroke-width": 8, "stroke-dasharray": "10 6"}, g);
  const fr = el("g", {stroke: "#ff4d6d", "stroke-width": 16, "stroke-linecap": "round", fill: "none"}, g);
  el("path", {d: `M${B[0]} ${B[1]} L${Cr[0]} ${Cr[1]} L-60 -80 Z M-60 -80 L170 -90 L${Cr[0]} ${Cr[1]} M170 -90 L${F[0]} ${F[1]}`}, fr);
  el("path", {d: "M170 -90 L190 -150", stroke: "#ff4d6d", "stroke-width": 14, "stroke-linecap": "round"}, g);
  K.handle = el("path", {d: "M150 -150 L240 -162", stroke: INK, "stroke-width": 12, "stroke-linecap": "round"}, g);
  el("circle", {cx: 240, cy: -162, r: 11, fill: "#ffbe0b", stroke: INK, "stroke-width": 3}, g);
  K.brake = el("path", {d: "M215 -150 L250 -128 M218 -40 L242 -40", stroke: "#e63946", "stroke-width": 8, "stroke-linecap": "round"}, g);
  K.bell = el("circle", {cx: 200, cy: -172, r: 14, fill: "#ffd60a", stroke: INK, "stroke-width": 4}, g);
  el("path", {d: "M-60 -80 L-70 -100", stroke: "#3a0ca3", "stroke-width": 10}, g);
  K.seat = el("path", {d: "M-125 -108 Q-70 -126 -20 -106 Q-70 -96 -125 -108 Z", fill: "#3a0ca3", stroke: INK, "stroke-width": 4}, g);
  const crank = el("g", {transform: `translate(${Cr[0]} ${Cr[1]})`}, g);
  el("circle", {r: 30, fill: "#ced4da", stroke: INK, "stroke-width": 4}, crank);
  K.crank = el("g", {}, crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  el("line", {x1: 0, y1: 0, x2: 0, y2: -58, stroke: INK, "stroke-width": 9, "stroke-linecap": "round"}, K.crank);
  K.pedalA = el("rect", {x: -22, y: 52, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.pedalB = el("rect", {x: -22, y: -66, width: 44, height: 14, rx: 5, fill: "#06d6a0", stroke: INK, "stroke-width": 3}, K.crank);
  K.anchor = {Pedals: [-10, 160], Chain: [-130, 98], Wheels: [-230, 90], Seat: [-72, -112], Handlebars: [195, -156], Brakes: [233, -40], Bell: [200, -172]};
  K.g = g; K.F = F; K.B = B;
  K.animate = (crankDeg, wheelDeg, chainOff) => { tf(K.crank, `rotate(${crankDeg})`); tf(K.wheelB, `rotate(${wheelDeg})`); tf(K.wheelF, `rotate(${wheelDeg})`); set(K.chain, "stroke-dashoffset", chainOff); };
  return K;
}

/* =================== SCENES (Episode 16: shadow size — two distances + ray model) =================== */
const S = {};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (h1, h2, k) => { const a = hex(h1), b = hex(h2); return "rgb(" + a.map((v, i) => Math.round(lerp(v, b[i], clamp(k)))).join(",") + ")"; };
const RAY = "#ffbe0b", CY = 480;
// torch → ball → screen diagram
function tbs(p, r = 60, sh = 520) { const g = el("g", {}, p);
  const beam = el("path", {fill: "#fff3b0", opacity: .45}, g); const scr = el("rect", {width: 34, height: sh, y: CY - sh / 2, fill: "#e9ecef", stroke: INK, "stroke-width": 6}, g);
  const shd = el("rect", {width: 34, fill: "#1b1b3a"}, g); const r1 = el("line", {stroke: RAY, "stroke-width": 5, "stroke-dasharray": "14 8"}, g), r2 = el("line", {stroke: RAY, "stroke-width": 5, "stroke-dasharray": "14 8"}, g);
  const torch = emo(g, 0, 0, 110, "🔦"); const ball = el("circle", {r, fill: "#ef476f", stroke: INK, "stroke-width": 6}, g);
  g.upd = (T, B, Sx, rr = r, k = 1) => { set(ball, "r", rr); set(ball, "cx", B); set(ball, "cy", CY); set(torch, "x", T - 40); set(torch, "y", CY); tf(torch, `rotate(135 ${T - 40} ${CY})`);
    const h = rr * (Sx - T) / (B - T); set(scr, "x", Sx); set(shd, "x", Sx); set(shd, "y", CY - h); set(shd, "height", 2 * h); op(shd, k * .9);
    set(beam, "d", `M${T} ${CY} L${Sx} ${CY - sh / 2} L${Sx} ${CY + sh / 2} Z`); op(beam, .45 * k);
    [[r1, -1], [r2, 1]].forEach(([l, sd]) => { set(l, "x1", T); set(l, "y1", CY); set(l, "x2", Sx); set(l, "y2", CY + sd * h); op(l, k); }); return h; };
  return g; }
function bracket(p, col) { const g = el("g", {}, p); const l = el("path", {fill: "none", stroke: col, "stroke-width": 7}, g); g.set = (x, y1, y2) => set(l, "d", `M${x} ${y1} h20 V${y2} h-20`); return g; }
function dist(p, col) { const g = el("g", {}, p); const l = el("line", {stroke: col, "stroke-width": 6, "marker-end": ""}, g); const t = tx(g, {"text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: col}, ""); g.set = (x1, x2, y, s) => { set(l, "x1", x1); set(l, "x2", x2); set(l, "y1", y); set(l, "y2", y); set(t, "x", (x1 + x2) / 2); set(t, "y", y - 14); t.textContent = s; }; return g; }

// ---- HOOK
S.hook = (() => { const s = scene("hook", "#3a0ca3", "#7209b7");
  s.wall = el("rect", {x: 1000, y: 140, width: 40, height: 760, fill: "#e9ecef", stroke: INK, "stroke-width": 6}, s.stage);
  s.big = tx(s.stage, {x: 760, y: 300, "text-anchor": "middle", "font-size": 130, "font-weight": 700, fill: "#fff", class: "out", "stroke-width": 14}, "GIANT 🦖"); s.tiny = tx(s.stage, {x: 760, y: 560, "text-anchor": "middle", "font-size": 60, "font-weight": 700, fill: "#ffe14d", class: "out", "stroke-width": 8}, "…or small 🐜");
  s.it = [["🔦", "torch"], ["⚽", "ball#2"], ["🧱", "wall"]].map(([e, w], i) => ({e: emo(s.stage, 0, 0, 120, e), w, i}));
  s.run = t => { const a = w => C("hook", w); const shrink = ramp(t, a("torch") - .4, a("torch"));
    op(s.big, ramp(t, a("giant"), a("giant") + .2)); tf(s.big, `translate(760 300) scale(${pop(t, a("giant")) * lerp(1, .6, shrink)}) translate(-760 -300)`);
    op(s.tiny, ramp(t, a("small"), a("small") + .2) * (1 - shrink)); op(s.wall, 0);
    s.it.forEach(i => { op(i.e, ramp(t, a(i.w), a(i.w) + .2)); set(i.e, "x", 480 + i.i * 280); set(i.e, "y", 620 + 20 * (1 - pop(t, a(i.w)))); if (i.i === 0) tf(i.e, `rotate(135 480 ${620 + 20 * (1 - pop(t, a(i.w)))})`); }); }; return s; })();

// ---- SETUP
S.setup = (() => { const s = scene("setup", "#1d3557", "#14213d");
  s.d = tbs(s.stage, 60, 440); s.lt = chip(s.stage, "torch", "#fff", {fs: 30, ink: INK}); s.lb = chip(s.stage, "ball", "#fff", {fs: 30, ink: INK}); s.ls = chip(s.stage, "screen", "#fff", {fs: 30, ink: INK});
  s.c = chip(s.stage, "SCREEN = the surface where the shadow falls", "#6c757d", {fs: 34});
  s.d1 = dist(s.stage, "#f77f00"); s.d2 = dist(s.stage, "#4cc9f0");
  s.run = t => { const a = w => C("setup", w); op(s.d, ramp(t, a("torch") - .3, a("torch"))); s.d.upd(300, 760, 1250, 60, ramp(t, a("screen"), a("screen") + .5));
    op(s.lt, ramp(t, a("torch"), a("torch") + .2)); popAt(s.lt, 260, 605, t, a("torch")); op(s.lb, ramp(t, a("ball"), a("ball") + .2)); popAt(s.lb, 760, 580, t, a("ball")); op(s.ls, ramp(t, a("screen"), a("screen") + .2)); popAt(s.ls, 1267, 215, t, a("screen"));
    op(s.c, ramp(t, a("surface"), a("surface") + .2)); popAt(s.c, 760, 130, t, a("surface"));
    s.d1.set(300, 700, 762, "distance ①"); s.d2.set(820, 1240, 762, "distance ②"); op(s.d1, ramp(t, a("distances"), a("distances") + .2)); op(s.d2, ramp(t, a("distances") + .3, a("distances") + .5)); }; return s; })();

// ---- RULE 1 (move the torch)
S.rule1 = (() => { const s = scene("rule1", "#14213d", "#3a0ca3");
  s.d = tbs(s.stage); s.t = chip(s.stage, "Rule ①: move the TORCH", "#f77f00", {fs: 40}); s.c1 = chip(s.stage, "torch CLOSER ➜ BIGGER shadow", "#06d6a0", {fs: 34}); s.c2 = chip(s.stage, "torch FURTHER ➜ SMALLER shadow", "#ef476f", {fs: 34});
  s.run = t => { const a = w => C("rule1", w); const T = lerp(lerp(300, 540, ramp(t, a("closer") - .2, a("bigger"))), 140, ramp(t, a("further") - .2, a("smaller")));
    op(s.d, 1); s.d.upd(T, 760, 1250); op(s.t, 1); popAt(s.t, 820, 125, t, SC.rule1.t0);
    op(s.c1, on(t, a("bigger"), a("further"), .2)); popAt(s.c1, 680, 200, t, a("bigger")); op(s.c2, ramp(t, a("smaller"), a("smaller") + .2)); popAt(s.c2, 680, 200, t, a("smaller")); }; return s; })();

// ---- RULE 2 (move the screen)
S.rule2 = (() => { const s = scene("rule2", "#3a0ca3", "#14213d");
  s.d = tbs(s.stage); s.t = chip(s.stage, "Rule ②: move the SCREEN", "#4cc9f0", {fs: 40}); s.c1 = chip(s.stage, "screen FURTHER ➜ BIGGER shadow", "#06d6a0", {fs: 34}); s.c2 = chip(s.stage, "screen CLOSER ➜ SMALLER shadow", "#ef476f", {fs: 34});
  s.run = t => { const a = w => C("rule2", w); const Sx = lerp(lerp(1150, 1420, ramp(t, a("further") - .2, a("bigger"))), 980, ramp(t, a("closer") - .2, a("smaller")));
    op(s.d, 1); s.d.upd(300, 760, Sx); op(s.t, 1); popAt(s.t, 820, 125, t, SC.rule2.t0);
    op(s.c1, on(t, a("bigger"), a("closer"), .2)); popAt(s.c1, 620, 198, t, a("bigger")); op(s.c2, ramp(t, a("smaller"), a("smaller") + .2)); popAt(s.c2, 620, 198, t, a("smaller")); }; return s; })();

// ---- MOVE THE BALL
S.move = (() => { const s = scene("move", "#14213d", "#1d3557");
  s.d = tbs(s.stage, 45, 560); s.lock = chip(s.stage, "🔒 torch + screen stay still", "#6c757d", {fs: 32});
  s.c1 = chip(s.stage, "ball near TORCH (far from screen) ➜ BIG", "#06d6a0", {fs: 32}); s.c2 = chip(s.stage, "ball near SCREEN ➜ small", "#ef476f", {fs: 32}); s.c3 = chip(s.stage, "moving the ball changes BOTH distances", "#ffbe0b", {fs: 36});
  s.run = t => { const a = w => C("move", w); const B = lerp(lerp(760, 420, ramp(t, a("near") - .3, a("near") + .4)), 1150, ramp(t, a("near#2") - .3, a("near#2") + .5));
    op(s.d, 1); s.d.upd(250, B, 1300, 45); op(s.lock, on(t, a("keep"), a("near"), .2)); popAt(s.lock, 760, 135, t, a("keep"));
    op(s.c1, on(t, a("big"), a("near#2"), .2)); popAt(s.c1, 760, 135, t, a("big")); op(s.c2, on(t, a("small"), a("both"), .2)); popAt(s.c2, 760, 135, t, a("small"));
    op(s.c3, ramp(t, a("both"), a("both") + .2)); popAt(s.c3, 760, 135, t, a("both")); }; return s; })();

// ---- RAY MODEL
S.rays = (() => { const s = scene("rays", "#fff3b0", "#ffd6a5");
  const T = 220, SX = 1300, R = 40, BS = [["A", 500, "#ef476f"], ["B", 800, "#7209b7"], ["C", 1100, "#06d6a0"]];
  s.scr = el("rect", {x: SX, y: 100, width: 30, height: 760, fill: "#e9ecef", stroke: INK, "stroke-width": 6}, s.stage); s.torch = emo(s.stage, T - 40, CY, 110, "🔦");
  s.bl = BS.map(([n, x, c], i) => { const g = el("g", {}, s.stage); const h = R * (SX - T) / (x - T);
    el("line", {x1: T, y1: CY, x2: SX, y2: CY - h, stroke: c, "stroke-width": 5}, g); el("line", {x1: T, y1: CY, x2: SX, y2: CY + h, stroke: c, "stroke-width": 5}, g);
    el("circle", {cx: x, cy: CY, r: R, fill: c, stroke: INK, "stroke-width": 5, opacity: .9}, g); tx(g, {x, y: CY + 12, "text-anchor": "middle", "font-size": 34, "font-weight": 700, fill: "#fff"}, n);
    const br = bracket(g, c); br.set(SX + 40 + i * 34, CY - h, CY + h); return {g, i}; });
  s.title = chip(s.stage, "📐 a MODEL: draw straight lines", "#1b1b3a", {fs: 38}); s.c = chip(s.stage, "gap on the screen = shadow SIZE", "#f77f00", {fs: 36});
  s.run = t => { const a = w => C("rays", w);
    op(s.title, ramp(t, a("model"), a("model") + .2)); popAt(s.title, 700, 120, t, a("model")); op(s.scr, 1); op(s.torch, 1); tf(s.torch, `rotate(135 ${T - 40} ${CY})`);
    s.bl.forEach(b => { const tt = a("draw") + b.i * 1.2; op(b.g, ramp(t, tt, tt + .4)); });
    op(s.c, ramp(t, a("gap"), a("gap") + .2)); popAt(s.c, 700, 900, t, a("gap")); }; return s; })();

// ---- STREET LAMP
S.lamp = (() => { const s = scene("lamp", "#03045e", "#10002b");
  s.ground = el("rect", {x: 0, y: 820, width: 1920, height: 260, fill: "#343a40"}, s.stage);
  s.pole = el("g", {}, s.stage); el("rect", {x: 744, y: 300, width: 32, height: 520, fill: "#6c757d", stroke: INK, "stroke-width": 5}, s.pole); el("path", {d: "M700 300 H820 L800 260 H720 Z", fill: "#495057", stroke: INK, "stroke-width": 5}, s.pole);
  s.glow = el("path", {d: "M720 300 L560 820 H960 L800 300 Z", fill: "#fff3b0", opacity: .25}, s.stage); el("circle", {cx: 760, cy: 310, r: 22, fill: "#ffe14d"}, s.pole);
