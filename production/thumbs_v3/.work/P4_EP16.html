<body>

<defs>
  <!-- white sticker edge + soft drop shadow: makes the hero pop off the scene -->
  <filter id="sticker" filterUnits="userSpaceOnUse" x="-40" y="-40" width="1360" height="800">
    <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/>

    <feFlood flood-color="#fff"/><feComposite in2="d3" operator="in" result="w"/>
    <feGaussianBlur in="d" stdDeviation="9" result="b"/><feOffset in="b" dy="10" result="o"/>
    <feFlood flood-color="#0b0b25" flood-opacity=".55"/><feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="1360" height="800">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b"/><feOffset in="b" dy="9" result="o"/>
    <feFlood flood-color="#0b0b25" flood-opacity=".5"/><feComposite in2="o" operator="in" result="s"/>
    <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bgblur" filterUnits="userSpaceOnUse" x="-40" y="-40" width="1360" height="800"><feGaussianBlur stdDeviation="3.2"/></filter>
  <filter id="blur8" filterUnits="userSpaceOnUse" x="-80" y="-80" width="1440" height="880"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blur20" filterUnits="userSpaceOnUse" x="-120" y="-120" width="1520" height="960"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="sil" filterUnits="userSpaceOnUse" x="-40" y="-40" width="1360" height="800">
    <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.08  0 0 0 0 0.2  0 0 0 1 0"/><feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <linearGradient id="beamG" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff3a0" stop-opacity=".95"/><stop offset="1" stop-color="#fff3a0" stop-opacity=".35"/></linearGradient>
</defs>
<defs><radialGradient id="r45" cx="0.62" cy="0.45" r="0.75"><stop offset="0" stop-color="#fff0c2"/><stop offset="0.75" stop-color="#e8b56a"/><stop offset="1" stop-color="#8a5a3a"/></radialGradient></defs><rect width="1280" height="720" fill="url(#r45)"/><rect y="545" width="1280" height="175" fill="#5a3a6e"/><rect y="545" width="1280" height="10" fill="#1b1b3a" opacity=".35"/><defs><radialGradient id="r46" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#0b0b25" stop-opacity="0"/><stop offset="1" stop-color="#0b0b25" stop-opacity="0.5"/></radialGradient></defs><rect width="1280" height="720" fill="url(#r46)"/><polygon points="214,434 1280,-40 1280,720 214,494" fill="url(#beamG)" opacity="0.55"/><text class="em" x="985" y="300" font-size="520" text-anchor="middle" dominant-baseline="central"  filter="url(#sil)" opacity=".9">🦖</text><text class="em" x="640" y="478" font-size="104" text-anchor="middle" dominant-baseline="central"  filter="url(#sil)" opacity=".85">🦖</text><g filter="url(#sticker)"><g transform="translate(214,464) rotate(0) scale(1)" stroke="#1b1b3a" stroke-width="7" stroke-linejoin="round">
    <rect x="-215" y="-30" width="150" height="60" rx="16" fill="#19b5a5"/>
    <rect x="-180" y="-30" width="18" height="60" fill="#0e8377" stroke="none"/><rect x="-150" y="-30" width="18" height="60" fill="#0e8377" stroke="none"/>
    <rect x="-215" y="-30" width="150" height="60" rx="16" fill="none"/>
    <rect x="-128" y="-44" width="34" height="16" rx="6" fill="#ff5a5a"/>
    <path d="M-70 -30 L-8 -56 L-8 56 L-70 30 Z" fill="#0fa091"/>
    <ellipse cx="-6" cy="0" rx="15" ry="56" fill="#fff6b0"/>

<!-- brand pill -->
<g filter="url(#shadow)">
  <rect id="pill" x="38" y="22" width="500" height="70" rx="35" fill="#1b1b3a" stroke="#fff" stroke-width="4"/>
  <text id="pilltext" x="72" y="71" font-size="40" font-weight="600" fill="#fff">TheOneApp <tspan fill="#ffd23f">Explained</tspan></text>
</g>
<!-- giant two-tone title -->
<g id="title" font-weight="700" stroke-linejoin="round" stroke-linecap="round">
  <text id="t0" x="38" y="208" fill="#1b1b3a" stroke="#1b1b3a"></text>
  <text id="t1" x="38" y="208" fill="#1b1b3a" stroke="#1b1b3a"></text>
  <text id="t2" x="38" y="208"></text>
</g>
<!-- yellow idea banner -->
<g filter="url(#shadow)">
  <rect id="ban" x="38" y="572" width="900" height="112" rx="28" fill="#ffd23f" stroke="#1b1b3a" stroke-width="7"/>
  <text id="bantext" x="80" y="655" font-weight="700" fill="#1b1b3a"></text>
</g>
</svg>
<script>
const D = {"ep":16,"level":"P4","topic":"Shadows","banner":"Giant, then tiny!","scene":"shadowSize","titleMaxW":760,"video":"Make Your Shadow Giant, Then Tiny"};
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function layout(){
  // pill
  const pt = document.getElementById('pilltext');
  document.getElementById('pill').setAttribute('width', pt.getComputedTextLength() + 68);
  // title: "P4" yellow + topic white, auto-fit to titleMaxW
  const inner = `<tspan fill="#ffd23f">${esc(D.level)}</tspan><tspan fill="#fff"> ${esc(D.topic)}</tspan>`;
  const maxW = D.titleMaxW || 860; let size = D.titleSize || 150;
  const t = ['t0','t1','t2'].map(id => document.getElementById(id));
  const set = s => t.forEach(el => { el.innerHTML = inner; el.setAttribute('font-size', s); });
  set(size);
  const w = t[2].getComputedTextLength();
  if (w > maxW) { size = Math.floor(size * maxW / w); set(size); }
  const base = 96 + size * 0.80;                    // keep the cap height just under the pill
  t.forEach(el => el.setAttribute('y', base));
  t[0].innerHTML = esc(D.level + ' ' + D.topic); t[1].innerHTML = esc(D.level + ' ' + D.topic);
  t[0].setAttribute('stroke-width', size * 0.24); t[0].setAttribute('transform', 'translate(0,9)');   // dark drop
  t[1].setAttribute('stroke-width', size * 0.20);
  // banner
  const bt = document.getElementById('bantext'); bt.textContent = D.banner;
  let bs = 78; bt.setAttribute('font-size', bs);
  const bmax = (D.bannerMaxW || 1010) - 84;
  let bw = bt.getComputedTextLength();
  if (bw > bmax) { bs = Math.floor(bs * bmax / bw); bt.setAttribute('font-size', bs); bw = bt.getComputedTextLength(); }
  bt.setAttribute('y', 628 + bs * 0.35);
  document.getElementById('ban').setAttribute('width', bw + 84);
  window.TITLE_RIGHT = 38 + t[2].getComputedTextLength();
}
Promise.all(['500','600','700'].map(w => document.fonts.load(w + ' 80px Fredoka'))).then(() => document.fonts.ready).then(() => { layout(); window.READY = true; });
</script>
</body></html>
